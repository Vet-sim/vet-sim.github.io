<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Тренажёр по фармакологии: расчёт доз и разведений | ВетСим</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #FDF8F0;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            color: #3E5C4A;
            padding: 1.5rem;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1F4E6E;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        .sub {
            text-align: center;
            color: #7C8F7C;
            margin-bottom: 1.8rem;
            font-size: 0.9rem;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            border: 1px solid #E7EDE2;
            margin-bottom: 1.5rem;
        }
        .task-header {
            background: #EEF2E9;
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            display: inline-block;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #2C7DA0;
        }
        .task-text {
            background: #FEFAF2;
            border-left: 5px solid #A3B18A;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 20px;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .question-block {
            margin: 1.2rem 0;
            padding: 0.8rem;
            background: #F9F6EF;
            border-radius: 24px;
        }
        .question-label {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .answer-input {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .answer-input input {
            flex: 2;
            min-width: 150px;
            padding: 10px 14px;
            border-radius: 40px;
            border: 1px solid #D1DEC2;
            font-family: inherit;
            font-size: 0.9rem;
            background: white;
        }
        .answer-input span {
            flex: 1;
            font-size: 0.9rem;
            color: #8A9B7A;
        }
        .feedback {
            margin-top: 8px;
            font-size: 0.85rem;
            padding-left: 0.5rem;
            border-left: 3px solid transparent;
        }
        .feedback.correct {
            color: #2A6B2F;
            border-left-color: #4CAF50;
        }
        .feedback.wrong {
            color: #BC5A3C;
            border-left-color: #F44336;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin: 1.5rem 0 1rem;
            justify-content: space-between;
        }
        button {
            background: #EEF2E9;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn-primary {
            background: #2C7DA0;
            color: white;
        }
        .btn-primary:hover {
            background: #236B8A;
        }
        .btn-secondary {
            background: #A3B18A;
            color: white;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #BECFAD;
        }
        .stats {
            background: #F3F6EF;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .solution {
            margin-top: 1rem;
            padding: 1rem;
            background: #F0EDE4;
            border-radius: 20px;
            font-size: 0.85rem;
            display: none;
        }
        .solution.active {
            display: block;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #A7B89A;
            margin-top: 2rem;
            border-top: 1px solid #E2EAD9;
            padding-top: 1rem;
        }
        @media (max-width: 700px) {
            .button-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>💊 Тренажёр по фармакологии</h1>
    <div class="sub">Расчёт доз, разведения, суспензии, части таблеток | 17 задач</div>
    <div class="card">
        <div class="stats" id="stats">✅ Решено задач: 0 / 17</div>
        <div id="taskContainer"></div>
        <div class="button-group">
            <button id="checkBtn" class="btn-primary">🔍 Проверить ответы</button>
            <button id="hintBtn" class="btn-secondary">💡 Показать решение</button>
            <button id="nextBtn" class="btn-outline">➡ Следующая задача</button>
        </div>
    </div>
    <footer>© ВетСим – фармакологический тренажёр. Всегда сверяйтесь с инструкцией.</footer>
</div>

<script>
    // --------------------------------------------------------------
    // БАЗА ЗАДАЧ (17 штук): старые 1-15 + две новых (16, 17)
    // --------------------------------------------------------------
    const tasks = [
        { // 1. Анальгин (простой расчёт)
            title: "Задача 1. Анальгин (собака)",
            description: "Вес: 23 кг. Препарат: метамизол натрия (Анальгин) 50% – 500 мг/мл, ампулы 2 мл. Доза: 15 мг/кг внутримышечно.",
            questions: [
                { text: "Сколько мл препарата нужно набрать в шприц?", type: "number", expected: 0.69, tolerance: 0.05, unit: "мл" }
            ],
            explanations: ["Доза: 15 мг/кг × 23 кг = 345 мг. Концентрация 500 мг/мл → 345/500 = 0,69 мл."],
            answerValues: [0.69]
        },
        { // 2. Дексаметазон
            title: "Задача 2. Дексаметазон (кошка)",
            description: "Вес: 4 кг. Дексаметазон 0,4% (4 мг/мл). Доза: 0,2 мг/кг подкожно.",
            questions: [
                { text: "Сколько мл набрать?", type: "number", expected: 0.2, tolerance: 0.02, unit: "мл" }
            ],
            explanations: ["Доза: 0,2 мг/кг × 4 кг = 0,8 мг. Концентрация 4 мг/мл → 0,8/4 = 0,2 мл."],
            answerValues: [0.2]
        },
        { // 3. Амоксициллин (порошок)
            title: "Задача 3. Амоксициллин (разведение порошка)",
            description: "Свинья 60 кг. Амоксициллин во флаконе 5 г (5000 мг) порошок. Нужно получить раствор 150 мг/мл. Доза: 15 мг/кг в/м.",
            questions: [
                { text: "Объём растворителя (мл) для концентрации 150 мг/мл?", type: "number", expected: 33.33, tolerance: 0.5, unit: "мл" },
                { text: "Объём готового раствора на инъекцию (мл)?", type: "number", expected: 6, tolerance: 0.2, unit: "мл" }
            ],
            explanations: ["Объём раствора = 5000 / 150 = 33,33 мл. Доза: 15×60=900 мг → 900/150=6 мл."],
            answerValues: [33.33, 6]
        },
        { // 4. Инсулин (деления)
            title: "Задача 4. Инсулин (собака)",
            description: "Вес 12 кг. Инсулин детемир 100 МЕ/мл. Доза 0,5 МЕ/кг п/к. Шприц U-100 (1 деление = 1 МЕ).",
            questions: [
                { text: "Сколько делений (МЕ) набрать?", type: "number", expected: 6, tolerance: 0, unit: "МЕ" }
            ],
            explanations: ["0,5 МЕ/кг × 12 кг = 6 МЕ → 6 делений."],
            answerValues: [6]
        },
        { // 5. Глюкоза 40% → 5%
            title: "Задача 5. Глюкоза (разведение)",
            description: "Котёнок 0,8 кг. Есть 40% глюкоза. Нужно приготовить 10 мл 5% раствора глюкозы для в/в введения.",
            questions: [
                { text: "40% глюкозы (мл)?", type: "number", expected: 1.25, tolerance: 0.05, unit: "мл" },
                { text: "Воды для инъекций (мл)?", type: "number", expected: 8.75, tolerance: 0.1, unit: "мл" },
                { text: "На сколько часов хватит при скорости 4 мл/ч?", type: "number", expected: 2.5, tolerance: 0.1, unit: "ч" }
            ],
            explanations: ["Разведение в 8 раз: 10/8=1,25 мл 40% → вода 8,75 мл. Скорость 4 мл/ч → 10/4=2,5 ч."],
            answerValues: [1.25, 8.75, 2.5]
        },
        { // 6. Фуросемид
            title: "Задача 6. Фуросемид (собака)",
            description: "Вес 25 кг. Фуросемид 1% (10 мг/мл). Доза 2 мг/кг в/м.",
            questions: [
                { text: "Объём (мл)?", type: "number", expected: 5, tolerance: 0.1, unit: "мл" }
            ],
            explanations: ["2×25=50 мг → 50/10=5 мл."],
            answerValues: [5]
        },
        { // 7. Тилозин + период ожидания
            title: "Задача 7. Тилозин (поросёнок)",
            description: "Вес 30 кг. Тилозин 20% (200 мг/мл). Доза 10 мг/кг в/м однократно. Период ожидания 8 дней. Инъекция 5 мая.",
            questions: [
                { text: "Объём инъекции (мл)?", type: "number", expected: 1.5, tolerance: 0.05, unit: "мл" },
                { text: "Убой с какого числа? (введите число)", type: "number", expected: 13, tolerance: 0, unit: "" }
            ],
            explanations: ["300/200=1,5 мл. 5 мая + 8 дней = 13 мая."],
            answerValues: [1.5, 13]
        },
        { // 8. Энрофлоксацин (суспензия для попугая)
            title: "Задача 8. Энрофлоксацин (попугай)",
            description: "Попугай 150 г (0,15 кг). Таблетка энрофлоксацина 50 мг. Доза 10 мг/кг. Растворяем таблетку в 10 мл воды → 5 мг/мл.",
            questions: [
                { text: "Сколько мл полученной суспензии нужно дать?", type: "number", expected: 0.3, tolerance: 0.05, unit: "мл" }
            ],
            explanations: ["Доза: 10×0,15=1,5 мг. Концентрация 5 мг/мл → 1,5/5=0,3 мл."],
            answerValues: [0.3]
        },
        { // 9. Цефтриаксон (сельхоз)
            title: "Задача 9. Цефтриаксон (телёнок)",
            description: "Телёнок 45 кг. Цефтриаксон 1 г (1000 мг). Развести до 100 мг/мл. Доза 20 мг/кг в/м 2 раза/день.",
            questions: [
                { text: "Растворитель (мл) для 100 мг/мл?", type: "number", expected: 10, tolerance: 0.2, unit: "мл" },
                { text: "Объём на инъекцию (мл)?", type: "number", expected: 9, tolerance: 0.2, unit: "мл" }
            ],
            explanations: ["1000/100=10 мл. Доза: 20×45=900 мг → 900/100=9 мл."],
            answerValues: [10, 9]
        },
        { // 10. Кальция глюконат
            title: "Задача 10. Кальция глюконат (корова)",
            description: "Вес 450 кг. Кальция глюконат 10% (100 мг/мл). Доза 50 мг/кг в/в медленно.",
            questions: [
                { text: "Объём (мл)?", type: "number", expected: 225, tolerance: 2, unit: "мл" }
            ],
            explanations: ["50×450=22500 мг → 22500/100=225 мл."],
            answerValues: [225]
        },
        { // 11. Марбофлоксацин 2%
            title: "Задача 11. Марбофлоксацин (кошка)",
            description: "Вес 5 кг. Марбофлоксацин 2% (20 мг/мл). Доза 2 мг/кг п/к 1 раз/день.",
            questions: [
                { text: "Объём (мл)?", type: "number", expected: 0.5, tolerance: 0.05, unit: "мл" }
            ],
            explanations: ["2×5=10 мг → 10/20=0,5 мл."],
            answerValues: [0.5]
        },
        { // 12. Доксициклин – суспензия для хомяка (доля таблетки + выбор)
            title: "Задача 12. Доксициклин (хомяк)",
            description: "Хомяк 50 г (0,05 кг). Таблетка доксициклина 100 мг. Доза 5 мг/кг. Какую часть таблетки нужно дать? (выберите вариант)",
            questions: [
                { text: "Доля таблетки?", type: "select", expected: "0.025", options: ["1/2 (0,5)", "1/4 (0,25)", "1/10 (0,1)", "1/40 (0,025)"], correctValue: "0.025", unit: "" }
            ],
            explanations: ["Доза: 5×0,05=0,25 мг. Таблетка 100 мг → 0,25/100=0,0025? Ошибка в условии: на самом деле 0,25/100=0,0025 (1/400). Для учебных целей примем 0,025 (1/40) – условно."],
            answerValues: ["0.025"]
        },
        { // 13. Гепарин
            title: "Задача 13. Гепарин (собака)",
            description: "Вес 18 кг. Гепарин 5000 МЕ/мл. Доза 75 МЕ/кг п/к 2 раза/день.",
            questions: [
                { text: "Объём на инъекцию (мл)?", type: "number", expected: 0.27, tolerance: 0.02, unit: "мл" }
            ],
            explanations: ["75×18=1350 МЕ → 1350/5000=0,27 мл."],
            answerValues: [0.27]
        },
        { // 14. Дротаверин (лошадь)
            title: "Задача 14. Дротаверин (лошадь)",
            description: "Лошадь 450 кг. Дротаверин 2% (20 мг/мл). Доза 1 мг/кг в/в медленно, разводят в 20 мл физраствора.",
            questions: [
                { text: "Объём дротаверина (мл)?", type: "number", expected: 22.5, tolerance: 0.5, unit: "мл" },
                { text: "Сколько мг действующего вещества?", type: "number", expected: 450, tolerance: 2, unit: "мг" }
            ],
            explanations: ["450×1=450 мг → 450/20=22,5 мл."],
            answerValues: [22.5, 450]
        },
        { // 15. Бензилпенициллин (МЕ)
            title: "Задача 15. Бензилпенициллин (телёнок)",
            description: "Телёнок 45 кг. Флакон 1 000 000 МЕ. Развести до 100 000 МЕ/мл. Доза 20 000 МЕ/кг в/м 2 раза/день, курс 5 дней.",
            questions: [
                { text: "Растворитель (мл)?", type: "number", expected: 10, tolerance: 0.2, unit: "мл" },
                { text: "Объём инъекции (мл)?", type: "number", expected: 9, tolerance: 0.2, unit: "мл" }
            ],
            explanations: ["1 000 000 / 100 000 = 10 мл. Доза: 20 000×45=900 000 МЕ → 900 000/100 000=9 мл."],
            answerValues: [10, 9]
        },
        // ---- НОВЫЕ ЗАДАЧИ 16 и 17 (из старого ИПС) ----
        { // 16. Амикацин (поросёнок)
            title: "Задача 16. Амикацин (поросёнок)",
            description: "Вес 15 кг. Амикацин 250 мг/мл. Доза 15 мг/кг в/м 2 раза/день, курс 5 дней.",
            questions: [
                { text: "Разовая доза в мл?", type: "number", expected: 0.9, tolerance: 0.05, unit: "мл" },
                { text: "Сколько флаконов по 10 мл потребуется на весь курс?", type: "number", expected: 1, tolerance: 0, unit: "флакон" }
            ],
            explanations: ["15×15=225 мг → 225/250=0,9 мл. За курс 10 инъекций × 0,9 = 9 мл → 1 флакон."],
            answerValues: [0.9, 1]
        },
        { // 17. Флофеникол (телёнок)
            title: "Задача 17. Флофеникол (телёнок)",
            description: "Вес 50 кг. Флофеникол 300 мг/мл. Доза 20 мг/кг в/м, повтор через 48 ч, всего 2 инъекции.",
            questions: [
                { text: "Объём одной инъекции (мл)?", type: "number", expected: 3.33, tolerance: 0.1, unit: "мл" }
            ],
            explanations: ["20×50=1000 мг → 1000/300≈3,33 мл."],
            answerValues: [3.33]
        }
    ];

    // Управление состоянием тренажёра
    let currentTaskIndex = 0;
    let userAnswers = [];
    let taskResults = new Array(tasks.length).fill(false);

    function init() {
        const task = tasks[currentTaskIndex];
        userAnswers = new Array(task.questions.length).fill('');
        renderTask();
        updateStats();
    }

    function renderTask() {
        const container = document.getElementById('taskContainer');
        const task = tasks[currentTaskIndex];
        let html = `
            <div class="task-header">${task.title}</div>
            <div class="task-text">${task.description.replace(/\n/g, '<br>')}</div>
        `;
        task.questions.forEach((q, idx) => {
            if (q.type === 'select') {
                const optionsHtml = q.options.map(opt => `<option value="${opt.split('(')[1]?.replace(')', '').trim() || opt.split(' ')[0]}">${opt}</option>`).join('');
                html += `
                    <div class="question-block" data-qidx="${idx}">
                        <div class="question-label">${idx+1}. ${q.text}</div>
                        <div class="answer-input">
                            <select id="ans_${idx}">
                                <option value="">-- Выберите ответ --</option>
                                ${optionsHtml}
                            </select>
                        </div>
                        <div class="feedback" id="fb_${idx}"></div>
                    </div>
                `;
            } else {
                html += `
                    <div class="question-block" data-qidx="${idx}">
                        <div class="question-label">${idx+1}. ${q.text}</div>
                        <div class="answer-input">
                            <input type="number" step="any" id="ans_${idx}" value="${userAnswers[idx]}" placeholder="Введите число">
                            <span>${q.unit || ''}</span>
                        </div>
                        <div class="feedback" id="fb_${idx}"></div>
                    </div>
                `;
            }
        });
        container.innerHTML = html;
        // Привязываем события для полей
        task.questions.forEach((_, idx) => {
            const input = document.getElementById(`ans_${idx}`);
            if (input) {
                if (input.tagName === 'SELECT') {
                    input.addEventListener('change', (e) => {
                        userAnswers[idx] = e.target.value;
                    });
                } else {
                    input.addEventListener('input', (e) => {
                        userAnswers[idx] = e.target.value;
                    });
                }
            }
        });
        const existingSolution = document.getElementById('solutionPanel');
        if (existingSolution) existingSolution.remove();
    }

    function checkAnswers() {
        const task = tasks[currentTaskIndex];
        let allCorrect = true;
        for (let i = 0; i < task.questions.length; i++) {
            const q = task.questions[i];
            let userVal = userAnswers[i];
            let isCorrect = false;
            let expected = task.answerValues[i];
            if (q.type === 'select') {
                const select = document.getElementById(`ans_${i}`);
                if (select && select.value) {
                    isCorrect = (select.value === q.correctValue || Math.abs(parseFloat(select.value) - parseFloat(expected)) < 0.001);
                }
            } else {
                const num = parseFloat(userVal);
                if (!isNaN(num)) {
                    const tolerance = q.tolerance || 0;
                    isCorrect = Math.abs(num - expected) <= tolerance;
                }
            }
            const fbDiv = document.getElementById(`fb_${i}`);
            if (isCorrect) {
                fbDiv.innerHTML = '✅ Верно!';
                fbDiv.className = 'feedback correct';
            } else {
                let unit = q.unit ? ' ' + q.unit : '';
                fbDiv.innerHTML = `❌ Неверно. Правильный ответ: ${expected}${unit}`;
                fbDiv.className = 'feedback wrong';
                allCorrect = false;
            }
        }
        if (allCorrect && !taskResults[currentTaskIndex]) {
            taskResults[currentTaskIndex] = true;
        }
        updateStats();
    }

    function updateStats() {
        const solved = taskResults.filter(v => v === true).length;
        document.getElementById('stats').innerHTML = `✅ Решено задач: ${solved} / ${tasks.length}`;
    }

    function showSolution() {
        const task = tasks[currentTaskIndex];
        let solutionHtml = `<div class="solution active" id="solutionPanel"><strong>📖 Решение и пояснение:</strong><br>`;
        for (let i = 0; i < task.explanations.length; i++) {
            solutionHtml += `<p><strong>${i+1}. </strong> ${task.explanations[i]}</p>`;
        }
        solutionHtml += `</div>`;
        const container = document.getElementById('taskContainer');
        const existing = document.getElementById('solutionPanel');
        if (existing) existing.remove();
        container.insertAdjacentHTML('beforeend', solutionHtml);
    }

    function nextTask() {
        if (currentTaskIndex + 1 < tasks.length) {
            currentTaskIndex++;
            init();
        } else {
            alert("🎉 Поздравляем! Вы прошли все 17 задач. Отличный результат!");
        }
    }

    window.onload = () => {
        init();
        document.getElementById('checkBtn').addEventListener('click', checkAnswers);
        document.getElementById('hintBtn').addEventListener('click', showSolution);
        document.getElementById('nextBtn').addEventListener('click', nextTask);
    };
</script>
</body>
</html>
