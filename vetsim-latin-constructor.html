<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Veterinaria Latina · Конструктор · ВетСим</title>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
            background: #F4F7F9;
            color: #1A2A3A;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 2rem;
            padding: 28px 32px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 14px;
            border-bottom: 2px solid #E7EDE2;
            margin-bottom: 18px;
        }
        .header .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2C7DA0;
        }
        .header .logo .gradient {
            background: linear-gradient(135deg, #2C7DA0, #6B9E6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .meta {
            text-align: right;
            font-size: 0.8rem;
            color: #5F7C62;
        }

        /* ===== ВКЛАДКИ ===== */
        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .tab-btn {
            background: #EBE3D2;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            color: #3E5C4A;
        }
        .tab-btn:hover { opacity: 0.85; }
        .tab-btn.active {
            background: #2C7DA0;
            color: white;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .tab-content.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== ФОРМЫ ===== */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
            margin-bottom: 12px;
        }
        .form-grid .full-width {
            grid-column: 1 / -1;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .field label {
            font-weight: 600;
            font-size: 0.7rem;
            color: #5F7C62;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .field input,
        .field select,
        .field textarea {
            padding: 6px 12px;
            border: 1px solid #D9D0BD;
            border-radius: 1rem;
            font-family: inherit;
            font-size: 0.85rem;
            background: #FEFAF2;
            color: #1A2A3A;
            outline: none;
            transition: 0.15s;
            width: 100%;
        }
        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: #2C7DA0;
            box-shadow: 0 0 0 3px rgba(44,125,160,0.08);
        }
        .field textarea {
            resize: vertical;
            min-height: 36px;
        }

        /* ===== КАРТОЧКА СЛОВА ===== */
        .word-card {
            background: #F9FBF8;
            border-radius: 1rem;
            padding: 10px 14px;
            margin-bottom: 6px;
            border-left: 4px solid #A3B18A;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
        }
        .word-card .nom {
            font-weight: 700;
            font-size: 0.9rem;
            color: #2C7DA0;
            min-width: 70px;
        }
        .word-card .gen {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1A2A3A;
            min-width: 70px;
        }
        .word-card .trans {
            font-size: 0.85rem;
            color: #5F7C62;
            flex: 1;
        }
        .word-card .decl {
            font-size: 0.7rem;
            background: #E7EDE2;
            padding: 0 10px;
            border-radius: 40px;
            font-weight: 600;
            color: #3E5C4A;
        }
        .word-card .actions {
            display: flex;
            gap: 4px;
        }
        .word-card .actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 40px;
        }
        .word-card .actions button:hover { background: #ede7dd; }
        .word-card .actions .edit-btn { color: #2C7DA0; }
        .word-card .actions .delete-btn { color: #b13e3e; }

        /* ===== КНОПКИ ===== */
        .btn {
            background: #EBE3D2;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            font-size: 0.8rem;
            color: #1A2A3A;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-primary { background: #2C7DA0; color: white; }
        .btn-primary:hover { background: #236B8A; }
        .btn-success { background: #6B9E6B; color: white; }
        .btn-success:hover { background: #5A865A; }
        .btn-danger { background: #b13e3e; color: white; }
        .btn-danger:hover { background: #8f2e2e; }
        .btn-outline { background: transparent; border: 1px solid #D9D0BD; }
        .btn-outline:hover { background: #F0EEE5; }
        .btn-warning { background: #D4A373; color: white; }
        .btn-warning:hover { background: #c49264; }
        .btn-sm { padding: 3px 12px; font-size: 0.7rem; }

        /* ===== СПИСОК СЛОВ ===== */
        .word-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .word-list::-webkit-scrollbar {
            width: 5px;
        }
        .word-list::-webkit-scrollbar-track {
            background: #ede7dd;
            border-radius: 10px;
        }
        .word-list::-webkit-scrollbar-thumb {
            background: #A3B18A;
            border-radius: 10px;
        }

        .word-count {
            font-size: 0.8rem;
            color: #5F7C62;
            margin-bottom: 10px;
        }

        /* ===== ЭКСПОРТ ===== */
        .export-area {
            background: #F0F7FA;
            border-radius: 1rem;
            padding: 14px 18px;
            margin-top: 12px;
            border: 1px solid #D4E8F0;
        }
        .export-area textarea {
            width: 100%;
            padding: 8px 14px;
            border: 1px solid #D9D0BD;
            border-radius: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            background: white;
            outline: none;
            resize: vertical;
            min-height: 120px;
        }
        .export-area textarea:focus {
            border-color: #2C7DA0;
        }

        /* ===== ПЕЧАТЬ ===== */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border-radius: 0; padding: 16px 20px; }
            .no-print { display: none !important; }
            .tab-content { display: block !important; }
            .tab-btn { display: none; }
            .word-list { max-height: none; overflow: visible; }
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 700px) {
            .container { padding: 14px; }
            .form-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: stretch; }
            .header .meta { text-align: left; }
            .word-card { flex-direction: column; align-items: stretch; }
            .word-card .nom { min-width: unset; }
            .word-card .gen { min-width: unset; }
            .tabs .tab-btn { flex: 1; text-align: center; font-size: 0.7rem; padding: 4px 8px; }
        }
        @media (max-width: 420px) {
            .container { padding: 10px; }
            .export-area { padding: 10px 12px; }
            .actions .btn { flex: 1; justify-content: center; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- ===== ШАПКА ===== -->
    <header class="header">
        <div class="logo">📚 <span class="gradient">Veterinaria Latina</span> · Конструктор</div>
        <div class="meta">
            <div id="wordCountDisplay">Слов: <span id="wordCount">0</span></div>
            <div style="font-size:0.7rem; color:#8A9B7A;">v.1.0 · ВетСим</div>
        </div>
    </header>

    <!-- ===== ВКЛАДКИ ===== -->
    <div class="tabs no-print">
        <button class="tab-btn active" data-tab="editor">✏️ Редактор слов</button>
        <button class="tab-btn" data-tab="trainer">🎮 Тренажёр</button>
        <button class="tab-btn" data-tab="export">📤 Экспорт</button>
    </div>

    <!-- ===== ВКЛАДКА 1: РЕДАКТОР ===== -->
    <div class="tab-content active" id="tab-editor">
        <div class="form-grid" id="wordForm">
            <div class="field">
                <label>Nom. sg. (именительный)</label>
                <input type="text" id="wordNom" placeholder="canis" />
            </div>
            <div class="field">
                <label>Gen. sg. (родительный)</label>
                <input type="text" id="wordGen" placeholder="canis" />
            </div>
            <div class="field">
                <label>Перевод</label>
                <input type="text" id="wordTrans" placeholder="собака" />
            </div>
            <div class="field">
                <label>Склонение</label>
                <select id="wordDecl">
                    <option value="I">I склонение</option>
                    <option value="II">II склонение</option>
                    <option value="III">III склонение</option>
                    <option value="IV">IV склонение</option>
                    <option value="V">V склонение</option>
                </select>
            </div>
            <div class="field full-width" style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn btn-success" id="addWordBtn">➕ Добавить</button>
                <button class="btn btn-outline" id="editWordBtn" style="display:none;">💾 Обновить</button>
                <button class="btn btn-outline" id="cancelEditBtn" style="display:none;">✖ Отмена</button>
                <button class="btn btn-primary" id="loadExampleBtn">📂 Загрузить пример</button>
                <button class="btn btn-danger" id="clearAllBtn">🗑️ Очистить всё</button>
            </div>
        </div>

        <div class="word-count">📚 Всего слов: <span id="wordCountList">0</span></div>
        <div class="word-list" id="wordList">
            <!-- рендерится JS -->
        </div>
    </div>

    <!-- ===== ВКЛАДКА 2: ТРЕНАЖЁР ===== -->
    <div class="tab-content" id="tab-trainer">
        <div id="trainerArea">
            <!-- рендерится JS -->
        </div>
    </div>

    <!-- ===== ВКЛАДКА 3: ЭКСПОРТ ===== -->
    <div class="tab-content" id="tab-export">
        <div class="export-area">
            <label style="font-weight:600;font-size:0.8rem;color:#2C7DA0;">📤 Экспортировать готовый тренажёр</label>
            <p style="font-size:0.75rem;color:#5F7C62;margin:4px 0 8px;">
                Нажмите кнопку ниже, чтобы создать самостоятельный HTML-файл с тренажёром на основе вашего словаря.
            </p>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn btn-primary" id="exportTrainerBtn">📤 Экспортировать HTML</button>
                <button class="btn btn-outline" id="exportJsonBtn">📄 Экспорт JSON</button>
                <button class="btn btn-outline" id="importJsonBtn">📂 Импорт JSON</button>
            </div>
            <div style="margin-top:10px;">
                <label style="font-weight:600;font-size:0.75rem;color:#5F7C62;">JSON-данные:</label>
                <textarea id="jsonData" rows="4" placeholder="Здесь появится JSON или вы можете вставить его для импорта..."></textarea>
            </div>
        </div>
    </div>

    <!-- ===== ПОДВАЛ ===== -->
    <div style="margin-top:20px; text-align:center; font-size:0.7rem; color:#8A9B7A; border-top:1px solid #f0ebe3; padding-top:12px;">
        © ВетСим — ветеринарное просвещение · Veterinaria Latina
    </div>
</div>

<script>
    // ================================================================
    //  VETERINARIA LATINA — ПОЛНАЯ ЛОГИКА
    // ================================================================

    // ===== НАЧАЛЬНЫЙ СЛОВАРЬ (ВЕТЕРИНАРНАЯ ТЕРМИНОЛОГИЯ) =====
    const DEFAULT_WORDS = [
        { nom: 'costa', gen: 'costae', trans: 'ребро', decl: 'I' },
        { nom: 'vena', gen: 'venae', trans: 'вена', decl: 'I' },
        { nom: 'arteria', gen: 'arteriae', trans: 'артерия', decl: 'I' },
        { nom: 'fractura', gen: 'fracturae', trans: 'перелом', decl: 'I' },
        { nom: 'gingiva', gen: 'gingivae', trans: 'десна', decl: 'I' },
        { nom: 'lingua', gen: 'linguae', trans: 'язык', decl: 'I' },
        { nom: 'vacca', gen: 'vaccae', trans: 'корова', decl: 'I' },
        { nom: 'vesica', gen: 'vesicae', trans: 'пузырь', decl: 'I' },
        { nom: 'musculus', gen: 'musculi', trans: 'мышца', decl: 'II' },
        { nom: 'nervus', gen: 'nervi', trans: 'нерв', decl: 'II' },
        { nom: 'nucleus', gen: 'nuclei', trans: 'ядро', decl: 'II' },
        { nom: 'digitus', gen: 'digiti', trans: 'палец', decl: 'II' },
        { nom: 'ventriculus', gen: 'ventriculi', trans: 'желудок', decl: 'II' },
        { nom: 'intestinum', gen: 'intestini', trans: 'кишечник', decl: 'II' },
        { nom: 'cerebrum', gen: 'cerebri', trans: 'головной мозг', decl: 'II' },
        { nom: 'canis', gen: 'canis', trans: 'собака', decl: 'III' },
        { nom: 'felis', gen: 'felis', trans: 'кошка', decl: 'III' },
        { nom: 'ovis', gen: 'ovis', trans: 'овца', decl: 'III' },
        { nom: 'cor', gen: 'cordis', trans: 'сердце', decl: 'III' },
        { nom: 'hepar', gen: 'hepatis', trans: 'печень', decl: 'III' },
        { nom: 'ren', gen: 'renis', trans: 'почка', decl: 'III' },
        { nom: 'pulmo', gen: 'pulmonis', trans: 'лёгкое', decl: 'III' },
        { nom: 'vulnus', gen: 'vulneris', trans: 'рана', decl: 'III' },
        { nom: 'caput', gen: 'capitis', trans: 'голова', decl: 'III' },
        { nom: 'pes', gen: 'pedis', trans: 'стопа, лапа', decl: 'III' },
        { nom: 'os', gen: 'ossis', trans: 'кость', decl: 'III' },
        { nom: 'dens', gen: 'dentis', trans: 'зуб', decl: 'III' },
        { nom: 'testis', gen: 'testis', trans: 'семенник', decl: 'III' },
        { nom: 'cornu', gen: 'cornus', trans: 'рог', decl: 'IV' },
        { nom: 'genu', gen: 'genus', trans: 'колено', decl: 'IV' },
        { nom: 'processus', gen: 'processus', trans: 'отросток', decl: 'IV' },
        { nom: 'meatus', gen: 'meatus', trans: 'проход', decl: 'IV' },
        { nom: 'sinus', gen: 'sinus', trans: 'пазуха', decl: 'IV' },
        { nom: 'species', gen: 'speciei', trans: 'вид', decl: 'V' },
        { nom: 'facies', gen: 'faciei', trans: 'лицо, поверхность', decl: 'V' },
        { nom: 'rabies', gen: 'rabiei', trans: 'бешенство', decl: 'V' }
    ];

    // ===== СОСТОЯНИЕ =====
    let words = [];
    let editingIndex = -1;
    let currentWordIndex = 0;
    let score = { correct: 0, total: 0 };
    let answered = false;
    let selectedDecl = null;
    let selectedGenEnding = null;

    const genEndings = {
        I: '-ae',
        II: '-i',
        III: '-is',
        IV: '-us',
        V: '-ei'
    };
    const declOptions = ['I', 'II', 'III', 'IV', 'V'];

    // ===== DOM-СВЯЗИ =====
    const wordList = document.getElementById('wordList');
    const wordCountDisplay = document.getElementById('wordCount');
    const wordCountList = document.getElementById('wordCountList');
    const trainerArea = document.getElementById('trainerArea');

    const wordNom = document.getElementById('wordNom');
    const wordGen = document.getElementById('wordGen');
    const wordTrans = document.getElementById('wordTrans');
    const wordDecl = document.getElementById('wordDecl');
    const addWordBtn = document.getElementById('addWordBtn');
    const editWordBtn = document.getElementById('editWordBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const loadExampleBtn = document.getElementById('loadExampleBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const exportTrainerBtn = document.getElementById('exportTrainerBtn');
    const exportJsonBtn = document.getElementById('exportJsonBtn');
    const importJsonBtn = document.getElementById('importJsonBtn');
    const jsonData = document.getElementById('jsonData');

    // ================================================================
    //  ВСПОМОГАТЕЛЬНЫЕ
    // ================================================================
    function showToast(msg) {
        const existing = document.querySelector('.toast-message');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.textContent = msg;
        Object.assign(toast.style, {
            position: 'fixed',
            bottom: '30px',
            left: '50%',
            transform: 'translateX(-50%)',
            background: '#1F4E6E',
            color: 'white',
            padding: '10px 24px',
            borderRadius: '40px',
            fontWeight: '600',
            fontSize: '0.85rem',
            boxShadow: '0 4px 16px rgba(0,0,0,0.15)',
            zIndex: '2000',
            maxWidth: '90%',
            textAlign: 'center',
            opacity: '0',
            transition: 'opacity 0.3s ease',
            pointerEvents: 'none'
        });
        document.body.appendChild(toast);
        requestAnimationFrame(() => toast.style.opacity = '1');
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getDeclLabel(decl) {
        const map = { I: 'I', II: 'II', III: 'III', IV: 'IV', V: 'V' };
        return map[decl] || decl;
    }

    function getRandomWord() {
        if (words.length === 0) return null;
        return words[currentWordIndex] || words[0];
    }

    // ================================================================
    //  СОХРАНЕНИЕ
    // ================================================================
    function saveState() {
        try {
            localStorage.setItem('vetsim_latin_words', JSON.stringify(words));
        } catch (e) {}
    }

    function loadState() {
        try {
            const raw = localStorage.getItem('vetsim_latin_words');
            if (raw) {
                const data = JSON.parse(raw);
                if (data && data.length > 0) {
                    words = data;
                    return true;
                }
            }
        } catch (e) {}
        return false;
    }

    // ================================================================
    //  РЕНДЕР
    // ================================================================
    function renderWordList() {
        if (words.length === 0) {
            wordList.innerHTML = `
                <div style="text-align:center;padding:30px 10px;color:#8A9B7A;">
                    <span style="font-size:2rem;display:block;margin-bottom:8px;">📚</span>
                    Словарь пуст. Добавьте слова вручную или загрузите пример.
                </div>
            `;
        } else {
            let html = '';
            words.forEach((w, idx) => {
                html += `
                    <div class="word-card">
                        <span class="nom">${escapeHtml(w.nom)}</span>
                        <span class="gen">${escapeHtml(w.gen)}</span>
                        <span class="trans">${escapeHtml(w.trans)}</span>
                        <span class="decl">${getDeclLabel(w.decl)}</span>
                        <div class="actions no-print">
                            <button class="edit-btn" data-index="${idx}" title="Редактировать">✏️</button>
                            <button class="delete-btn" data-index="${idx}" title="Удалить">🗑️</button>
                        </div>
                    </div>
                `;
            });
            wordList.innerHTML = html;

            wordList.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    editWord(idx);
                });
            });

            wordList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    if (confirm(`Удалить слово "${words[idx].nom}"?`)) {
                        words.splice(idx, 1);
                        renderAll();
                        saveState();
                        showToast('🗑️ Слово удалено');
                    }
                });
            });
        }

        wordCountDisplay.textContent = words.length;
        wordCountList.textContent = words.length;
    }

    // ================================================================
    //  ТРЕНАЖЁР (ИСПРАВЛЕННЫЙ)
    // ================================================================
    function renderTrainer() {
        if (words.length === 0) {
            trainerArea.innerHTML = `
                <div style="text-align:center;padding:40px 20px;color:#8A9B7A;">
                    <span style="font-size:3rem;display:block;margin-bottom:12px;">📚</span>
                    <p>Словарь пуст. Добавьте слова или загрузите пример.</p>
                    <button class="btn btn-primary" style="margin-top:12px;" onclick="document.querySelector('[data-tab=\\'editor\\']').click()">✏️ Перейти к редактору</button>
                </div>
            `;
            return;
        }

        // Если currentWordIndex вышел за пределы — сбрасываем
        if (currentWordIndex >= words.length) currentWordIndex = 0;

        const word = words[currentWordIndex];
        if (!word) {
            currentWordIndex = 0;
            renderTrainer();
            return;
        }

        // Автоматически устанавливаем склонение и окончание при загрузке слова
        // если они ещё не выбраны или если сменилось слово (проверяем по индексу)
        if (selectedDecl === null || selectedDecl !== word.decl) {
            selectedDecl = word.decl;
        }
        const correctEnding = genEndings[word.decl];

    let feedbackMessage = '';
    let feedbackColor = '#F9FBF8';
    let feedbackTextColor = '#1A2A3A';

    function renderAll() {
        renderWordList();
        renderTrainer();
        // Обновляем JSON-данные
        jsonData.value = JSON.stringify(words, null, 2);
    }

    // ================================================================
    //  УПРАВЛЕНИЕ СЛОВАМИ
    // ================================================================
    function addWord() {
        const nom = wordNom.value.trim();
        const gen = wordGen.value.trim();
        const trans = wordTrans.value.trim();
        const decl = wordDecl.value;

        if (!nom || !gen || !trans) {
            showToast('⚠️ Заполните все поля');
            return;
        }

        // Проверка на дубликат
        if (words.some(w => w.nom.toLowerCase() === nom.toLowerCase())) {
            showToast('⚠️ Слово уже есть в словаре');
            return;
        }

        words.push({ nom, gen, trans, decl });
        wordNom.value = '';
        wordGen.value = '';
        wordTrans.value = '';
        wordDecl.value = 'I';
        renderAll();
        saveState();
        showToast('✅ Слово добавлено');
    }

    function editWord(index) {
        const w = words[index];
        wordNom.value = w.nom;
        wordGen.value = w.gen;
        wordTrans.value = w.trans;
        wordDecl.value = w.decl;
        editingIndex = index;
        addWordBtn.style.display = 'none';
        editWordBtn.style.display = 'inline-flex';
        cancelEditBtn.style.display = 'inline-flex';
        showToast('✏️ Редактирование слова');
    }

    function saveEdit() {
        const nom = wordNom.value.trim();
        const gen = wordGen.value.trim();
        const trans = wordTrans.value.trim();
        const decl = wordDecl.value;

        if (!nom || !gen || !trans) {
            showToast('⚠️ Заполните все поля');
            return;
        }

        words[editingIndex] = { nom, gen, trans, decl };
        cancelEdit();
        renderAll();
        saveState();
        showToast('✅ Слово обновлено');
    }

    function cancelEdit() {
        wordNom.value = '';
        wordGen.value = '';
        wordTrans.value = '';
        wordDecl.value = 'I';
        editingIndex = -1;
        addWordBtn.style.display = 'inline-flex';
        editWordBtn.style.display = 'none';
        cancelEditBtn.style.display = 'none';
    }

    function loadExample() {
        if (words.length > 0) {
            if (!confirm('Загрузить пример? Текущие слова будут заменены.')) return;
        }
        words = DEFAULT_WORDS.map(w => ({ ...w }));
        cancelEdit();
        renderAll();
        resetScore();
        saveState();
        showToast('📂 Пример загружен');
    }

    function clearAll() {
        if (words.length === 0) return;
        if (!confirm('Удалить все слова?')) return;
        words = [];
        cancelEdit();
        renderAll();
        resetScore();
        saveState();
        showToast('🗑️ Все слова удалены');
    }

    // ================================================================
    //  ТРЕНАЖЁР — ПРОВЕРКА ОТВЕТА
    // ================================================================
    function checkAnswer() {
        if (answered || words.length === 0) return;

        const word = words[currentWordIndex];
        if (!word) return;

        const answerInput = document.getElementById('trainerAnswer');
        const userAnswer = answerInput ? answerInput.value.trim().toLowerCase() : '';

        score.total++;

        // Проверяем склонение
        const declCorrect = selectedDecl === word.decl;

        // Проверяем окончание
        const correctEnding = genEndings[word.decl];
        const endingCorrect = selectedGenEnding === correctEnding;

        // Проверяем форму родительного падежа
        const genCorrect = userAnswer === word.gen.toLowerCase();

        const allCorrect = declCorrect && endingCorrect && genCorrect;

        if (allCorrect) {
            score.correct++;
            feedbackMessage = '🎉 Отлично! Всё верно!';
            feedbackColor = '#E8F5E8';
            feedbackTextColor = '#2E7D32';
        } else {
            let errors = [];
            if (!declCorrect) errors.push('склонение');
            if (!endingCorrect) errors.push('окончание');
            if (!genCorrect) errors.push('форма родительного падежа');
            feedbackMessage = `❌ Ошибка: ${errors.join(', ')}. Правильно: ${word.nom} → ${word.gen} (${word.decl} склонение, окончание ${correctEnding})`;
            feedbackColor = '#FDF0E8';
            feedbackTextColor = '#b13e3e';
        }

        answered = true;
        renderTrainer();
    }

    function nextWord() {
        if (words.length === 0) return;
        currentWordIndex = (currentWordIndex + 1) % words.length;

        // Автоматически устанавливаем склонение и окончание для нового слова
        const word = words[currentWordIndex];
        if (word) {
            selectedDecl = word.decl;
            selectedGenEnding = genEndings[word.decl];
        }

        feedbackMessage = '';
        answered = false;
        renderTrainer();
    }

    function resetScore() {
        score.correct = 0;
        score.total = 0;
        currentWordIndex = 0;

        // Устанавливаем склонение и окончание для первого слова
        if (words.length > 0) {
            const word = words[0];
            selectedDecl = word.decl;
            selectedGenEnding = genEndings[word.decl];
        }

        feedbackMessage = '';
        answered = false;
        renderTrainer();
        showToast('🔄 Счёт сброшен');
    }

    //  ГЛОБАЛЬНЫЕ ФУНКЦИИ ДЛЯ ONCLICK (используются в HTML)
    // ================================================================
    window.selectDecl = function(decl) {
        if (answered) return;
        selectedDecl = decl;
        renderTrainer();
    };

    window.selectGenEnding = function(ending) {
        if (answered) return;
        selectedGenEnding = ending;
        renderTrainer();
    };

        <body>

        <script>
            const WORDS = ${data};

            let score = { correct: 0, total: 0 };
            let answered = false;
            let selectedDecl = null;
            let selectedEnding = null;

            const genEndings = { I: '-ae', II: '-i', III: '-is', IV: '-us', V: '-ei' };

            function setDefaultsForWord(index) {
                const word = WORDS[index];
                if (word) {
                    selectedDecl = word.decl;
                    selectedEnding = genEndings[word.decl];
                }
            }

            function render() {
                if (WORDS.length === 0) {

                    return;

                if (selectedDecl === null || selectedEnding === null) {
                    setDefaultsForWord(currentIndex);

                const word = WORDS[currentIndex];
                document.getElementById('progress').textContent = \`\${currentIndex + 1} из \${WORDS.length}\`;
                document.getElementById('score').textContent = \`✅ \${score.correct} / \${score.total}\`;

                if (answered) {
                    document.getElementById('answerInput').disabled = true;
                    document.getElementById('checkBtn').disabled = true;

            function checkAnswer() {
                if (answered) return;
                const word = WORDS[currentIndex];
                const userAnswer = document.getElementById('answerInput').value.trim().toLowerCase();

                const declCorrect = selectedDecl === word.decl;
                const endingCorrect = selectedEnding === genEndings[word.decl];
                const genCorrect = userAnswer === word.gen.toLowerCase();

                const allCorrect = declCorrect && endingCorrect && genCorrect;
                score.total++;

                const feedback = document.getElementById('feedback');
                if (allCorrect) {
                    score.correct++;
                    feedback.className = 'feedback correct';
                    feedback.textContent = '🎉 Отлично! Всё верно!';
                } else {
                    let errors = [];
                    if (!declCorrect) errors.push('склонение');
                    if (!endingCorrect) errors.push('окончание');
                    if (!genCorrect) errors.push('форма Gen. sg.');
                    feedback.className = 'feedback wrong';
                    feedback.textContent = \`❌ Ошибка: \${errors.join(', ')}. Правильно: \${word.nom} → \${word.gen} (\${word.decl} склонение, окончание \${genEndings[word.decl]})\`;

    function importJSON() {
        try {
            const data = JSON.parse(jsonData.value);
            if (Array.isArray(data) && data.length > 0 && data[0].nom && data[0].gen) {
                if (words.length > 0) {
                    if (!confirm('Импортировать слова? Текущие слова будут заменены.')) return;

                words = data;
                cancelEdit();
                renderAll();
                resetScore();
                saveState();
                showToast('📂 Слова импортированы');

                showToast('❌ Неверный формат JSON');

        } catch (e) {
            showToast('❌ Ошибка парсинга JSON');
        }

    function initTabs() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('tab-' + this.dataset.tab).classList.add('active');
                if (this.dataset.tab === 'trainer') resetScore();
                if (this.dataset.tab === 'export') {
                    jsonData.value = JSON.stringify(words, null, 2);
                }
            });
        });
    }

    // ================================================================
    function init() {
        const loaded = loadState();
        if (!loaded) {
            words = DEFAULT_WORDS.map(w => ({ ...w }));
            saveState();
        }

        // Инициализируем тренажёр первым словом
        if (words.length > 0) {
            const word = words[0];
            selectedDecl = word.decl;
            selectedGenEnding = genEndings[word.decl];
        }

        initTabs();
        renderAll();

        // Обработчики
        addWordBtn.addEventListener('click', addWord);
        editWordBtn.addEventListener('click', saveEdit);
        cancelEditBtn.addEventListener('click', cancelEdit);
        loadExampleBtn.addEventListener('click', loadExample);
        clearAllBtn.addEventListener('click', clearAll);
        exportTrainerBtn.addEventListener('click', exportTrainer);
        exportJsonBtn.addEventListener('click', exportJSON);
        importJsonBtn.addEventListener('click', importJSON);

        // Enter в полях формы
        wordNom.addEventListener('keydown', function(e) { if (e.key === 'Enter') addWord(); });
        wordGen.addEventListener('keydown', function(e) { if (e.key === 'Enter') addWord(); });
        wordTrans.addEventListener('keydown', function(e) { if (e.key === 'Enter') addWord(); });
    }

    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
