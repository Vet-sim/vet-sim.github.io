<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Флип-карточки | ВетСим</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #FDF8F0;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            color: #3E5C4A;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            border: 1px solid #E7EDE2;
            text-align: center;
        }
        h1 { font-size: 1.8rem; color: #1F4E6E; margin-bottom: 0.3rem; }
        .sub { color: #7C8F7C; margin-bottom: 1.5rem; }
        .card-container {
            perspective: 1000px;
            min-height: 320px;
            margin: 1.5rem 0;
            cursor: pointer;
        }
        .card-flip {
            position: relative;
            width: 100%;
            min-height: 320px;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }
        .card-flip.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: #FEFCF9;
            border-radius: 28px;
            border: 1px solid #E2EAD9;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 320px;
        }
        .card-front {
            background: #FEFCF9;
        }
        .card-back {
            transform: rotateY(180deg);
            background: #F4F7F0;
        }
        .card-face img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 16px;
            margin-bottom: 1rem;
        }
        .card-face .text {
            font-size: 1.2rem;
            line-height: 1.5;
        }
        .counter {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #7C8F7C;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }
        .btn {
            background: #EEF2E9;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn-primary { background: #2C7DA0; color: white; }
        .btn-primary:hover { background: #236B8A; }
        .btn-secondary { background: #A3B18A; color: white; }
        .btn-secondary:hover { background: #8FA375; }
        .stats { margin-top: 1rem; font-size: 0.9rem; color: #5F7C62; }
        footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #A7B89A;
            border-top: 1px solid #E2EAD9;
            padding-top: 1rem;
        }
        @media (max-width: 600px) {
            .container { padding: 1.2rem; }
            .card-face { padding: 1rem; min-height: 260px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📇 Флип-карточки</h1>
    <div class="sub">Кликните по карточке, чтобы перевернуть</div>

    <div class="card-container" id="cardContainer">
        <div class="card-flip" id="cardFlip">
            <div class="card-face card-front" id="cardFront"></div>
            <div class="card-face card-back" id="cardBack"></div>
        </div>
    </div>

    <div class="counter" id="counter">Карточка 1 из 20</div>

    <div class="action-row">
        <button class="btn btn-primary" id="prevBtn">◀ Предыдущая</button>
        <button class="btn btn-secondary" id="nextBtn">Следующая ▶</button>
    </div>

    <div class="stats">
        <span id="knownCount">✅ Знаю: 0</span>
        <span style="margin: 0 1rem;">|</span>
        <span id="unknownCount">❌ Не знаю: 0</span>
    </div>

    <div class="action-row">
        <button class="btn btn-secondary" id="resetStatsBtn">🔄 Сбросить статистику</button>
    </div>

    <footer>© ВетСим — интерактивные флип-карточки. Работает без интернета.</footer>
</div>

    let currentIndex = 0;
    let knownCount = 0;
    let unknownCount = 0;

    const cardFlip = document.getElementById('cardFlip');
    const cardFront = document.getElementById('cardFront');
    const cardBack = document.getElementById('cardBack');
    const counter = document.getElementById('counter');
    const knownSpan = document.getElementById('knownCount');
    const unknownSpan = document.getElementById('unknownCount');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resetStatsBtn = document.getElementById('resetStatsBtn');

    function renderCard(index) {
        const card = cards[index];
        if (!card) return;
        // Сброс переворота
        cardFlip.classList.remove('flipped');
        // Передняя сторона
        cardFront.innerHTML = `
            ${card.image ? `<img src="${card.image}" alt="Иллюстрация">` : ''}
            <div class="text">${escapeHtml(card.front)}</div>
        `;
        // Задняя сторона
        cardBack.innerHTML = `
            ${card.image ? `<img src="${card.image}" alt="Иллюстрация">` : ''}
            <div class="text">${escapeHtml(card.back)}</div>
        `;
        counter.textContent = `Карточка ${index+1} из ${cards.length}`;
        updateStats();
    }

    function flipCard() {
        cardFlip.classList.toggle('flipped');
    }

    function nextCard() {
        if (currentIndex + 1 < cards.length) {
            currentIndex++;
            renderCard(currentIndex);
        }
    }

    function prevCard() {
        if (currentIndex - 1 >= 0) {
            currentIndex--;
            renderCard(currentIndex);
        }
    }

    function updateStats() {
        knownSpan.textContent = `✅ Знаю: ${knownCount}`;
        unknownSpan.textContent = `❌ Не знаю: ${unknownCount}`;
    }

    function resetStats() {
        knownCount = 0;
        unknownCount = 0;
        updateStats();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }

    // События
    document.getElementById('cardContainer').addEventListener('click', flipCard);
    prevBtn.addEventListener('click', prevCard);
    nextBtn.addEventListener('click', nextCard);
    resetStatsBtn.addEventListener('click', resetStats);

    // Обработка клавиш
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') prevCard();
        else if (e.key === 'ArrowRight') nextCard();
        else if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            flipCard();
        }
    });

    renderCard(0);
</script>
