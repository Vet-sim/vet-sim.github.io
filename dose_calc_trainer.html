<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Тренажёр: расчёт доз лекарственных средств | ВетСим</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #FDF8F0;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            color: #3E5C4A;
            padding: 1.5rem;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1F4E6E;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        .sub {
            text-align: center;
            color: #7C8F7C;
            margin-bottom: 1.8rem;
            font-size: 0.9rem;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            border: 1px solid #E7EDE2;
            margin-bottom: 1.5rem;
        }
        .task-header {
            background: #EEF2E9;
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            display: inline-block;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #2C7DA0;
        }
        .task-text {
            background: #FEFAF2;
            border-left: 5px solid #A3B18A;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 20px;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .question-block {
            margin: 1.2rem 0;
            padding: 0.8rem;
            background: #F9F6EF;
            border-radius: 24px;
        }
        .question-label {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .answer-input {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .answer-input input {
            flex: 2;
            min-width: 150px;
            padding: 10px 14px;
            border-radius: 40px;
            border: 1px solid #D1DEC2;
            font-family: inherit;
            font-size: 0.9rem;
            background: white;
        }
        .answer-input span {
            flex: 1;
            font-size: 0.9rem;
            color: #8A9B7A;
        }
        .feedback {
            margin-top: 8px;
            font-size: 0.85rem;
            padding-left: 0.5rem;
            border-left: 3px solid transparent;
        }
        .feedback.correct {
            color: #2A6B2F;
            border-left-color: #4CAF50;
        }
        .feedback.wrong {
            color: #BC5A3C;
            border-left-color: #F44336;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin: 1.5rem 0 1rem;
            justify-content: space-between;
        }
        button {
            background: #EEF2E9;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn-primary {
            background: #2C7DA0;
            color: white;
        }
        .btn-primary:hover {
            background: #236B8A;
        }
        .btn-secondary {
            background: #A3B18A;
            color: white;
        }
        .btn-secondary:hover {
            background: #8A9B6E;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #BECFAD;
        }
        .stats {
            background: #F3F6EF;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .solution {
            margin-top: 1rem;
            padding: 1rem;
            background: #F0EDE4;
            border-radius: 20px;
            font-size: 0.85rem;
            display: none;
        }
        .solution.active {
            display: block;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #A7B89A;
            margin-top: 2rem;
            border-top: 1px solid #E2EAD9;
            padding-top: 1rem;
        }
        @media (max-width: 700px) {
            .button-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>💊 Тренажёр: расчёт доз лекарств</h1>
    <div class="sub">Ветеринарная фармакология – инъекции, разведения, периоды ожидания, суспензии</div>
    <div class="card">
        <div class="stats" id="stats">✅ Решено задач: 0 / 15</div>
        <div id="taskContainer"></div>
        <div class="button-group">
            <button id="checkBtn" class="btn-primary">🔍 Проверить ответы</button>
            <button id="hintBtn" class="btn-secondary">💡 Показать решение</button>
            <button id="nextBtn" class="btn-outline">➡ Следующая задача</button>
        </div>
    </div>
    <footer>© ВетСим – тренируйте расчёты, сверяйтесь с эталоном. Всегда учитывайте инструкции к препаратам.</footer>
</div>

<script>
    // --------------------------------------------------------------
    // БАЗА ЗАДАЧ (15 штук) с вопросами, ответами и пояснениями
    // --------------------------------------------------------------
    const tasks = [
        { // 1. Анальгин (собака)
            title: "Задача 1. Анальгин (собака)",
            description: "Вес: 23 кг. Препарат: метамизол натрия (Анальгин) 50% – 500 мг/мл, ампулы 2 мл. Доза: 15 мг/кг внутримышечно.",
            questions: [
                { text: "Сколько мл препарата нужно набрать в шприц?", expected: 0.69, tolerance: 0.05 }
            ],
            explanations: ["Доза: 15 мг/кг × 23 кг = 345 мг. Концентрация 500 мг/мл → 345/500 = 0,69 мл."],
            answerValues: [0.69]
        },
        { // 2. Дексаметазон (кошка)
            title: "Задача 2. Дексаметазон (кошка)",
            description: "Вес: 4 кг. Дексаметазон 0,4% (4 мг/мл). Доза: 0,2 мг/кг подкожно.",
            questions: [
                { text: "Сколько мл набрать?", expected: 0.2, tolerance: 0.02 }
            ],
            explanations: ["Доза: 0,2 мг/кг × 4 кг = 0,8 мг. Концентрация 4 мг/мл → 0,8/4 = 0,2 мл."],
            answerValues: [0.2]
        },
        { // 3. Амоксициллин (порошок, свинья)
            title: "Задача 3. Амоксициллин (разведение порошка)",
            description: "Свинья 60 кг. Амоксициллин во флаконе 5 г (5000 мг) порошок. Нужно получить раствор 150 мг/мл. Доза: 15 мг/кг в/м.",
            questions: [
                { text: "Какой объём растворителя (мл) нужно добавить во флакон для концентрации 150 мг/мл?", expected: 33.33, tolerance: 0.5 },
                { text: "Какой объём готового раствора ввести свинье (мл)?", expected: 6, tolerance: 0.2 }
            ],
            explanations: ["Объём раствора = 5000 мг / 150 мг/мл = 33,33 мл растворителя. Доза: 15×60=900 мг → 900/150=6 мл."],
            answerValues: [33.33, 6]
        },
        { // 4. Инсулин (собака)
            title: "Задача 4. Инсулин (собака)",
            description: "Вес 12 кг. Инсулин детемир 100 МЕ/мл. Доза 0,5 МЕ/кг п/к. Шприц U-100 (1 деление = 1 МЕ).",
            questions: [
                { text: "Сколько делений (МЕ) набрать?", expected: 6, tolerance: 0 }
            ],
            explanations: ["Доза: 0,5 МЕ/кг × 12 кг = 6 МЕ → 6 делений."],
            answerValues: [6]
        },
        { // 5. Глюкоза 40% → 5%
            title: "Задача 5. Глюкоза (разведение)",
            description: "Котёнок 0,8 кг. Есть 40% глюкоза. Нужно приготовить 10 мл 5% раствора глюкозы для в/в введения.",
            questions: [
                { text: "Сколько мл 40% глюкозы потребуется?", expected: 1.25, tolerance: 0.05 },
                { text: "Сколько мл воды для инъекций добавить?", expected: 8.75, tolerance: 0.1 },
                { text: "Приготовленный раствор (10 мл) вводят со скоростью 4 мл/ч. Сколько часов хватит этих 10 мл?", expected: 2.5, tolerance: 0.1 }
            ],
            explanations: ["Разведение в 8 раз (40/5=8). На 10 мл: 10/8=1,25 мл 40% глюкозы, остальное вода 8,75 мл. Скорость 4 мл/ч → 10/4=2,5 ч."],
            answerValues: [1.25, 8.75, 2.5]
        },
        { // 6. Фуросемид
            title: "Задача 6. Фуросемид (собака)",
            description: "Вес 25 кг. Фуросемид 1% (10 мг/мл). Доза 2 мг/кг в/м.",
            questions: [
                { text: "Сколько мл набрать?", expected: 5, tolerance: 0.1 }
            ],
            explanations: ["2 мг/кг × 25 кг = 50 мг. Концентрация 10 мг/мл → 50/10 = 5 мл."],
            answerValues: [5]
        },
        { // 7. Тилозин + период ожидания
            title: "Задача 7. Тилозин (поросёнок)",
            description: "Вес 30 кг. Тилозин 20% (200 мг/мл). Доза 10 мг/кг в/м однократно. Период ожидания 8 дней. Инъекция сделана 5 мая.",
            questions: [
                { text: "Объём инъекции (мл)?", expected: 1.5, tolerance: 0.05 },
                { text: "Убой с какой даты (число и месяц)? (введите число, например, 13)", expected: 13, tolerance: 0 }
            ],
            explanations: ["Доза: 10×30=300 мг → 300/200=1,5 мл. Ожидание 8 дней: 5 мая + 8 дней = 13 мая (выводится число 13)."],
            answerValues: [1.5, 13]
        },
        { // 8. Энрофлоксацин таблетка (попугай) – практически требуют суспензию
            title: "Задача 8. Энрофлоксацин (попугай)",
            description: "Попугай 0,15 кг. Таблетки энрофлоксацина 50 мг. Доза 10 мг/кг per os. Реальный способ – развести таблетку в 10 мл воды, дать суспензию.",
            questions: [
                { text: "Какой объём суспензии (мл) нужно дать, если таблетку 50 мг растворить в 10 мл воды? (получим 5 мг/мл)", expected: 0.3, tolerance: 0.05 }
            ],
            explanations: ["Доза: 10 мг/кг × 0,15 кг = 1,5 мг. Раствор 5 мг/мл → 1,5/5 = 0,3 мл."],
            answerValues: [0.3]
        },
        { // 9. Цефтриаксон 1 г
            title: "Задача 9. Цефтриаксон (собака)",
            description: "Вес 8 кг. Цефтриаксон 1 г порошок. Развести до 100 мг/мл. Доза 25 мг/кг в/м 2 раза/день.",
            questions: [
                { text: "Сколько мл растворителя добавить во флакон?", expected: 10, tolerance: 0.2 },
                { text: "Объём на одну инъекцию (мл)?", expected: 2, tolerance: 0.05 },
                { text: "На сколько дней хватит одного флакона (при 2 инъекциях/день)? (введите число дней, например, 2.5)", expected: 2.5, tolerance: 0.1 }
            ],
            explanations: ["Концентрация 100 мг/мл → объём = 1000 мг / 100 = 10 мл. Доза: 25×8=200 мг → 200/100=2 мл. Инъекций: 1000/200=5 инъекций → 2,5 дня."],
            answerValues: [10, 2, 2.5]
        },
        { // 10. Кальция глюконат 10%
            title: "Задача 10. Кальция глюконат (корова)",
            description: "Вес 450 кг. Кальция глюконат 10% (100 мг/мл). Доза 50 мг/кг в/в медленно.",
            questions: [
                { text: "Объём препарата (мл)?", expected: 225, tolerance: 2 }
            ],
            explanations: ["Доза: 50×450 = 22500 мг = 22,5 г. Концентрация 100 мг/мл → 22500/100 = 225 мл."],
            answerValues: [225]
        },
        { // 11. Марбофлоксацин 2%
            title: "Задача 11. Марбофлоксацин (кошка)",
            description: "Вес 5 кг. Марбофлоксацин 2% (20 мг/мл). Доза 2 мг/кг п/к 1 раз/день.",
            questions: [
                { text: "Объём на инъекцию (мл)?", expected: 0.5, tolerance: 0.05 }
            ],
            explanations: ["2 мг/кг × 5 кг = 10 мг. 10 / 20 = 0,5 мл."],
            answerValues: [0.5]
        },
        { // 12. Доксициклин суспензия для хомяка (50 г)
            title: "Задача 12. Доксициклин (хомяк)",
            description: "Хомяк 50 г (0,05 кг). Таблетка 100 мг. Нужно приготовить суспензию 25 мг/мл. Доза 5 мг/кг per os.",
            questions: [
                { text: "Какой объём растворителя (мл) для одной таблетки, чтобы получить 25 мг/мл?", expected: 4, tolerance: 0.2 },
                { text: "Какой объём суспензии дать хомяку (мл)? (концентрация 25 мг/мл)", expected: 0.01, tolerance: 0.002 }
            ],
            explanations: ["100 мг / 25 мг/мл = 4 мл. Доза: 5×0,05=0,25 мг → 0,25/25=0,01 мл (10 мкл). Практически разводят слабее, но ответ по условию."],
            answerValues: [4, 0.01]
        },
        { // 13. Гепарин
            title: "Задача 13. Гепарин (собака)",
            description: "Вес 18 кг. Гепарин 5000 МЕ/мл. Доза 75 МЕ/кг п/к 2 раза/день.",
            questions: [
                { text: "Объём на одну инъекцию (мл)?", expected: 0.27, tolerance: 0.02 }
            ],
            explanations: ["75×18=1350 МЕ. 1350/5000=0,27 мл."],
            answerValues: [0.27]
        },
        { // 14. Но-шпа (дротаверин) лошадь
            title: "Задача 14. Дротаверин (лошадь)",
            description: "Лошадь 450 кг. Дротаверин 2% (20 мг/мл). Доза 1 мг/кг в/в медленно, разводят в 20 мл физраствора.",
            questions: [
                { text: "Сколько мл дротаверина нужно взять из ампулы?", expected: 22.5, tolerance: 0.5 },
                { text: "Сколько мг действующего вещества получит лошадь?", expected: 450, tolerance: 2 }
            ],
            explanations: ["Доза: 1×450=450 мг. Концентрация 20 мг/мл → 450/20=22,5 мл. Количество вещества – 450 мг."],
            answerValues: [22.5, 450]
        },
        { // 15. Бензилпенициллин (МЕ)
            title: "Задача 15. Пенициллин (телёнок)",
            description: "Телёнок 45 кг. Флакон 1 000 000 МЕ, развести до 100 000 МЕ/мл. Доза 20 000 МЕ/кг в/м 2 раза/день, курс 5 дней.",
            questions: [
                { text: "Сколько мл растворителя добавить во флакон?", expected: 10, tolerance: 0.2 },
                { text: "Объём на одну инъекцию (мл)?", expected: 9, tolerance: 0.2 },
                { text: "Сколько флаконов потребуется на курс (5 дней, 2 инъекции/день)?", expected: 9, tolerance: 0 }
            ],
            explanations: ["Разведение: 1 000 000 / 100 000 = 10 мл. Доза: 20 000×45=900 000 МЕ → 900 000/100 000=9 мл. На курс 10 инъекций по 900 000 МЕ = 9 000 000 МЕ → 9 флаконов."],
            answerValues: [10, 9, 9]
        }
    ];

    // Управление состоянием тренажёра
    let currentTaskIndex = 0;
    let userAnswers = [];
    let taskResults = new Array(tasks.length).fill(false); // решена ли задача целиком

    function init() {
        const task = tasks[currentTaskIndex];
        userAnswers = new Array(task.questions.length).fill('');
        renderTask();
        updateStats();
    }

    function renderTask() {
        const container = document.getElementById('taskContainer');
        const task = tasks[currentTaskIndex];
        let html = `
            <div class="task-header">${task.title}</div>
            <div class="task-text">${task.description.replace(/\n/g, '<br>')}</div>
        `;
        task.questions.forEach((q, idx) => {
            html += `
                <div class="question-block" data-qidx="${idx}">
                    <div class="question-label">${idx+1}. ${q.text}</div>
                    <div class="answer-input">
                        <input type="number" step="any" id="ans_${idx}" value="${userAnswers[idx]}" placeholder="Введите число">
                        <span></span>
                    </div>
                    <div class="feedback" id="fb_${idx}"></div>
                </div>
            `;
        });
        container.innerHTML = html;
        // Привязываем события
        for (let i = 0; i < task.questions.length; i++) {
            const input = document.getElementById(`ans_${i}`);
            input.addEventListener('input', (e) => {
                userAnswers[i] = e.target.value;
            });
        }
        // Удалить панель решения
        const existingSolution = document.getElementById('solutionPanel');
        if (existingSolution) existingSolution.remove();
    }

    function checkAnswers() {
        const task = tasks[currentTaskIndex];
        let allCorrect = true;
        for (let i = 0; i < task.questions.length; i++) {
            const inputVal = parseFloat(userAnswers[i]);
            const expected = task.answerValues[i];
            const tolerance = task.questions[i].tolerance || 0;
            let isCorrect = false;
            if (!isNaN(inputVal)) {
                const diff = Math.abs(inputVal - expected);
                if (tolerance > 0) isCorrect = diff <= tolerance;
                else isCorrect = diff < 0.001;
            }
            const fbDiv = document.getElementById(`fb_${i}`);
            if (isCorrect) {
                fbDiv.innerHTML = '✅ Верно!';
                fbDiv.className = 'feedback correct';
            } else {
                let unit = '';
                if (task.questions[i].text.includes('мл')) unit = ' мл';
                else if (task.questions[i].text.includes('МЕ')) unit = ' МЕ';
                else if (task.questions[i].text.includes('делений')) unit = ' дел.';
                fbDiv.innerHTML = `❌ Неверно. Правильный ответ: ${expected}${unit}`;
                fbDiv.className = 'feedback wrong';
                allCorrect = false;
            }
        }
        if (allCorrect && !taskResults[currentTaskIndex]) {
            taskResults[currentTaskIndex] = true;
        }
        updateStats();
    }

    function updateStats() {
        const solved = taskResults.filter(v => v === true).length;
        document.getElementById('stats').innerHTML = `✅ Решено задач: ${solved} / ${tasks.length}`;
    }

    function showSolution() {
        const task = tasks[currentTaskIndex];
        let solutionHtml = `<div class="solution active" id="solutionPanel"><strong>📖 Решение и пояснение:</strong><br>`;
        for (let i = 0; i < task.explanations.length; i++) {
            solutionHtml += `<p><strong>${i+1}. </strong> ${task.explanations[i]}</p>`;
        }
        solutionHtml += `</div>`;
        const container = document.getElementById('taskContainer');
        const existing = document.getElementById('solutionPanel');
        if (existing) existing.remove();
        container.insertAdjacentHTML('beforeend', solutionHtml);
    }

    function nextTask() {
        if (currentTaskIndex + 1 < tasks.length) {
            currentTaskIndex++;
            init();
        } else {
            alert("🎉 Поздравляем! Вы прошли все 15 задач. Отличный результат!");
        }
    }

    window.onload = () => {
        init();
        document.getElementById('checkBtn').addEventListener('click', checkAnswers);
        document.getElementById('hintBtn').addEventListener('click', showSolution);
        document.getElementById('nextBtn').addEventListener('click', nextTask);
    };
</script>
</body>
</html>
