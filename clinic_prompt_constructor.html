    <style>
        /* ============================================================
           БАЗОВЫЕ СТИЛИ (фирменные цвета клиники)
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F4F7F9;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            color: #2D3748;

            gap: 0.8rem;
        }

        .header .logo-area .logo-icon {

            height: 48px;

            border-radius: 50%;

        }

           ВКЛАДКИ (НАПРАВЛЕНИЯ)
           ============================================================ */

            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;

            padding-bottom: 0.5rem;
            border-bottom: 2px solid #E8EDE2;

        }

        .tab-btn.active {

        /* ============================================================
           РЕЖИМЫ (ГЕНЕРАЦИЯ, УТОЧНЕНИЕ, ИДЕИ, ДОРАБОТКА)
           ============================================================ */
        .mode-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-bottom: 1.2rem;
            padding: 0.4rem 0.8rem;
            background: #F9F8F4;
            border-radius: 2.5rem;
            border: 1px solid #E8EDE2;
        }

        .mode-btn {
            background: transparent;

            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-weight: 600;

            box-shadow: 0 2px 6px rgba(59, 122, 94, 0.2);
        }

           ОСНОВНОЙ КОНТЕНТ
           ============================================================ */
        .content {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .task-selector {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;

        .task-selector label {
            font-weight: 600;
            font-size: 0.85rem;

        .task-selector select {

            font-family: inherit;
            font-size: 0.9rem;
            background: #fff;
            color: #2D3748;

            appearance: none;
            cursor: pointer;

        .task-selector select:focus {

            border-color: #3B7A5E;
            box-shadow: 0 0 0 3px rgba(59, 122, 94, 0.1);
        }

        /* ============================================================
           РОЛЬ И ШАБЛОН
           ============================================================ */

            border-radius: 1.2rem;
            padding: 0.8rem 1.2rem;

            padding: 0.8rem 1.2rem;
            border: 1px solid #E8EDE2;

        .template-box .template-label {

            color: #1A3A5C;
            font-size: 0.7rem;

            margin-bottom: 0.2rem;

        .template-box .template-text {

            color: #2D3748;

            font-size: 0.8rem;
            color: #1A3A5C;

            margin-bottom: 0.3rem;

            border-radius: 1rem;

           КНОПКИ ДЕЙСТВИЙ
           ============================================================ */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.3rem;
            align-items: center;
        }

        .btn {
            background: #F0F2EB;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 2.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            color: #2D3748;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .btn-primary {
            background: #3B7A5E;
            color: #fff;
        }

        .btn-primary:hover {
            background: #2F644C;
        }

        .btn-gold {
            background: #D4A84B;
            color: #fff;
        }

        .btn-gold:hover {
            background: #C4953A;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #3B7A5E;
            color: #3B7A5E;
        }

        .btn-outline:hover {
            background: #3B7A5E;
            color: #fff;
        }

        .btn-sm {
            padding: 0.3rem 1rem;
            font-size: 0.7rem;
        }

        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            transform: none;
        }

        /* ============================================================
           РЕЗУЛЬТАТ
           ============================================================ */
        .result-box {
            background: #F9F8F4;
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            border: 1px solid #E8EDE2;
            display: none;
            margin-top: 0.3rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-box .result-label {
            font-weight: 600;
            color: #1A3A5C;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .result-box .result-text {
            font-size: 0.9rem;
            color: #2D3748;
            line-height: 1.6;
            white-space: pre-wrap;
            background: #fff;
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid #E8EDE2;
            min-height: 50px;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-box .result-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        /* ============================================================
           ИСТОРИЯ
           ============================================================ */
        .history-box {
            background: #FCFAF5;
            border-radius: 1.2rem;
            padding: 0.7rem 1.2rem;
            border: 1px solid #E8EDE2;
            margin-top: 0.5rem;
        }

        .history-box .history-label {
            font-weight: 600;
            color: #1A3A5C;
            font-size: 0.75rem;
            margin-bottom: 0.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .history-box .history-item {
            font-size: 0.8rem;
            color: #2D3748;
            padding: 0.3rem 0;
            border-bottom: 1px dashed #E8EDE2;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .history-box .history-item:hover {
            background: #F4F1E4;
            padding-left: 6px;
            border-radius: 0.5rem;
        }

        .history-box .history-item .badge {
            background: #3B7A5E;
            color: #fff;
            font-size: 0.5rem;
            padding: 1px 8px;
            border-radius: 20px;
            font-weight: 600;
            flex-shrink: 0;
        }

        /* ============================================================
           TOAST (ВСПЛЫВАЮЩЕЕ СООБЩЕНИЕ)
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1A3A5C;
            color: #fff;
            padding: 0.6rem 1.8rem;
            border-radius: 2.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
        }

        /* ============================================================
           ПОДВАЛ
           ============================================================ */
        .footer {
            text-align: center;
            margin-top: 1.8rem;
            padding-top: 1rem;
            border-top: 1px solid #E8EDE2;
            font-size: 0.7rem;
            color: #8A9B7A;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.3rem 1rem;
        }

        .footer a {
            color: #3B7A5E;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* ============================================================
           АДАПТИВНОСТЬ
           ============================================================ */
        @media (max-width: 768px) {
            body {
                padding: 0.8rem;
            }
            .container {
                padding: 1.2rem 1rem;

                padding: 0.4rem 0.8rem;

            }
            .task-selector select {

            }

            }
            .result-box .result-text {

            }

            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }
            .container {
                padding: 0.8rem;
            }
            .header .logo-area .brand {
                font-size: 1.1rem;
            }
            .header .logo-area .subtitle {
                font-size: 0.65rem;
            }
            .tab-btn {
                font-size: 0.65rem;
                padding: 0.3rem 0.6rem;
            }
            .mode-btn {
                font-size: 0.6rem;
                padding: 0.2rem 0.5rem;
            }
            .field-group input,
            .field-group textarea,

<body>

    <div class="container">
        <!-- ===== ШАПКА ===== -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon">В</div>
                <div>
                    <div class="brand">Вет<span>Сим</span></div>
                    <span class="subtitle">Клинический конструктор промтов</span>
                </div>
            </div>
            <span class="version">v1.0</span>
        </div>

        <!-- ===== ВКЛАДКИ ===== -->
        <div class="tabs" id="tabsContainer">
            <button class="tab-btn active" data-direction="admission">🩺 Клинический прием</button>
            <button class="tab-btn" data-direction="diagnostics">🧬 Диагностика</button>
            <button class="tab-btn" data-direction="pharmacology">💊 Фармакология</button>
            <button class="tab-btn" data-direction="communication">🤝 Коммуникация</button>
            <button class="tab-btn" data-direction="legal">⚖️ Юридическая безопасность</button>
        </div>

        <!-- ===== РЕЖИМЫ ===== -->
        <div class="mode-selector" id="modeSelector">

        <div class="content" id="contentArea">
            <!-- Выбор задачи -->
            <div class="task-selector">
                <label for="taskSelect">📌 Выберите задачу:</label>
                <select id="taskSelect"></select>
            </div>

            <!-- Роль -->
            <div class="role-box" id="roleBox">
                <div class="role-label">🧠 Роль ИИ:</div>
                <div class="role-text" id="roleText">Выберите задачу</div>
            </div>

            <div class="template-box" id="templateBox">

                <textarea id="extraTextarea" placeholder="Опишите вашу задачу подробнее..."></textarea>
            </div>

            <!-- Кнопки -->
            <div class="actions">
                <button class="btn btn-primary" id="generateBtn">🔄 Сгенерировать</button>

            </div>

            <!-- Результат -->
            <div class="result-box" id="resultBox">

        <!-- ===== ПОДВАЛ ===== -->

            <span>·</span>
            <a href="https://vet-sim.github.io" target="_blank">vet-sim.github.io</a>

            <a href="https://vk.com/VetSimPros" target="_blank">vk.com/VetSimPros</a>

    <script>
        // ================================================================
        // 1. ДАННЫЕ
        // ================================================================

        // Направления и задачи (полная логика из обсуждения)
        const directions = {
            admission: {
                label: '🩺 Клинический прием',
                tasks: {
                    anamnesis: {
                        label: '1. Сбор анамнеза',
                        role: 'Ветеринарный терапевт',
                        template: `Ты — опытный ветеринарный терапевт. Составь список вопросов для сбора анамнеза у владельца пациента ({species}, {breed}, {age}, {gender}) с жалобами на {complaint}.

        Задай вопросы по следующим блокам:
        1. **Жалобы и их динамика:** частота, связь с кормлением, характер.
        2. **Анамнез жизни:** кормление, режим, содержание, контакты.
        3. **Анамнез болезни:** когда началось, развитие, лечение.
        4. **Общее состояние:** аппетит, жажда, мочеиспускание, активность.
        5. **Аллергии и хронические заболевания.**
        6. **Прививки и обработки от паразитов.**

                        fields: [

        // ================================================================
        // 2. СОСТОЯНИЕ
        // ================================================================
        let currentDirection = 'admission';
        let currentTask = 'anamnesis';
        let currentMode = 'generate';
        let history = JSON.parse(localStorage.getItem('vetsim_clinic_prompt_history') || '[]');

        // ================================================================
        // 3. DOM
        // ================================================================
        const tabsContainer = document.getElementById('tabsContainer');
        const taskSelect = document.getElementById('taskSelect');
        const roleText = document.getElementById('roleText');
        const templateText = document.getElementById('templateText');
        const fieldsContainer = document.getElementById('fieldsContainer');

        const extraLabel = document.getElementById('extraLabel');

        // ================================================================
        // 4. ФУНКЦИИ
        // ================================================================

        function renderTabs() {
            tabsContainer.innerHTML = '';
            for (const [key, dir] of Object.entries(directions)) {
                const btn = document.createElement('button');
                btn.className = `tab-btn${key === currentDirection ? ' active' : ''}`;
                btn.textContent = dir.label;
                btn.dataset.direction = key;
                btn.addEventListener('click', () => {
                    currentDirection = key;
                    const tasks = Object.keys(directions[key].tasks);
                    currentTask = tasks[0] || '';
                    renderTabs();
                    renderTaskSelect();
                    renderContent();
                });
                tabsContainer.appendChild(btn);
            }
        }

        function renderTaskSelect() {
            const tasks = directions[currentDirection].tasks;
            taskSelect.innerHTML = '';
            for (const [key, task] of Object.entries(tasks)) {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = task.label;
                if (key === currentTask) opt.selected = true;
                taskSelect.appendChild(opt);
            }
            taskSelect.addEventListener('change', (e) => {
                currentTask = e.target.value;
                renderContent();
            });
        }

        function renderContent() {
            const task = directions[currentDirection].tasks[currentTask];
            if (!task) return;

            roleText.textContent = task.role;
            templateText.textContent = task.template;

            fieldsContainer.innerHTML = '';
            task.fields.forEach((field) => {
                const group = document.createElement('div');
                group.className = 'field-group';

                const label = document.createElement('label');
                label.textContent = field.label;
                if (field.required) {
                    const req = document.createElement('span');
                    req.className = 'required';
                    req.textContent = '*';
                    label.appendChild(req);
                }
                if (field.placeholder && field.type !== 'select') {
                    const hint = document.createElement('span');
                    hint.className = 'hint';
                    hint.textContent = field.placeholder;
                    label.appendChild(hint);
                }
                group.appendChild(label);

                let input;
                if (field.type === 'select') {
                    input = document.createElement('select');
                    const defaultOpt = document.createElement('option');
                    defaultOpt.value = '';
                    defaultOpt.textContent = 'Выберите...';
                    input.appendChild(defaultOpt);
                    field.options.forEach(opt => {
                        const o = document.createElement('option');
                        o.value = opt;
                        o.textContent = opt;
                        input.appendChild(o);
                    });
                } else if (field.type === 'textarea') {
                    input = document.createElement('textarea');
                    input.placeholder = field.placeholder || '';
                    input.rows = 2;
                } else {
                    input = document.createElement('input');
                    input.type = 'text';
                    input.placeholder = field.placeholder || '';
                }

                input.id = 'field_' + field.id;
                input.dataset.fieldId = field.id;
                input.dataset.required = field.required ? 'true' : 'false';
                if (field.required) input.required = true;

                input.addEventListener('input', () => {
                    input.classList.remove('error');
                });
                input.addEventListener('change', () => {
                    input.classList.remove('error');
                });

                group.appendChild(input);
                fieldsContainer.appendChild(group);
            });

            updateExtraField();

            resultBox.style.display = 'none';
            resultText.textContent = '';
            resultMeta.textContent = '';
            copyBtn.disabled = true;
            saveHistoryBtn.style.display = 'none';

            renderHistory();
        }

        function updateExtraField() {
            const modeLabels = {
                'generate': '',
                'clarify': '❓ Опишите вашу задачу подробнее: что нужно уточнить? Какие аспекты вызывают вопросы?',
                'ideas': '💡 Укажите тему и особенности ситуации для генерации идей:',
                'improve': '🔧 Вставьте текст, который нужно проанализировать и доработать:'
            };

            if (currentMode === 'generate') {
                extraField.style.display = 'none';
            } else {
                extraField.style.display = 'block';
                extraLabel.textContent = modeLabels[currentMode] || 'Дополнительный контекст:';
                extraTextarea.value = '';
            }
        }

        function getFieldValues() {
            const fields = document.querySelectorAll('.field-group input, .field-group textarea, .field-group select');
            const values = {};
            let hasError = false;
            fields.forEach(el => {
                const id = el.dataset.fieldId;
                const required = el.dataset.required === 'true';
                const val = el.value?.trim() || '';
                if (required && !val) {
                    el.classList.add('error');
                    hasError = true;
                } else {
                    el.classList.remove('error');
                }
                values[id] = val;
            });
            if (hasError) {
                showToast('⚠️ Заполните все обязательные поля (отмечены *)', 3000);
                return null;
            }
            return values;
        }

            const values = getFieldValues();

            const task = directions[currentDirection].tasks[currentTask];
            if (!task) return;

            let prompt = '';

            if (currentMode === 'ideas') {
                const extra = extraTextarea.value.trim();
                prompt = `Как креативный методист, предложи 5-7 нестандартных идей для клинической задачи. ${extra ? 'Учти: ' + extra : ''}`;
                resultMeta.textContent = '💡 Режим: Генератор идей';

                saveHistoryBtn.style.display = 'inline-flex';

            if (currentMode === 'improve') {
                const extra = extraTextarea.value.trim();
                if (!extra) {
                    showToast('⚠️ Вставьте текст для анализа в поле "Дополнительный контекст"', 3000);
                    return;
                }
                prompt = `Проанализируй следующий текст и предложи способы его улучшения:

        ${extra}
        --- КОНЕЦ ТЕКСТА ---

        Проанализируй по критериям:
        1. Структура и логика изложения
        2. Ясность и доступность
        3. Практическая применимость
        Предложи конкретные правки.`;
                resultMeta.textContent = '🔧 Режим: Анализ и доработка';
                resultText.textContent = prompt;
                resultBox.style.display = 'block';
                copyBtn.disabled = false;
                saveHistoryBtn.style.display = 'inline-flex';
                showToast('🔧 Анализ выполнен!', 2000);
                return;
            }

            // Режим "Генерация" (стандартный)
            let template = task.template;

            // Заменяем все {field_id} на значения
            for (const [key, val] of Object.entries(values)) {
                template = template.replace(new RegExp(`\\{${key}\\}`, 'g'), val || '[не указано]');
            }

            prompt = template;
            resultMeta.textContent = `📝 ${directions[currentDirection].label} | ${task.label}`;
            resultText.textContent = prompt;
            resultBox.style.display = 'block';
            copyBtn.disabled = false;
            saveHistoryBtn.style.display = 'inline-flex';
            showToast('✅ Промпт сгенерирован!', 2000);
        }

        function copyResult() {
            const text = resultText.textContent;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 Промпт скопирован!', 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('📋 Промпт скопирован!', 2000);
            });
        }

        function saveToHistory() {
            const text = resultText.textContent;
            if (!text) return;

            const entry = {
                text: text,
                mode: currentMode,
                direction: directions[currentDirection].label,
                task: directions[currentDirection].tasks[currentTask]?.label || 'Неизвестно',
                date: new Date().toLocaleString()
            };

            history.unshift(entry);
            if (history.length > 10) history.pop();
            localStorage.setItem('vetsim_clinic_prompt_history', JSON.stringify(history));
            renderHistory();
            showToast('💾 Сохранено в историю!', 2000);
        }

        function renderHistory() {
            if (history.length === 0) {
                historyBox.style.display = 'none';
                return;
            }
            historyBox.style.display = 'block';
            historyList.innerHTML = '';
            history.slice(0, 5).forEach((item) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                const modeIcon = item.mode === 'generate' ? '📝' : item.mode === 'clarify' ? '❓' : item.mode === 'ideas' ? '💡' : '🔧';
                div.innerHTML = `
                    <span class="badge">${modeIcon}</span>
                    <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.text.slice(0, 60)}${item.text.length > 60 ? '…' : ''}</span>
                    <span style="font-size:0.6rem; color:#8A9B7A; flex-shrink:0;">${item.date}</span>
                `;
                div.addEventListener('click', () => {
                    resultText.textContent = item.text;
                    resultMeta.textContent = `📜 Из истории: ${item.direction} | ${item.task}`;
                    resultBox.style.display = 'block';
                    copyBtn.disabled = false;
                    saveHistoryBtn.style.display = 'inline-flex';
                });
                historyList.appendChild(div);
            });
        }

            if (!confirm('Очистить всю историю?')) return;

        let toastTimeout = null;

        function showToast(message, duration = 2500) {
            toast.textContent = message;

        }

        // ================================================================
        // 5. ОБРАБОТЧИКИ СОБЫТИЙ
        // ================================================================

        modeSelector.addEventListener('click', (e) => {
            const btn = e.target.closest('.mode-btn');
            if (!btn) return;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.dataset.mode;
            updateExtraField();
            resultBox.style.display = 'none';
            copyBtn.disabled = true;
            saveHistoryBtn.style.display = 'none';
            showToast(`Режим: ${btn.textContent}`, 1500);
        });

        generateBtn.addEventListener('click', generatePrompt);
        copyBtn.addEventListener('click', copyResult);
        copyResultBtn.addEventListener('click', copyResult);
        saveHistoryBtn.addEventListener('click', saveToHistory);
        clearHistoryBtn.addEventListener('click', clearHistory);

        // ================================================================
        // 6. ИНИЦИАЛИЗАЦИЯ
        // ================================================================

        function init() {
            renderTabs();
            renderTaskSelect();
            renderContent();
            renderHistory();
        }

        init();
    </script>

</body>
</html>
