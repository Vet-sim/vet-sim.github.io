<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Флип-карточки: Доказательная ветеринарная медицина | ВетСим</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #FDF8F0;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            color: #3E5C4A;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            border: 1px solid #E7EDE2;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            color: #1F4E6E;
            margin-bottom: 0.2rem;
        }
        .sub {
            color: #7C8F7C;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .card-container {
            perspective: 1000px;
            min-height: 320px;
            margin: 1.5rem 0;
            cursor: pointer;
        }
        .card-flip {
            position: relative;
            width: 100%;
            min-height: 320px;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
        }
        .card-flip.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 28px;
            border: 1px solid #E2EAD9;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 320px;
        }
        .card-front {
            background: #FEFCF9;
        }
        .card-back {
            transform: rotateY(180deg);
            background: #F4F7F0;
        }
        .card-face .term-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .card-face .term-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1F4E6E;
            margin-bottom: 0.5rem;
        }
        .card-face .term-definition {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #3E5C4A;
        }
        .card-face .term-tag {
            display: inline-block;
            margin-top: 0.8rem;
            font-size: 0.65rem;
            background: #EEF2E9;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            color: #2C7DA0;
        }
        .card-face .hint {
            font-size: 0.8rem;
            color: #A7B89A;
            margin-top: 0.5rem;
        }
        .counter {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #7C8F7C;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 1.5rem;
        }
        .btn {
            background: #EEF2E9;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .btn-primary {
            background: #2C7DA0;
            color: white;
        }
        .btn-primary:hover {
            background: #236B8A;
        }
        .btn-secondary {
            background: #A3B18A;
            color: white;
        }
        .btn-secondary:hover {
            background: #8FA375;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #D1DEC2;
        }
        .btn-outline:hover {
            background: #F5F3EC;
        }
        .stats {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #5F7C62;
        }
        footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #A7B89A;
            border-top: 1px solid #E2EAD9;
            padding-top: 1rem;
        }
        @media (max-width: 600px) {
            .container { padding: 1.2rem; }
            .card-face { padding: 1rem; min-height: 280px; }
            .card-face .term-name { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <!-- ДЕМО-ШАПКА -->
    <div style="position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #EEF2E9; padding: 0.5rem 1.5rem; border-bottom: 2px solid #A3B18A; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div>
            <strong style="color: #1F4E6E;">🐾 ВетСим</strong>
            <span style="color: #5F7C62; margin-left: 0.8rem; font-size: 0.8rem;">Демо-версия для вузов</span>
        </div>
        <div style="font-size: 0.75rem;">
            <a href="index.html" style="color: #2C7DA0; text-decoration: none;">← Назад к списку</a>
            <span style="color: #A7B89A; margin: 0 0.5rem;">|</span>
            <span style="color: #A7B89A;">📧 as_ter@mail.ru</span>
        </div>
    </div>

    <div class="container" style="margin-top: 4rem;">
        <h1>📚 Доказательная ветеринарная медицина</h1>
        <div class="sub">20 флип-карточек: термины и понятия</div>

        <div class="card-container" id="cardContainer">
            <div class="card-flip" id="cardFlip">
                <div class="card-face card-front" id="cardFront"></div>
                <div class="card-face card-back" id="cardBack"></div>
            </div>
        </div>

        <div class="counter" id="counter">Карточка 1 из 20</div>

        <div class="action-row">
            <button class="btn btn-outline" id="prevBtn">◀ Предыдущая</button>
            <button class="btn btn-primary" id="flipBtn">🔄 Перевернуть</button>
            <button class="btn btn-outline" id="nextBtn">Следующая ▶</button>
        </div>

        <div class="stats">
            <span id="knownCount">✅ Знаю: 0</span>
            <span style="margin: 0 0.8rem;">|</span>
            <span id="unknownCount">❌ Не знаю: 0</span>
        </div>

        <div class="action-row">
            <button class="btn btn-secondary" id="resetStatsBtn">🔄 Сбросить статистику</button>
        </div>

        <footer>© ВетСим — интерактивные флип-карточки. Работает без интернета.</footer>
    </div>

    <script>
        // ===== 20 ТЕРМИНОВ (данные из статьи) =====
        const cards = [
            { term: "Доказательная ветеринарная медицина", definition: "Подход к принятию клинических решений, основанный на интеграции лучших доступных научных данных, клинического опыта врача и предпочтений пациента/владельца.", icon: "📊", tag: "Методология" },
            { term: "Уровень доказательности (LoE)", definition: "Иерархическая классификация качества научных данных, где систематические обзоры и РКИ находятся на вершине, а экспертные мнения — в основании.", icon: "📈", tag: "Методология" },
            { term: "Рандомизированное контролируемое исследование (РКИ)", definition: "Золотой стандарт клинических исследований, в котором участники случайным образом распределяются в группы лечения и контроля для минимизации систематической ошибки.", icon: "🧪", tag: "Методология" },
            { term: "Систематический обзор", definition: "Исследование, в котором критически оцениваются, отбираются и синтезируются все первичные исследования по конкретному клиническому вопросу.", icon: "📋", tag: "Методология" },
            { term: "Мета-анализ", definition: "Статистический метод, объединяющий результаты нескольких независимых исследований для получения более точной оценки эффекта лечения.", icon: "📊", tag: "Методология" },
            { term: "Слепое исследование", definition: "Исследование, в котором участники (или исследователи) не знают, кто получает лечение, а кто — плацебо, что снижает риск систематической ошибки.", icon: "🙈", tag: "Методология" },
            { term: "Плацебо-контроль", definition: "Метод контроля, при котором одна группа получает активное лечение, а другая — инертное вещество, не имеющее терапевтического эффекта.", icon: "💊", tag: "Методология" },
            { term: "Отношение шансов (ОШ)", definition: "Статистический показатель, используемый в клинических исследованиях для оценки связи между воздействием и исходом.", icon: "📐", tag: "Методология" },
            { term: "Чувствительность диагностического теста", definition: "Вероятность того, что тест даст положительный результат у пациента с заболеванием (способность правильно выявлять больных).", icon: "🎯", tag: "Диагностика" },
            { term: "Специфичность диагностического теста", definition: "Вероятность того, что тест даст отрицательный результат у пациента без заболевания (способность правильно исключать здоровых).", icon: "🛡️", tag: "Диагностика" },
            { term: "Положительная прогностическая ценность (ППЦ)", definition: "Вероятность наличия заболевания при положительном результате теста.", icon: "✅", tag: "Диагностика" },
            { term: "Отрицательная прогностическая ценность (ОПЦ)", definition: "Вероятность отсутствия заболевания при отрицательном результате теста.", icon: "❌", tag: "Диагностика" },
            { term: "Клинический случай", definition: "Описание истории болезни одного пациента, используемое для иллюстрации редких заболеваний или нестандартных подходов к лечению.", icon: "📖", tag: "Клиническая концепция" },
            { term: "Когортное исследование", definition: "Наблюдательное исследование, в котором группа пациентов прослеживается во времени для оценки влияния факторов риска или лечения на исходы.", icon: "👥", tag: "Клиническая концепция" },
            { term: "Исследование «случай-контроль»", definition: "Ретроспективное исследование, в котором сравниваются пациенты с интересующим исходом (случаи) и без него (контроль) для выявления факторов риска.", icon: "🔍", tag: "Клиническая концепция" },
            { term: "N-of-1 исследование", definition: "Индивидуальный клинический эксперимент, в котором один пациент получает разные виды лечения в разные периоды времени для определения наиболее эффективной терапии.", icon: "🧬", tag: "Клиническая концепция" },
            { term: "Градиент убедительности рекомендаций (GRADE)", definition: "Система оценки качества доказательств и силы рекомендаций, используемая для разработки клинических протоколов.", icon: "⚖️", tag: "Клиническая концепция" },
            { term: "Эффективность и действенность", definition: "Эффективность — результат лечения в идеальных условиях (РКИ); действенность — результат в реальной клинической практике.", icon: "🏥", tag: "Клиническая концепция" },
            { term: "Причинность (критерии Брэдфорда Хилла)", definition: "Набор из 9 критериев, используемых для оценки причинно-следственной связи между воздействием и исходом в эпидемиологических исследованиях.", icon: "🔗", tag: "Клиническая концепция" },
            { term: "Информированное согласие", definition: "Процесс, в ходе которого владелец животного получает полную информацию о предстоящем вмешательстве, его рисках, альтернативах и добровольно принимает решение.", icon: "📜", tag: "Этика" }
        ];

        // ===== ЛОГИКА ТРЕНАЖЁРА =====
        let currentIndex = 0;
        let knownCount = 0;
        let unknownCount = 0;

        const cardFlip = document.getElementById('cardFlip');
        const cardFront = document.getElementById('cardFront');
        const cardBack = document.getElementById('cardBack');
        const counter = document.getElementById('counter');
        const knownSpan = document.getElementById('knownCount');
        const unknownSpan = document.getElementById('unknownCount');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const flipBtn = document.getElementById('flipBtn');
        const resetStatsBtn = document.getElementById('resetStatsBtn');

        function renderCard(index) {
            const card = cards[index];
            if (!card) return;
            cardFlip.classList.remove('flipped');
            cardFront.innerHTML = `
                <div class="term-icon">${card.icon}</div>
                <div class="term-name">${escapeHtml(card.term)}</div>
                <div class="term-tag">${card.tag}</div>
                <div class="hint">👆 Кликните для определения</div>
            `;
            cardBack.innerHTML = `
                <div class="term-icon">${card.icon}</div>
                <div class="term-name" style="font-size:1.1rem;">${escapeHtml(card.term)}</div>
                <div class="term-definition">${escapeHtml(card.definition)}</div>
                <div class="term-tag">${card.tag}</div>
            `;
            counter.textContent = `Карточка ${index+1} из ${cards.length}`;
            updateStats();
        }

        function flipCard() {
            cardFlip.classList.toggle('flipped');
        }

        function nextCard() {
            if (currentIndex + 1 < cards.length) {
                currentIndex++;
                renderCard(currentIndex);
            }
        }

        function prevCard() {
            if (currentIndex - 1 >= 0) {
                currentIndex--;
                renderCard(currentIndex);
            }
        }

        function updateStats() {
            knownSpan.textContent = `✅ Знаю: ${knownCount}`;
            unknownSpan.textContent = `❌ Не знаю: ${unknownCount}`;
        }

        function resetStats() {
            knownCount = 0;
            unknownCount = 0;
            updateStats();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
        }

        document.getElementById('cardContainer').addEventListener('click', flipCard);
        prevBtn.addEventListener('click', prevCard);
        nextBtn.addEventListener('click', nextCard);
        flipBtn.addEventListener('click', flipCard);
        resetStatsBtn.addEventListener('click', resetStats);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevCard();
            else if (e.key === 'ArrowRight') nextCard();
            else if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                flipCard();
            }
        });

        renderCard(0);
    </script>
</body>
</html>
