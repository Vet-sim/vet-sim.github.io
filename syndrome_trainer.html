<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Синдромальный подход: интерпретация симптомов | ВетСим</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #FDF8F0;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            color: #3E5C4A;
            padding: 1.5rem;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1F4E6E;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        .sub {
            text-align: center;
            color: #7C8F7C;
            margin-bottom: 1.8rem;
            font-size: 0.9rem;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            border: 1px solid #E7EDE2;
            margin-bottom: 1.5rem;
        }
        .task-header {
            background: #EEF2E9;
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            display: inline-block;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #2C7DA0;
        }
        .task-text {
            background: #FEFAF2;
            border-left: 5px solid #A3B18A;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 20px;
            font-size: 0.95rem;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .question-block {
            margin: 1.2rem 0;
            padding: 0.8rem;
            background: #F9F6EF;
            border-radius: 24px;
        }
        .question-label {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.3rem;
        }
        .options-group label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 400;
            cursor: pointer;
        }
        .options-group input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #2C7DA0;
            cursor: pointer;
        }
        .feedback {
            margin-top: 8px;
            font-size: 0.85rem;
            padding-left: 0.5rem;
            border-left: 3px solid transparent;
        }
        .feedback.correct {
            color: #2A6B2F;
            border-left-color: #4CAF50;
        }
        .feedback.wrong {
            color: #BC5A3C;
            border-left-color: #F44336;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin: 1.5rem 0 1rem;
            justify-content: space-between;
        }
        button {
            background: #EEF2E9;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn-primary {
            background: #2C7DA0;
            color: white;
        }
        .btn-primary:hover {
            background: #236B8A;
        }
        .btn-secondary {
            background: #A3B18A;
            color: white;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #BECFAD;
        }
        .stats {
            background: #F3F6EF;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .solution {
            margin-top: 1rem;
            padding: 1rem;
            background: #F0EDE4;
            border-radius: 20px;
            font-size: 0.85rem;
            display: none;
        }
        .solution.active {
            display: block;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #A7B89A;
            margin-top: 2rem;
            border-top: 1px solid #E2EAD9;
            padding-top: 1rem;
        }
        @media (max-width: 700px) {
            .button-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🧠 Синдромальный подход</h1>
    <div class="sub">Интерпретация симптомов: 5 клинических сценариев</div>
    <div class="card">
        <div class="stats" id="stats">✅ Решено: 0 / 5</div>
        <div id="taskContainer"></div>
        <div class="button-group">
            <button id="checkBtn" class="btn-primary">🔍 Проверить</button>
            <button id="hintBtn" class="btn-secondary">💡 Показать пояснение</button>
            <button id="nextBtn" class="btn-outline">➡ Следующий сценарий</button>
        </div>
    </div>
    <footer>© ВетСим – синдромальный подход в диагностике. Тренируйте клиническое мышление.</footer>
</div>

<script>
    // --------------------------------------------------------------
    // БАЗА СЦЕНАРИЕВ (5)
    // --------------------------------------------------------------
    const tasks = [
        {
            title: "Сценарий 1. Желудочно-кишечный синдром",
            description: "Собака, 4 года, метис. Анамнез: рвота, диарея, анорексия, вялость в течение 2 дней. При осмотре: слизистые сухие, тургор снижен, температура 38,9°C, ЧСС 120, ЧДД 28, живот умеренно болезненный при пальпации.",
            question: "Какой синдром наиболее вероятен?",
            options: [
                "Гастроэнтерит (желудочно-кишечный)",
                "Респираторный синдром",
                "Гепатобилиарный синдром",
                "Урологический синдром"
            ],
            correct: 0,
            explanation: "Рвота, диарея, анорексия, болезненность живота – классическая картина гастроэнтерита. Другие синдромы не имеют таких выраженных ЖКТ-симптомов."
        },
        {
            title: "Сценарий 2. Респираторный синдром",
            description: "Кошка, 6 лет, беспородная. Поступила с кашлем, чиханием, серозными выделениями из носа, одышкой. При осмотре: температура 39,6°C, ЧДД 48, при аускультации жёсткое везикулярное дыхание, хрипы.",
            question: "Какой синдром наиболее вероятен?",
            options: [
                "Гастроэнтерит",
                "Респираторный синдром",
                "Дерматологический синдром",
                "Кардиологический синдром"
            ],
            correct: 1,
            explanation: "Кашель, чихание, выделения из носа, одышка, хрипы – признаки респираторного синдрома (ринотрахеит, бронхит, пневмония)."
        },
        {
            title: "Сценарий 3. Эндокринный синдром (полиурия/полидипсия)",
            description: "Собака, 10 лет, лабрадор. Анамнез: полиурия, полидипсия, снижение веса на фоне повышенного аппетита, вялость. При осмотре: слизистые влажные, тургор нормальный, температура 38,2°C, ЧСС 110, ЧДД 24.",
            question: "Какой синдром наиболее вероятен?",
            options: [
                "Гепатобилиарный синдром",
                "Эндокринный синдром (сахарный диабет, гиперкортицизм)",
                "Почечный синдром",
                "Неврологический синдром"
            ],
            correct: 1,
            explanation: "Полиурия, полидипсия, снижение веса с повышенным аппетитом – классические признаки сахарного диабета или гиперкортицизма. Это эндокринные синдромы."
        },
        {
            title: "Сценарий 4. Гепатобилиарный синдром (желтуха)",
            description: "Кошка, 8 лет, персидская. Анамнез: анорексия, рвота, иктеричность слизистых оболочек, тёмная моча. При осмотре: слизистые жёлтые, температура 38,5°C, ЧСС 140, ЧДД 30, печень пальпируется за рёберной дугой.",
            question: "Какой синдром наиболее вероятен?",
            options: [
                "Гастроэнтерит",
                "Гепатобилиарный синдром (гепатит, холангит, липидоз)",
                "Респираторный синдром",
                "Урологический синдром"
            ],
            correct: 1,
            explanation: "Иктеричность слизистых, тёмная моча, увеличенная печень – признаки гепатобилиарного синдрома (холестаз, гепатит, липидоз печени)."
        },
        {
            title: "Сценарий 5. Гематологический синдром (анемия)",
            description: "Собака, 7 лет, овчарка. Анамнез: слабость, бледность слизистых, снижение аппетита, быстрая утомляемость, тахипноэ при нагрузке. При осмотре: слизистые бледные, ЧСС 150, ЧДД 35, температура 37,9°C, при аускультации шум.",
            question: "Какой синдром наиболее вероятен?",
            options: [
                "Кардиологический синдром",
                "Гематологический синдром (анемия)",
                "Респираторный синдром",
                "Эндокринный синдром"
            ],
            correct: 1,
            explanation: "Бледность слизистых, тахикардия, шум, слабость – классические признаки анемии (гематологический синдром). Важно отличать от кардиологических причин, но здесь центральный симптом – бледность."
        }
    ];

    // --------------------------------------------------------------
    // Управление состоянием тренажёра
    // --------------------------------------------------------------
    let currentTaskIndex = 0;
    let userAnswers = [];    // для каждого вопроса: выбранный индекс
    let taskResults = new Array(tasks.length).fill(false);

    function init() {
        const task = tasks[currentTaskIndex];
        userAnswers = new Array(1).fill(null); // один вопрос на сценарий
        renderTask();
        updateStats();
    }

    function renderTask() {
        const container = document.getElementById('taskContainer');
        const task = tasks[currentTaskIndex];
        let html = `
            <div class="task-header">${task.title}</div>
            <div class="task-text">${task.description.replace(/\n/g, '<br>')}</div>
        `;
        html += `
            <div class="question-block" data-qidx="0">
                <div class="question-label">${task.question}</div>
                <div class="options-group" id="options_0">
        `;
        task.options.forEach((opt, idx) => {
            const checked = (userAnswers[0] === idx) ? 'checked' : '';
            html += `
                <label>
                    <input type="radio" name="q0" value="${idx}" ${checked}>
                    ${opt}
                </label>
            `;
        });
        html += `
                </div>
                <div class="feedback" id="fb_0"></div>
            </div>
        `;
        container.innerHTML = html;
        // События для радио
        const radios = document.querySelectorAll('input[name="q0"]');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                userAnswers[0] = parseInt(e.target.value);
            });
        });
        const existingSolution = document.getElementById('solutionPanel');
        if (existingSolution) existingSolution.remove();
    }

    function checkAnswers() {
        const task = tasks[currentTaskIndex];
        const selected = userAnswers[0];
        const correct = task.correct;
        const isCorrect = (selected === correct);
        const fbDiv = document.getElementById('fb_0');
        if (isCorrect) {
            fbDiv.innerHTML = '✅ Верно! ' + task.explanation;
            fbDiv.className = 'feedback correct';
        } else {
            const correctText = task.options[correct];
            fbDiv.innerHTML = `❌ Неверно. Правильный ответ: "${correctText}". ${task.explanation}`;
            fbDiv.className = 'feedback wrong';
        }
        if (isCorrect && !taskResults[currentTaskIndex]) {
            taskResults[currentTaskIndex] = true;
        }
        updateStats();
    }

    function updateStats() {
        const solved = taskResults.filter(v => v === true).length;
        document.getElementById('stats').innerHTML = `✅ Решено: ${solved} / ${tasks.length}`;
    }

    function showSolution() {
        const task = tasks[currentTaskIndex];
        const correctText = task.options[task.correct];
        let solutionHtml = `<div class="solution active" id="solutionPanel"><strong>📖 Пояснение:</strong><br>`;
        solutionHtml += `<p>✅ Правильный ответ: <strong>${correctText}</strong><br>📌 ${task.explanation}</p>`;
        solutionHtml += `</div>`;
        const container = document.getElementById('taskContainer');
        const existing = document.getElementById('solutionPanel');
        if (existing) existing.remove();
        container.insertAdjacentHTML('beforeend', solutionHtml);
    }

    function nextTask() {
        if (currentTaskIndex + 1 < tasks.length) {
            currentTaskIndex++;
            init();
        } else {
            alert("🎉 Поздравляем! Вы прошли все 5 сценариев. Отличный результат!");
        }
    }

    window.onload = () => {
        init();
        document.getElementById('checkBtn').addEventListener('click', checkAnswers);
        document.getElementById('hintBtn').addEventListener('click', showSolution);
        document.getElementById('nextBtn').addEventListener('click', nextTask);
    };
</script>
</body>
</html>
