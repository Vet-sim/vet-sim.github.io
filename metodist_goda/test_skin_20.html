<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Тест · Кожа — зеркало здоровья | ВетСим</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Montserrat', system-ui, sans-serif;
    background: #FDF8F0;
    color: #3E5C4A;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 800px; margin: 0 auto; }
  .header {
    background: linear-gradient(135deg, #2C7DA0, #1F4E6E);
    color: #fff;
    border-radius: 1.5rem;
    padding: 20px 28px;
    margin-bottom: 20px;
    text-align: center;
  }
  .header h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .header p { font-size: 0.85rem; opacity: 0.95; }
  
  .timer-bar {
    background: #fff;
    border-radius: 1rem;
    padding: 10px 18px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    font-size: 0.85rem;
    font-weight: 600;
    color: #2C7DA0;
  }
  .timer-bar .timer-value { font-size: 1.2rem; font-weight: 800; }
  .timer-bar .timer-value.warning { color: #D4A373; animation: pulse 0.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  .progress-info {
    font-size: 0.8rem;
    color: #7B8D6E;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  .progress-bar {
    height: 6px;
    background: #E7EDE2;
    border-radius: 40px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, #2C7DA0, #6B9E6B);
    border-radius: 40px;
    transition: width 0.4s ease;
  }

  .card {
    background: #fff;
    border-radius: 1.5rem;
    padding: 24px 28px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    border: 1px solid #EDE8DC;
    margin-bottom: 16px;
  }
  .question-type {
    display: inline-block;
    background: #e8f0f5;
    color: #2C7DA0;
    padding: 3px 12px;
    border-radius: 1rem;
    font-size: 0.7rem;
    font-weight: 600;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .question-text {
    font-size: 1.05rem;
    font-weight: 600;
    color: #1A2A3A;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .answers { display: flex; flex-direction: column; gap: 8px; }
  .answer {
    padding: 12px 18px;
    background: #F9F6EF;
    border: 2px solid #D9D0BD;
    border-radius: 1rem;
    cursor: pointer;
    transition: 0.15s;
    font-size: 0.9rem;
    line-height: 1.4;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .answer:hover { border-color: #2C7DA0; background: #F0F7FA; }
  .answer.selected { border-color: #2C7DA0; background: #D4E3ED; }
  .answer.correct { border-color: #6B9E6B; background: #E8F5E8; }
  .answer.wrong { border-color: #D4A373; background: #FDF0E8; }
  .answer .marker {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #D9D0BD; display: flex; align-items: center;
    justify-content: center; font-size: 0.7rem; font-weight: 700;
    flex-shrink: 0; color: #7B8D6E;
  }
  .answer.selected .marker { background: #2C7DA0; border-color: #2C7DA0; color: #fff; }

  .seq-pool, .seq-target {
    display: flex; flex-wrap: wrap; gap: 8px;
    min-height: 50px; padding: 10px; border-radius: 1rem;
    margin-bottom: 10px;
  }
  .seq-pool { background: #f4f4f4; border: 2px dashed #ccc; }
  .seq-target { background: #e8f5e9; border: 2px solid #aed581; flex-direction: column; }
  .seq-item {
    padding: 8px 16px; background: #fff; border: 1px solid #ddd;
    border-radius: 0.5rem; cursor: pointer; font-size: 0.85rem;
    transition: 0.2s;
  }
  .seq-item:hover { background: #f0f0f0; }

  .match-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .match-col { display: flex; flex-direction: column; gap: 8px; }
  .match-item {
    padding: 10px 14px; background: #F9F6EF; border: 2px solid #D9D0BD;
    border-radius: 1rem; cursor: pointer; font-size: 0.85rem; transition: 0.2s;
    display: flex; justify-content: space-between; align-items: center;
  }
  .match-item:hover { border-color: #2C7DA0; }
  .match-item.selected { border-color: #2C7DA0; background: #D4E3ED; }
  .match-item.matched { background: #E8F5E8; border-color: #6B9E6B; cursor: default; }
  .match-badge {
    background: #2C7DA0; color: #fff; font-size: 0.7rem; padding: 2px 6px;
    border-radius: 1rem; margin-left: 8px;
  }

  .btn {
    background: linear-gradient(135deg, #43a047, #2e7d32);
    color: #fff; border: none; padding: 12px 28px; border-radius: 2rem;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: 0.2s; margin-top: 16px; font-family: inherit;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(46,125,50,0.3); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  
  .feedback {
    margin-top: 14px; padding: 12px 16px; border-radius: 1rem;
    font-size: 0.85rem; line-height: 1.5; display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #E8F5E8; border-left: 4px solid #6B9E6B; color: #1b5e20; }
  .feedback.wrong { background: #FDF0E8; border-left: 4px solid #D4A373; color: #b71c1c; }

  .result-screen { display: none; text-align: center; }
  .result-screen.show { display: block; }
  .result-score { font-size: 4rem; font-weight: 800; color: #2C7DA0; margin: 16px 0; }
  .result-percent { font-size: 1.5rem; color: #6B9E6B; margin-bottom: 16px; }
  .result-grade {
    font-size: 1.2rem; font-weight: 700; padding: 10px 28px;
    border-radius: 2rem; display: inline-block; margin-bottom: 20px;
  }
  .grade-5 { background: #E8F5E8; color: #2e7d32; }
  .grade-4 { background: #FFF9C4; color: #f57f17; }
  .grade-3 { background: #FFE0B2; color: #e65100; }
  .grade-2 { background: #FFCDD2; color: #b71c1c; }
  
  .review {
    text-align: left; background: #F9F6EF; border-radius: 1rem;
    padding: 20px; margin-top: 20px; max-height: 500px; overflow-y: auto;
  }
  .review h3 { color: #2C7DA0; margin-bottom: 12px; font-size: 1rem; }
  .review-item { padding: 10px 0; border-bottom: 1px solid #E7EDE2; font-size: 0.85rem; line-height: 1.5; }
  .review-item:last-child { border-bottom: none; }
  .review-item .num { font-weight: 700; color: #2C7DA0; }
  .review-item .ok { color: #2e7d32; font-weight: 600; }
  .review-item .bad { color: #c62828; font-weight: 600; }

  .footer { text-align: center; font-size: 0.75rem; color: #7B8D6E; margin-top: 24px; padding-top: 16px; border-top: 1px solid #E7EDE2; }
  .footer a { color: #2C7DA0; text-decoration: none; }
  
  @media (max-width: 600px) {
    body { padding: 10px; }
    .card { padding: 18px; }
    .question-text { font-size: 0.95rem; }
    .match-container { grid-template-columns: 1fr; gap: 10px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🐾 Тест · Кожа — зеркало здоровья</h1>
    <p>20 вопросов · 8 минут · закрепление</p>
  </div>

  <div class="timer-bar" id="timerBar">
    <span>⏱️ Осталось времени:</span>
    <span class="timer-value" id="timerValue">08:00</span>
  </div>

  <div id="quizScreen">
    <div class="progress-info">
      <span id="questionCounter">Вопрос 1 из 20</span>
      <span id="scoreDisplay">Баллов: 0</span>
    </div>
    <div class="progress-bar">
      <div class="fill" id="progressFill" style="width:5%;"></div>
    </div>

    <div class="card">
      <span class="question-type" id="questionType"></span>
      <div class="question-text" id="questionText"></div>
      <div id="dynamicArea"></div>
      <div class="feedback" id="feedbackBox"></div>
      <button class="btn" id="nextBtn" disabled>Ответить</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="card">
      <h2>Результат</h2>
      <div class="result-score" id="resultScore">0/20</div>
      <div class="result-percent" id="resultPercent">0%</div>
      <div class="result-grade" id="resultGrade"></div>
      <div class="review" id="reviewBox"></div>
      <button class="btn" onclick="restart()">Пройти заново</button>
    </div>
  </div>

  <div class="footer">🐾 ВетСим — ветеринарное образование · <a href="https://vetsim.ru" target="_blank">vetsim.ru</a></div>
</div>

<script>
// ============ БАЗА ВОПРОСОВ (20 шт по Блуму) ============
const QUESTIONS = [
  // --- БЛОК 1. ЗНАНИЕ ---
  { type: "Одиночный выбор", question: "Из какого эмбрионального зачатка развивается эпидермис?", answers: [{ text: "Мезенхима", correct: false }, { text: "Эктодерма", correct: true }, { text: "Энтодерма", correct: false }, { text: "Мезодерма", correct: false }], explanation: "Эпидермис развивается из эктодермы. Дерма и гиподерма — из мезенхимы." },
  { type: "Одиночный выбор", question: "Какой слой эпидермиса является камбиальным (в нём происходят митозы)?", answers: [{ text: "Роговой", correct: false }, { text: "Зернистый", correct: false }, { text: "Базальный", correct: true }, { text: "Блестящий", correct: false }], explanation: "В базальном слое происходят митозы, обеспечивающие обновление клеток." },
  { type: "Множественный выбор", question: "Что относится к производным кожи? (выберите все верные)", answers: [{ text: "Волосы", correct: true }, { text: "Мякиши", correct: true }, { text: "Рога", correct: true }, { text: "Копыта", correct: true }, { text: "Молочная железа", correct: true }, { text: "Печень", correct: false }], explanation: "Производные кожи: волосы, мякиши, рога, копыта, копытца, кожные железы (сальные, потовые, молочная)." },
  { type: "Одиночный выбор", question: "Какая структура продуцирует глазурь копыта?", answers: [{ text: "Копытная стенка", correct: false }, { text: "Копытная кайма", correct: true }, { text: "Копытный венчик", correct: false }, { text: "Копытная подошва", correct: false }], explanation: "Глазурь продуцирует копытная кайма." },
  { type: "Одиночный выбор", question: "Тип секреции сальных желёз?", answers: [{ text: "Мерокриновая", correct: false }, { text: "Апокриновая", correct: false }, { text: "Голокриновая", correct: true }, { text: "Паракринная", correct: false }], explanation: "Сальные железы — голокриновые (клетка полностью разрушается)." },
  { type: "Одиночный выбор", question: "Чем выстланы альвеолы молочной железы?", answers: [{ text: "Многослойным плоским эпителием", correct: false }, { text: "Однослойным секреторным эпителием", correct: true }, { text: "Кубическим эпителием", correct: false }, { text: "Цилиндрическим эпителием", correct: false }], explanation: "Альвеолы выстланы однослойным секреторным эпителием (лактоцитами)." },
  { type: "Множественный выбор", question: "Что входит в состав копыта? (выберите все верные)", answers: [{ text: "Кайма", correct: true }, { text: "Венчик", correct: true }, { text: "Стенка", correct: true }, { text: "Подошва", correct: true }, { text: "Стрелка", correct: true }, { text: "Копытная кость", correct: false }], explanation: "В состав копыта входят: кайма, венчик, стенка, подошва, стрелка." },
  { type: "Одиночный выбор", question: "Что такое тургор кожи?", answers: [{ text: "Цвет кожи", correct: false }, { text: "Эластичность и упругость кожи", correct: true }, { text: "Толщина кожи", correct: false }, { text: "Температура кожи", correct: false }], explanation: "Тургор — эластичность кожи. Оценивается методом кожной складки." },

  // --- БЛОК 2. ПОНИМАНИЕ ---
  { type: "Одиночный выбор", question: "Куда открываются протоки сальных желёз?", answers: [{ text: "На поверхность кожи", correct: false }, { text: "В воронку волоса", correct: true }, { text: "В потовую железу", correct: false }, { text: "В дерму", correct: false }], explanation: "Протоки сальных желёз открываются в воронку волоса." },
  { type: "Множественный выбор", question: "Какие гормоны регулируют лактацию? (выберите все верные)", answers: [{ text: "Пролактин", correct: true }, { text: "Окситоцин", correct: true }, { text: "Кортизол", correct: true }, { text: "Адреналин", correct: false }, { text: "Инсулин", correct: false }, { text: "Тестостерон", correct: false }], explanation: "Лактацию регулируют пролактин, окситоцин, кортизол, соматотропин." },
  { type: "Одиночный выбор", question: "Где расположены потовые железы?", answers: [{ text: "В эпидермисе", correct: false }, { text: "В дерме и гиподерме", correct: true }, { text: "В роговом слое", correct: false }, { text: "В волосяной луковице", correct: false }], explanation: "Потовые железы расположены в глубоких слоях дермы и в гиподерме." },
  { type: "Одиночный выбор", question: "Где расположен молочный колодец (цистерна) у коровы?", answers: [{ text: "В толще соска, ниже сфинктера", correct: false }, { text: "В основании соска, над сосковым каналом", correct: true }, { text: "В паренхиме доли, между альвеолами", correct: false }, { text: "В соединительнотканной строме", correct: false }], explanation: "Молочная цистерна — расширенная полость в основании соска, где накапливается молоко перед доением." },

  // --- БЛОК 3. ПРИМЕНЕНИЕ ---
  { type: "Одиночный выбор", question: "Что ищем в соскобе при демодекозе?", answers: [{ text: "Бактерии", correct: false }, { text: "Клещей Demodex", correct: true }, { text: "Грибы", correct: false }, { text: "Вирусы", correct: false }], explanation: "При демодекозе в соскобе находят клещей Demodex." },
  { type: "Одиночный выбор", question: "В результате резаной раны повреждена кожа. За счёт какого слоя будет восстанавливаться эпидермис?", answers: [{ text: "За счёт сосочкового слоя дермы", correct: false }, { text: "За счёт базального слоя эпидермиса", correct: true }, { text: "За счёт рогового слоя", correct: false }, { text: "За счёт гиподермы", correct: false }], explanation: "Базальный слой (камбий) содержит стволовые клетки, которые делятся и восстанавливают эпидермис." },
  { type: "Одиночный выбор", question: "Какие клетки молочной железы способствуют выведению молока при доении?", answers: [{ text: "Лактоциты (секреторные)", correct: false }, { text: "Миоэпителиальные клетки", correct: true }, { text: "Фибробласты", correct: false }, { text: "Клетки соединительной ткани", correct: false }], explanation: "Миоэпителиальные (корзинчатые) клетки сокращаются под действием окситоцина и выжимают молоко из альвеол в протоки." },

  // --- БЛОК 4. АНАЛИЗ ---
  { type: "Множественный выбор", question: "Какие слои кожи не имеют кровеносных сосудов? (выберите все верные)", answers: [{ text: "Эпидермис", correct: true }, { text: "Роговой слой", correct: true }, { text: "Дерма", correct: false }, { text: "Гиподерма", correct: false }, { text: "Сосочковый слой", correct: false }, { text: "Базальный слой", correct: false }], explanation: "Эпидермис (включая роговой слой) не имеет сосудов. Питание — диффузное из дермы." },
  { type: "Одиночный выбор", question: "Что такое «голодные борозды» на копыте?", answers: [{ text: "Признак ламинита", correct: true }, { text: "Признак авитаминоза", correct: false }, { text: "Норма", correct: false }, { text: "Признак перекорма", correct: false }], explanation: "«Голодные борозды» — признак перенесённого ламинита." },

  // --- БЛОК 5. СИНТЕЗ ---
  { type: "Последовательность", question: "Установите правильную последовательность слоёв эпидермиса (начиная с самого глубокого):", sequence: ["Базальный", "Шиповатый", "Зернистый", "Блестящий", "Роговой"], explanation: "Слои эпидермиса снизу вверх: Базальный (камбий) → Шиповатый → Зернистый → Блестящий → Роговой." },
  { type: "Соответствие", question: "Установите соответствие между латинскими и русскими названиями органов кожного покрова:", matches: [{ left: "Cutis", right: "Кожа" }, { left: "Glandula mammaria", right: "Молочная железа" }, { left: "Pilus", right: "Волос" }, { left: "Ungula", right: "Копыто" }], explanation: "Cutis — кожа, Glandula mammaria — молочная железа, Pilus — волос, Ungula — копыто." }
];

// ============ СОСТОЯНИЕ ============
let currentQuestions = [];
let currentIndex = 0;
let userAnswers = [];
let score = 0;
let timerInterval = null;
let timeLeft = 480; // 8 минут

let seqSelected = [];
let matchSelectedLeft = null;
let matchPairs = {};

// ============ УТИЛИТЫ ============
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleQuestion(q) {
  const newQ = JSON.parse(JSON.stringify(q));
  if (newQ.type.includes('Одиночный') || newQ.type.includes('Множественный')) {
    newQ.answers = shuffle(newQ.answers);
  }
  if (newQ.type === 'Последовательность') {
    newQ.pool = shuffle([...newQ.sequence]);
  }
  if (newQ.type === 'Соответствие') {
    newQ.rightColumn = shuffle(newQ.matches.map(m => m.right));
  }
  return newQ;
}

// ============ ТАЙМЕР ============
function startTimer() {
  timeLeft = 480;
  updateTimerDisplay();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      finishQuiz();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const min = Math.floor(timeLeft / 60);
  const sec = timeLeft % 60;
  const el = document.getElementById('timerValue');
  el.textContent = String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  el.classList.toggle('warning', timeLeft <= 60);
}

// ============ ИНИЦИАЛИЗАЦИЯ ============
function init() {
  currentQuestions = shuffle(QUESTIONS).map(q => shuffleQuestion(q));
  currentIndex = 0;
  userAnswers = [];
  score = 0;

  document.getElementById('quizScreen').style.display = 'block';
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('timerBar').style.display = 'flex';

  startTimer();
  renderQuestion();
}

// ============ ОТРИСОВКА ============
function renderQuestion() {
  const q = currentQuestions[currentIndex];
  document.getElementById('questionType').textContent = q.type;
  document.getElementById('questionText').textContent = q.question;
  document.getElementById('questionCounter').textContent = `Вопрос ${currentIndex + 1} из ${currentQuestions.length}`;
  document.getElementById('scoreDisplay').textContent = `Баллов: ${score}`;
  document.getElementById('progressFill').style.width = ((currentIndex + 1) / currentQuestions.length * 100) + '%';

  const area = document.getElementById('dynamicArea');
  area.innerHTML = '';
  
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = currentIndex === currentQuestions.length - 1 ? 'Завершить' : 'Ответить';
  nextBtn.disabled = true;
  nextBtn.onclick = submitAnswer;

  const fb = document.getElementById('feedbackBox');
  fb.className = 'feedback';
  fb.innerHTML = '';

  seqSelected = [];
  matchSelectedLeft = null;
  matchPairs = {};

  if (q.type.includes('Одиночный') || q.type.includes('Множественный')) {
    renderStandard(q, area, nextBtn);
  } else if (q.type === 'Последовательность') {
    renderSequence(q, area, nextBtn);
  } else if (q.type === 'Соответствие') {
    renderMatching(q, area, nextBtn);
  }
}

function renderStandard(q, area, nextBtn) {
  const isMultiple = q.type.includes('Множественный');
  const box = document.createElement('div');
  box.className = 'answers';
  
  q.answers.forEach((ans, i) => {
    const div = document.createElement('div');
    div.className = 'answer';
    div.dataset.index = i;
    div.innerHTML = `<span class="marker">${String.fromCharCode(65 + i)}</span><span>${ans.text}</span>`;
    div.onclick = () => {
      if (div.classList.contains('correct') || div.classList.contains('wrong')) return;
      if (isMultiple) {
        div.classList.toggle('selected');
      } else {
        box.querySelectorAll('.answer').forEach(a => a.classList.remove('selected'));
        div.classList.add('selected');
      }
      nextBtn.disabled = box.querySelectorAll('.answer.selected').length === 0;
    };
    box.appendChild(div);
  });
  area.appendChild(box);
}

function renderSequence(q, area, nextBtn) {
  const target = document.createElement('div');
  target.className = 'seq-target';
  target.id = 'seqTarget';
  
  const pool = document.createElement('div');
  pool.className = 'seq-pool';
  pool.id = 'seqPool';

  q.pool.forEach(item => {
    const el = document.createElement('div');
    el.className = 'seq-item';
    el.textContent = item;
    el.dataset.val = item;
    el.onclick = () => {
      target.appendChild(el);
      seqSelected.push(item);
      el.onclick = () => {
        pool.appendChild(el);
        seqSelected = seqSelected.filter(x => x !== item);
        nextBtn.disabled = seqSelected.length === 0;
        el.onclick = arguments.callee;
      };
      nextBtn.disabled = seqSelected.length === 0;
    };
    pool.appendChild(el);
  });

  area.appendChild(pool);
  area.appendChild(document.createElement('hr')).style.margin = '10px 0';
  area.appendChild(target);
}

function renderMatching(q, area, nextBtn) {
  const container = document.createElement('div');
  container.className = 'match-container';

  const leftCol = document.createElement('div');
  leftCol.className = 'match-col';
  
  const rightCol = document.createElement('div');
  rightCol.className = 'match-col';

  q.matches.forEach((m, i) => {
    const el = document.createElement('div');
    el.className = 'match-item';
    el.textContent = m.left;
    el.dataset.idx = i;
    el.onclick = () => {
      if (el.classList.contains('matched')) return;
      leftCol.querySelectorAll('.match-item').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      matchSelectedLeft = i;
    };
    leftCol.appendChild(el);
  });

  q.rightColumn.forEach((text, i) => {
    const el = document.createElement('div');
    el.className = 'match-item';
    el.textContent = text;
    el.dataset.text = text;
    el.onclick = () => {
      if (el.classList.contains('matched')) return;
      if (matchSelectedLeft === null) return;

      matchPairs[matchSelectedLeft] = text;
      
      const leftEl = leftCol.querySelector(`.match-item[data-idx="${matchSelectedLeft}"]`);
      leftEl.classList.remove('selected');
      leftEl.classList.add('matched');
      leftEl.innerHTML = `${leftEl.textContent} <span class="match-badge">↔</span>`;
      
      el.classList.add('matched');
      el.innerHTML = `<span class="match-badge">↔</span> ${text}`;

      matchSelectedLeft = null;
      
      if (Object.keys(matchPairs).length === q.matches.length) {
        nextBtn.disabled = false;
      }
    };
    rightCol.appendChild(el);
  });

  container.appendChild(leftCol);
  container.appendChild(rightCol);
  area.appendChild(container);
}

// ============ ПРОВЕРКА ============
function submitAnswer() {
  const q = currentQuestions[currentIndex];
  let isCorrect = false;
  let userAnswerText = "";

  if (q.type.includes('Одиночный') || q.type.includes('Множественный')) {
    const isMultiple = q.type.includes('Множественный');
    const selected = [...document.querySelectorAll('.answer.selected')];
    const selectedIndices = selected.map(s => parseInt(s.dataset.index));
    const correctIndices = q.answers.map((a, i) => a.correct ? i : -1).filter(i => i !== -1);

    if (isMultiple) {
      const allCorrect = correctIndices.every(i => selectedIndices.includes(i));
      const noWrong = selectedIndices.every(i => correctIndices.includes(i));
      isCorrect = allCorrect && noWrong;
    } else {
      isCorrect = selectedIndices.length === 1 && correctIndices.includes(selectedIndices[0]);
    }

    userAnswerText = selected.map(s => s.textContent.trim()).join('; ') || '— не выбрано —';
    
    document.querySelectorAll('.answer').forEach((div) => {
      const idx = parseInt(div.dataset.index);
      div.classList.remove('selected');
      if (correctIndices.includes(idx)) div.classList.add('correct');
      else if (selectedIndices.includes(idx)) div.classList.add('wrong');
      div.onclick = null;
    });

  } else if (q.type === 'Последовательность') {
    isCorrect = seqSelected.every((val, index) => val === q.sequence[index]);
    userAnswerText = seqSelected.join(' → ');
    
    const targetItems = document.querySelectorAll('#seqTarget .seq-item');
    targetItems.forEach((el, i) => {
      el.style.border = (el.dataset.val === q.sequence[i]) ? '2px solid #6B9E6B' : '2px solid #D4A373';
      el.style.background = (el.dataset.val === q.sequence[i]) ? '#E8F5E8' : '#FDF0E8';
      el.onclick = null;
    });
    document.querySelectorAll('#seqPool .seq-item').forEach(el => el.onclick = null);

  } else if (q.type === 'Соответствие') {
    isCorrect = q.matches.every((m, i) => matchPairs[i] === m.right);
    userAnswerText = Object.keys(matchPairs).map(k => `${q.matches[k].left} → ${matchPairs[k]}`).join('; ');
    document.querySelectorAll('.match-item').forEach(el => el.onclick = null);
  }

  if (isCorrect) score++;

  userAnswers.push({ question: q, userAnswerText, isCorrect });

  const fb = document.getElementById('feedbackBox');
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = `<strong>${isCorrect ? '✅ Верно!' : '❌ Ошибка'}</strong><br>${q.explanation}`;

  document.getElementById('scoreDisplay').textContent = `Баллов: ${score}`;

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = false;
  nextBtn.textContent = currentIndex === currentQuestions.length - 1 ? 'Показать результат' : 'Следующий вопрос';
  nextBtn.onclick = nextQuestion;
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= currentQuestions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

// ============ ЗАВЕРШЕНИЕ ============
function finishQuiz() {
  clearInterval(timerInterval);
  document.getElementById('timerBar').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'none';
  const resultScreen = document.getElementById('resultScreen');
  resultScreen.classList.add('show');

  const total = currentQuestions.length;
  const percent = Math.round((score / total) * 100);

  document.getElementById('resultScore').textContent = `${score}/${total}`;
  document.getElementById('resultPercent').textContent = `${percent}%`;

  const gradeEl = document.getElementById('resultGrade');
  let grade, cls;
  if (percent >= 90) { grade = 'Оценка: 5 (отлично)'; cls = 'grade-5'; }
  else if (percent >= 75) { grade = 'Оценка: 4 (хорошо)'; cls = 'grade-4'; }
  else if (percent >= 60) { grade = 'Оценка: 3 (удовлетворительно)'; cls = 'grade-3'; }
  else { grade = 'Оценка: 2 (неудовлетворительно)'; cls = 'grade-2'; }
  gradeEl.textContent = grade;
  gradeEl.className = 'result-grade ' + cls;

  const reviewBox = document.getElementById('reviewBox');
  reviewBox.innerHTML = '<h3>📋 Разбор ответов</h3>';

  userAnswers.forEach((ua, i) => {
    const q = ua.question;
    let correctText = "";
    if (q.type === 'Последовательность') correctText = q.sequence.join(' → ');
    else if (q.type === 'Соответствие') correctText = q.matches.map(m => `${m.left} → ${m.right}`).join('; ');
    else correctText = q.answers.filter(a => a.correct).map(a => a.text).join('; ');

    const item = document.createElement('div');
    item.className = 'review-item';
    item.innerHTML = `
      <div class="num">${i + 1}. ${q.type}</div>
      <div style="margin: 4px 0;"><strong>Вопрос:</strong> ${q.question}</div>
      <div><strong>Ваш ответ:</strong> <span class="${ua.isCorrect ? 'ok' : 'bad'}">${ua.userAnswerText}</span></div>
      ${!ua.isCorrect ? `<div><strong>Правильный ответ:</strong> <span class="ok">${correctText}</span></div>` : ''}
      <div style="margin-top: 4px; color: #558b2f; font-size: 0.8rem;"><em>${q.explanation}</em></div>
    `;
    reviewBox.appendChild(item);
  });
}

function restart() {
  init();
}

// ============ СТАРТ ============
init();
</script>
