    // --------------------------------------------------------------
    // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
    // --------------------------------------------------------------
    let scenarios = scenariosData; // без перемешивания
    let currentIndex = 0;
    let completedCount = 0;
    let isAnswered = false;
    let totalScenarios = scenarios.length;

    const caseDescription = document.getElementById('caseDescription');
    const questionsContainer = document.getElementById('questionsContainer');
    const checkBtn = document.getElementById('checkBtn');
    const showExplanationBtn = document.getElementById('showExplanationBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resultArea = document.getElementById('resultArea');
    const resultMessage = document.getElementById('resultMessage');
    const explanationArea = document.getElementById('explanationArea');
    const explanationText = document.getElementById('explanationText');
    const scenarioLabel = document.getElementById('scenarioLabel');
    const counterDisplay = document.getElementById('counterDisplay');
    const progressFill = document.getElementById('progressFill');

    // --------------------------------------------------------------
    // ФУНКЦИИ ОТРИСОВКИ
    // --------------------------------------------------------------
    function resetState() {
        isAnswered = false;
        resultArea.style.display = 'none';
        explanationArea.style.display = 'none';
        nextBtn.disabled = true;
        checkBtn.disabled = false;
        showExplanationBtn.disabled = false;
        document.querySelectorAll('.question-select').forEach(sel => {
            sel.classList.remove('correct', 'wrong');
        });
    }

    function renderScenario(index) {
        const scenario = scenarios[index];
        if (!scenario) return;

        resetState();

        scenarioLabel.textContent = `Сценарий ${index + 1} из ${totalScenarios}`;
        const progress = ((index + 1) / totalScenarios) * 100;
        progressFill.style.width = `${progress}%`;
        counterDisplay.textContent = `✅ Пройдено: ${completedCount}`;

        caseDescription.textContent = scenario.description;

        questionsContainer.innerHTML = '';
        scenario.questions.forEach((q, qIdx) => {
            const block = document.createElement('div');
            block.className = 'question-block';

            const label = document.createElement('span');
            label.className = 'question-label';
            label.textContent = q.label;
            block.appendChild(label);

            const select = document.createElement('select');
            select.className = 'question-select';
            select.dataset.qIndex = qIdx;
            q.options.forEach((opt, oIdx) => {
                const option = document.createElement('option');
                option.value = oIdx;
                option.textContent = opt;
                select.appendChild(option);
            });
            // Добавим пустой первый вариант для индикации, что не выбрано
            // Но можно просто выбрать первый, чтобы не было пустого
            select.selectedIndex = 0;
            block.appendChild(select);

            questionsContainer.appendChild(block);
        });
    }

    // --------------------------------------------------------------
    // ОБРАБОТЧИКИ
    // --------------------------------------------------------------
    function checkAnswers() {
        if (isAnswered) return;

        const scenario = scenarios[currentIndex];
        const selects = document.querySelectorAll('.question-select');
        let allSelected = true;
        selects.forEach(sel => {
            if (sel.selectedIndex === -1 || sel.value === '') allSelected = false;
        });
        if (!allSelected) {
            alert('Пожалуйста, выберите вариант для каждого вопроса.');
            return;
        }

        let correctCount = 0;
        let total = scenario.questions.length;
        const results = [];

        selects.forEach((sel, idx) => {
            const selectedIdx = parseInt(sel.value, 10);
            const correctIdx = scenario.questions[idx].correct;
            const isCorrect = (selectedIdx === correctIdx);
            if (isCorrect) {
                sel.classList.add('correct');
                correctCount++;
            } else {
                sel.classList.add('wrong');
            }
            results.push({
                question: scenario.questions[idx].label,
                selected: scenario.questions[idx].options[selectedIdx],
                correct: scenario.questions[idx].options[correctIdx],
                isCorrect
            });
        });

        // Показать результат
        resultArea.style.display = 'block';
        resultMessage.innerHTML = `✅ Правильных ответов: ${correctCount} из ${total}`;

        // Показать пояснение (общее)
        explanationText.textContent = scenario.explanation;
        explanationArea.style.display = 'block';

        // Блокировка
        selects.forEach(sel => sel.disabled = true);
        checkBtn.disabled = true;
        showExplanationBtn.disabled = true;
        nextBtn.disabled = false;
        isAnswered = true;

        // Если все правильно, увеличиваем счетчик пройденных
        if (correctCount === total) {
            // Увеличим completedCount только если сценарий еще не был пройден (isAnswered только что стало true)
            // Но мы можем увеличить здесь, но чтобы не было двойного увеличения, проверим.
            // Для простоты будем увеличивать при переходе на следующий сценарий только если все ответы правильные.
            // Но лучше увеличивать здесь, так как сценарий считается пройденным при правильном ответе.
            // Однако пользователь может нажать "Проверить" несколько раз до правильного, но мы засчитываем только при первом правильном.
            // Так как isAnswered станет true только после проверки, и если correctCount===total, то это первый раз.
            // Но если пользователь нажал "Показать пояснение" и потом проверил, то isAnswered уже true, и проверка не выполнится.
            // Таким образом, мы можем безопасно увеличивать здесь.
            // Но нужно убедиться, что мы не увеличиваем повторно при повторной проверке, но мы блокируем проверку после первого раза.
            // Поэтому увеличиваем сейчас.
            completedCount++;
            updateCounterAndProgress();
        }
    }

    function showExplanation() {
        if (isAnswered) return;
        const scenario = scenarios[currentIndex];
        // Покажем правильные ответы без проверки
        const selects = document.querySelectorAll('.question-select');
        selects.forEach((sel, idx) => {
            const correctIdx = scenario.questions[idx].correct;
            const options = sel.options;
            for (let i = 0; i < options.length; i++) {
                if (i === correctIdx) {
                    // Можно подсветить, но не будем менять цвет, просто покажем пояснение.
                }
            }
        });
        // Показать пояснение
        explanationText.textContent = scenario.explanation;
        explanationArea.style.display = 'block';
        showExplanationBtn.disabled = true;
    }

    function nextScenario() {
        if (!isAnswered) return;
        if (currentIndex + 1 < totalScenarios) {
            currentIndex++;
            renderScenario(currentIndex);
        } else {
            alert('🎉 Поздравляем! Вы прошли все сценарии!');
            nextBtn.disabled = true;
        }
        updateCounterAndProgress();
    }

    function updateCounterAndProgress() {
        counterDisplay.textContent = `✅ Пройдено: ${completedCount}`;
        const progress = ((currentIndex + 1) / totalScenarios) * 100;
        progressFill.style.width = `${progress}%`;
        scenarioLabel.textContent = `Сценарий ${currentIndex + 1} из ${totalScenarios}`;
    }

    // --------------------------------------------------------------
    // ИНИЦИАЛИЗАЦИЯ
    // --------------------------------------------------------------
    function init() {
        renderScenario(0);
        updateCounterAndProgress();

        checkBtn.addEventListener('click', checkAnswers);
        showExplanationBtn.addEventListener('click', showExplanation);
        nextBtn.addEventListener('click', nextScenario);
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
