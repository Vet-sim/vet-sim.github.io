<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный тренажёр | ВетСим</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#FDF8F0;font-family:system-ui,'Segoe UI',Roboto;color:#3E5C4A;padding:1.5rem;}
        .container{max-width:1100px;margin:0 auto;}
        h1{font-size:1.8rem;color:#1F4E6E;text-align:center;}
        .sub{text-align:center;margin-bottom:1.5rem;}
        .trainer-layout{display:flex;gap:2rem;flex-wrap:wrap;}
        .left-img{flex:1; background:white; border-radius:28px; padding:1rem; text-align:center;}
        .left-img img{max-width:100%; border-radius:20px;}
        .right-panel{flex:2; background:white; border-radius:28px; padding:1.5rem; border:1px solid #E7EDE2;}
        .stage-buttons{display:flex; gap:0.8rem; flex-wrap:wrap; margin-bottom:1.5rem;}
        .stage-btn{background:#EEF2E9; border:none; padding:0.5rem 1rem; border-radius:40px; cursor:pointer;}
        .stage-btn.active{background:#2C7DA0; color:white;}
        .pairs-container{display:flex; flex-direction:column; gap:1rem; max-height:500px; overflow-y:auto;}
        .pair-row{background:#FEFCF9; border:1px solid #E2EAD9; border-radius:60px; padding:10px 18px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;}
        .pair-left{font-weight:600; background:#F0EEE5; padding:6px 14px; border-radius:40px;}
        select{padding:8px 12px; border-radius:40px; border:1px solid #D1DEC2; background:white;}
        .correct-badge{background:#DAF1D8; color:#2A6B2F; padding:4px 12px; border-radius:30px;}
        .progress-info{background:#F3F6EF; border-radius:40px; padding:8px 16px; margin-bottom:1rem; display:flex; justify-content:space-between;}
        footer{margin-top:2rem; text-align:center; font-size:0.7rem;}
        .reset-btn{background:#E2CFB0; border:none; padding:8px 20px; border-radius:40px; margin-top:1rem; cursor:pointer;}
        @media (max-width:700px){.pair-row{flex-direction:column; align-items:stretch; gap:0.5rem;}}
    </style>
</head>

<script>
    const stagesData = [{"name":"Квиз применение ветеринарных инструментов на практике","questions":[{"text":"У овцы повреждено копыто, необходимо удалить отросший рог и расчистить копытную щель. Для этого применяется специальный щипцовый инструмент. Какой инструмент используют?","options":["7","8","9","3"],"correct":0},{"text":"При аускультации сердца у лошади ветеринар использует прибор для прослушивания тонов. Что это за прибор?","options":["12","11","6","4"],"correct":0},{"text":"У бычка планируют бескровную кастрацию. Ветеринар накладывает резиновое кольцо на мошонку с помощью специального инструмента. Под какой цифрой изображен этот инструмент?","options":["9","7","6","8"],"correct":0},{"text":"При осмотре коровы на предмет бесплодия необходимо визуально оценить состояние влагалища и шейки матки. Для этого применяют инструмент, который раскрывает стенки влагалища. Что это за инструмент?","options":["6","1","2","8"],"correct":0},{"text":"На птицефабрике требуется провести массовую вакцинацию цыплят против болезни Ньюкасла. Для быстрой и точной инъекции используется специальный дозирующий инструмент. Какой инструмент нужен?","options":["11","6","8","4"],"correct":0},{"text":"У коровы затяжные роды, плод идёт неправильно (тазовое предлежание). Врачу необходимо захватить тазовые конечности телёнка и извлечь его, чтобы спасти мать и плод. Какой инструмент применяется?","options":["5","1","2","6"],"correct":0},{"text":"У коровы подозревают наличие металлического предмета в сетке рубца. Для его извлечения применяют инструмент с магнитным наконечником. Под какой цифрой представлен этот инструмент?","options":["4","8","11","9"],"correct":0},{"text":"При ушивании операционной раны требуется точно провести иглу через ткани. Ветврач берёт специальный инструмент для надёжного удержания иглы. Что это за инструмент?","options":["2","1","3","9"],"correct":0},{"text":"Ветеринарный врач проводит операцию на брюшной полости собаки. Ему необходимо временно остановить кровотечение из небольшого сосуда. Какой инструмент он использует?","options":["1","2","3","9"],"correct":0},{"text":"Для контроля качества куриных яиц на инкубацию используется прибор, просвечивающий содержимое яйца. Под какой цифрой изображен этот прибор?","options":["10","8","4","6"],"correct":0},{"text":"В ходе операции на мягких тканях собаке нужно сделать разрез. Врач выбирает ножницы, лезвия которых изогнуты по плоскости, чтобы не травмировать подлежащие структуры. Что это за ножницы?","options":["3","2","1","9"],"correct":0},{"text":"У лошади выявлены проблемы с зубами, требуется провести осмотр ротовой полости. Чтобы безопасно зафиксировать челюсти животного и получить доступ, используют специальный инструмент. Какой инструмент нужен?","options":["8","5","6","9"],"correct":0}]},{"name":"Квиз название ветеринарных инструментов","questions":[{"text":"Какой инструмент изображен под цифрой 1?","options":["Кровоостанавливающий зажим","Хирургические ножницы Купера","Иглодержатель Гегара","Эмаскулятор"],"correct":0},{"text":"Какой инструмент изображен под цифрой 2?","options":["Иглодержатель Гегара","Влагалищное зеркало","Кровоостанавливающий зажим","Хирургические ножницы Купера"],"correct":0},{"text":"Какой инструмент изображен под цифрой 3?","options":["Хирургические ножницы Купера","Иглодержатель Гегара","Кровоостанавливающий зажим","Зевник ветеринарный (клин) Байера"],"correct":0},{"text":"Какой инструмент изображен под цифрой 4?","options":["Магнитный зонд Коробова","Зевник ветеринарный (клин) Байера","Копытные щипцы","Влагалищное зеркало"],"correct":0},{"text":"Какой инструмент изображен под цифрой 5?","options":["Акушерская клюка","Влагалищное зеркало","Эмаскулятор","Зевник ветеринарный (клин) Байера"],"correct":0},{"text":"Какой инструмент изображен под цифрой 6?","options":["Влагалищное зеркало","Эмаскулятор","Зевник ветеринарный (клин) Байера","Стетофонендоскоп"],"correct":0},{"text":"Какой инструмент изображен под цифрой 7?","options":["Копытные щипцы","Эмаскулятор","Влагалищное зеркало","Зевник ветеринарный (клин) Байера"],"correct":0},{"text":"Какой инструмент изображен под цифрой 8?","options":["Зевник ветеринарный (клин) Байера","Копытные щипцы","Эмаскулятор","Стетофонендоскоп"],"correct":0},{"text":"Какой инструмент изображен под цифрой 9?","options":["Эмаскулятор","Копытные щипцы","Влагалищное зеркало","Хирургические ножницы Купера"],"correct":0},{"text":"Какой прибор изображен под цифрой 10?","options":["Овоскоп","Стетофонендоскоп","Магнитный зонд Коробова","Шприц-инъектор"],"correct":0},{"text":"Какой прибор изображен под цифрой 11?","options":["Шприц-инъектор","Магнитный зонд Коробова","Влагалищное зеркало","Эмаскулятор"],"correct":0},{"text":"Какой прибор изображен под цифрой 12?","options":["Стетофонендоскоп","Эмаскулятор","Зевник ветеринарный (клин) Байера","Магнитный зонд Коробова"],"correct":0}]}];
    let currentStageIdx = 0;
    let userAnswers = [];
    let shuffledOptions = [];

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initShuffled() {
        shuffledOptions = [];
        for (let s = 0; s < stagesData.length; s++) {
            shuffledOptions[s] = [];
            for (let q = 0; q < stagesData[s].questions.length; q++) {
                let indices = stagesData[s].questions[q].options.map((_, idx) => idx);
                shuffledOptions[s][q] = shuffleArray([...indices]);
            }
        }
    }

    function initAnswers() {
        userAnswers = [];
        for (let s = 0; s < stagesData.length; s++) {
            userAnswers[s] = new Array(stagesData[s].questions.length).fill(null);
        }
    }

    function countCorrect() {
        let correct = 0;
        let stage = stagesData[currentStageIdx];
        if (!stage) return 0;
        for (let qIdx = 0; qIdx < stage.questions.length; qIdx++) {
            let ans = userAnswers[currentStageIdx][qIdx];
            if (ans !== null && ans === stage.questions[qIdx].correct) correct++;
        }
        return correct;
    }

    function updateProgress() {
        let correct = countCorrect();
        let total = stagesData[currentStageIdx].questions.length;
        document.getElementById('progressText').innerHTML = `✅ Правильных ответов: ${correct} / ${total}`;
    }

    function renderStage() {
        const container = document.getElementById('gameContainer');
        const stage = stagesData[currentStageIdx];
        if (!stage) return;
        container.innerHTML = '';
        for (let qIdx = 0; qIdx < stage.questions.length; qIdx++) {
            const q = stage.questions[qIdx];
            const row = document.createElement('div');
            row.className = 'pair-row';
            const leftSpan = document.createElement('div');
            leftSpan.className = 'pair-left';
            leftSpan.textContent = q.text;
            const select = document.createElement('select');
            const defaultOpt = document.createElement('option');
            defaultOpt.value = '';
            defaultOpt.textContent = '— выберите ответ —';
            select.appendChild(defaultOpt);
            const shuffled = shuffledOptions[currentStageIdx][qIdx];
            for (let optIdx of shuffled) {
                const optEl = document.createElement('option');
                optEl.value = optIdx;
                optEl.textContent = q.options[optIdx];
                if (userAnswers[currentStageIdx][qIdx] === optIdx) optEl.selected = true;
                select.appendChild(optEl);
            }
            select.addEventListener('change', (e) => {
                const val = parseInt(e.target.value);
                userAnswers[currentStageIdx][qIdx] = isNaN(val) ? null : val;
                updateProgress();
                highlightRow(row, qIdx);
            });
            row.appendChild(leftSpan);
            row.appendChild(select);
            container.appendChild(row);
            highlightRow(row, qIdx);
        }
        updateProgress();
    }

    function highlightRow(row, qIdx) {
        const isCorrect = (userAnswers[currentStageIdx][qIdx] === stagesData[currentStageIdx].questions[qIdx].correct);
        const badge = row.querySelector('.correct-badge');
        if (badge) badge.remove();
        row.style.backgroundColor = isCorrect ? '#F1F9EE' : '#FEFCF9';
        row.style.borderLeft = isCorrect ? '4px solid #7CA86A' : '1px solid #E2EAD9';
        if (isCorrect && !row.querySelector('.correct-badge')) {
            const span = document.createElement('span');
            span.className = 'correct-badge';
            span.textContent = '✓ верно';
            row.appendChild(span);
        } else if (!isCorrect && row.querySelector('.correct-badge')) row.querySelector('.correct-badge').remove();
    }

    function renderStageButtons() {
        const btnsDiv = document.getElementById('stageButtons');
        btnsDiv.innerHTML = '';
        stagesData.forEach((stage, idx) => {
            const btn = document.createElement('button');
            btn.textContent = stage.name || `Этап ${idx+1}`;
            btn.classList.add('stage-btn');
            if (idx === currentStageIdx) btn.classList.add('active');
            btn.onclick = () => {
                currentStageIdx = idx;
                renderStageButtons();
                renderStage();
            };
            btnsDiv.appendChild(btn);
        });
    }

    function resetAnswers() {
        for (let i = 0; i < stagesData[currentStageIdx].questions.length; i++) {
            userAnswers[currentStageIdx][i] = null;
        }
        renderStage();
    }

    initShuffled();
    initAnswers();
    renderStageButtons();
    renderStage();
    document.getElementById('resetBtn').onclick = resetAnswers;
</script>
</body>
</html>
