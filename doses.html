    // ----- Логика работы -----
    const groupSelect = document.getElementById('groupSelect');
    const drugSelect = document.getElementById('drugSelect');
    const weightInput = document.getElementById('weightInput');
    const calcBtn = document.getElementById('calcBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultPanel = document.getElementById('resultPanel');

    function filterDrugsByGroup(group) {
        const filtered = drugs.filter(d => d.group.includes(group));
        drugSelect.innerHTML = '';
        filtered.forEach(d => {
            const option = document.createElement('option');
            option.value = d.id;
            option.textContent = `${d.name} (${d.status})`;
            drugSelect.appendChild(option);
        });
        if (filtered.length) drugSelect.selectedIndex = 0;
    }

    function getDrugById(id) {
        return drugs.find(d => d.id === parseInt(id));
    }

    function calculate() {
        const group = groupSelect.value;
        const drugId = drugSelect.value;
        const weight = parseFloat(weightInput.value);
        if (isNaN(weight) || weight <= 0) {
            resultPanel.innerHTML = `<div class="warning">⚠️ Введите корректный вес животного (кг)</div>`;
            return;
        }
        const drug = getDrugById(drugId);
        if (!drug) return;
        const avgDose = (drug.doseMin + drug.doseMax) / 2;
        const doseMg = avgDose * weight;
        const volumeMl = doseMg / drug.concentration;
        let freq = 1;
        if (drug.frequency.includes('2 раза')) freq = 2;
        else if (drug.frequency.includes('3 раза')) freq = 3;
        else if (drug.frequency.includes('4 раза')) freq = 4;
        else freq = 1;
        const dailyMl = volumeMl * freq;
        let withdrawal = '';
        if (drug.meatWD) withdrawal += `Мясо: ${drug.meatWD} дн. `;
        if (drug.milkWD) withdrawal += `Молоко: ${drug.milkWD} ч. `;
        if (drug.eggsWD) withdrawal += `Яйца: ${drug.eggsWD} дн.`;
        if (!withdrawal) withdrawal = 'Не регламентировано для СХ (или не適用)';
        resultPanel.innerHTML = `
            <div class="result-line"><strong>💊 ${drug.name}</strong> (${drug.status}, группа ${drug.group})</div>
            <div class="result-line">⚖️ Разовая доза: <strong>${volumeMl.toFixed(2)} мл</strong> (средняя ${avgDose} мг/кг × ${weight} кг / ${drug.concentration} мг/мл)</div>
            <div class="result-line">📅 Суточная доза (${freq} раз/д): <strong>${dailyMl.toFixed(2)} мл</strong></div>
            <div class="result-line">🚀 Способ введения: ${drug.injectionSpeed}</div>
            <div class="result-line">⏱️ Путь введения / кратность: ${drug.route}, ${drug.frequency}</div>
            <div class="result-line">🐄 Ограничения продукции: ${withdrawal}</div>
            <div class="result-line">⚠️ Противопоказания: ${drug.contraindications}</div>
            ${drug.note ? `<div class="result-line">📌 Примечание: ${drug.note}</div>` : ''}
        `;
    }

    function resetForm() {
        weightInput.value = '10';
        groupSelect.dispatchEvent(new Event('change'));
        resultPanel.innerHTML = `<div class="result-line">📌 Результат появится после расчёта</div>`;
    }

    groupSelect.addEventListener('change', () => {
        filterDrugsByGroup(groupSelect.value);
    });

    calcBtn.addEventListener('click', calculate);
    resetBtn.addEventListener('click', resetForm);

    // Начальная фильтрация (мелкие домашние)
