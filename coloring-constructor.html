<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.0">
    <title>Конструктор раскрасок с заданиями | ВетСим</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #FDF8F0;
            font-family: 'Montserrat', system-ui, sans-serif;
            color: #3E5C4A;
            padding: 1rem;
            min-height: 100vh;
            touch-action: manipulation;
        }
        .main-container {
            max-width: 1500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            height: 100vh;
            max-height: 100vh;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: #3E5C4A;
            white-space: nowrap;
        }
        .logo span {
            background: linear-gradient(135deg, #6B8C5C, #A38B60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }
        .btn {
            background: #EBE3D2;
            border: none;
            padding: 4px 12px;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.75rem;
            font-family: inherit;
            color: #3E5C4A;
            white-space: nowrap;
            touch-action: manipulation;
            min-height: 32px;
        }
        .btn:hover { opacity: 0.85; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #A3B18A; color: #2C4027; }
        .btn-accent { background: #2C7DA0; color: white; }
        .btn-danger { background: #D4A373; color: white; }
        .btn-success { background: #6B9E6B; color: white; }
        .btn-warning { background: #E2CFB0; color: #4D3E2A; }
        .btn-sm { padding: 2px 8px; font-size: 0.65rem; min-height: 26px; }

        .workspace {
            display: flex;
            flex: 1;
            gap: 0.8rem;
            min-height: 0;
            flex-wrap: wrap;
        }

        /* --- Холст теперь flex: 1 --- */
        .canvas-wrapper {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
            position: relative;
            touch-action: none;
        }
        #canvasContainer {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: auto;
            background: #f5f0e8;
            touch-action: none;
            -webkit-overflow-scrolling: touch;
        }
        #colorCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #f5f0e8;
            touch-action: none;
            border-radius: 1.5rem;
        }

        /* --- Панель с фиксированной шириной 340px --- */
        .side-panel {
            width: 340px;
            min-width: 340px;
            max-width: 340px;
            background: white;
            border-radius: 1.5rem;
            padding: 0.8rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            max-height: 100%;
            gap: 6px;
        }
        .side-panel h3 {
            font-size: 0.85rem;
            color: #3E5C4A;
            margin-bottom: 2px;
        }
        .panel-section {
            border-bottom: 1px solid #EDE8DC;
            padding-bottom: 6px;
            margin-bottom: 6px;
        }
        .panel-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .form-row {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }
        .form-row input,
        .form-row select,
        .form-row textarea {
            flex: 1;
            min-width: 50px;
            background: #FEFAF2;
            border: 1px solid #D9D0BD;
            padding: 4px 8px;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-family: inherit;
            color: #3E5C4A;
            touch-action: manipulation;
        }
        .form-row textarea {
            border-radius: 1rem;
            resize: vertical;
            min-height: 40px;
        }
        .form-row .btn { padding: 3px 10px; font-size: 0.7rem; }

        .label-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .label-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #F4EFE4;
            padding: 2px 8px;
            border-radius: 2rem;
            font-size: 0.7rem;
            gap: 4px;
        }
        .label-item .num {
            font-weight: 700;
            color: #2C7DA0;
            min-width: 20px;
        }
        .label-item .del-btn {
            background: none;
            border: none;
            color: #D4A373;
            cursor: pointer;
            font-size: 0.7rem;
            touch-action: manipulation;
        }
        .empty-msg {
            color: #7B8D6E;
            font-size: 0.75rem;
            padding: 4px 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #EDE8DC;
            border-radius: 2rem;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6B9E6B, #A3B18A);
            border-radius: 2rem;
            transition: width 0.3s ease;
        }

        .answer-field {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 0;
        }
        .answer-field .num {
            font-weight: 700;
            color: #2C7DA0;
            min-width: 20px;
            font-size: 0.8rem;
        }
        .answer-field input {
            flex: 1;
            padding: 4px 10px;
            border: 2px solid #D1DEC2;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-family: inherit;
            background: #FEFCF9;
            transition: 0.2s;
            touch-action: manipulation;
            min-height: 36px;
        }
        .answer-field input:focus {
            outline: none;
            border-color: #2C7DA0;
        }
        .answer-field input.correct {
            border-color: #6B9E6B;
            background: #E2F0DA;
        }
        .answer-field input.wrong {
            border-color: #D4A373;
            background: #FDE8E0;
        }
        .answer-field .correct-answer {
            display: none;
        }

        @media (max-width: 900px) {
            .workspace { flex-direction: column; }
            .side-panel {
                width: 100%;
                min-width: unset;
                max-width: 100%;
                max-height: 300px;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 4px;
            }
            .side-panel .panel-section {
                flex: 1;
                min-width: 160px;
                border-bottom: none;
                padding-bottom: 0;
                margin-bottom: 0;
            }
            .header { flex-direction: column; align-items: stretch; }
            .header-actions { justify-content: center; }
        }
        @media (max-width: 600px) {
            body { padding: 0.5rem; }
            .logo { font-size: 0.9rem; }
            .side-panel { max-height: 250px; }
            .side-panel .panel-section { min-width: 140px; }
            .btn { padding: 3px 8px; font-size: 0.65rem; min-height: 28px; }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .side-panel { max-height: 150px; }
            .label-list { max-height: 80px; }
        }
        @media print {
            .header-actions .btn { display: none !important; }
            .side-panel { display: none !important; }
            .canvas-wrapper { flex: 1; }
            body { padding: 0.5rem; background: white; }
            .main-container { height: auto; max-height: none; }
        }
    </style>
</head>
<body>
<div class="main-container">
    <header class="header">
        <div class="logo">🐾 <span>ВетСим</span> — Конструктор раскрасок</div>
        <div class="header-actions">
            <button class="btn btn-primary" id="saveBtn">💾 Сохранить JSON</button>
            <button class="btn btn-primary" id="loadJsonBtn">📂 Загрузить JSON</button>
            <button class="btn btn-accent" id="exportTaskBtn">📤 Экспорт в HTML</button>
            <button class="btn btn-warning" id="loadExampleBtn">📂 Пример</button>
            <button class="btn btn-danger" id="resetBtn">🔄 Сброс</button>
        </div>
    </header>

    <div class="workspace">
        <div class="canvas-wrapper">
            <div id="canvasContainer">
                <canvas id="colorCanvas"></canvas>
            </div>
        </div>

        <div class="side-panel" id="sidePanel">
            <div class="panel-section">
                <h3>🖼️ Изображение</h3>
                <div class="form-row">
                    <label class="btn btn-sm btn-primary" style="display:inline-flex; align-items:center; gap:4px; cursor:pointer;">
                        📂 Загрузить
                        <input type="file" id="imageInput" accept="image/*" style="display:none;">
                    </label>
                    <button class="btn btn-sm btn-danger" id="clearImageBtn">🗑️ Удалить</button>
                </div>
                <div style="font-size:0.65rem; color:#7B8D6E; margin-top:2px;">
                    Загрузите контурный рисунок для создания задания
                </div>
            </div>

            <div class="panel-section" id="labelsSection">
                <h3>📍 Метки <span style="font-weight:400; font-size:0.7rem; color:#7B8D6E;">(кликните на изображение)</span></h3>
                <div class="label-list" id="labelList">
                    <span class="empty-msg">Нет меток. Нажмите на изображение, чтобы добавить.</span>
                </div>
            </div>

            <div class="panel-section" id="matchingSection">
                <h3>📋 Соответствия</h3>
                <div class="form-row">
                    <button class="btn btn-sm btn-primary" id="loadMatchingBtn">📂 Загрузить TXT</button>
                    <input type="file" id="matchingInput" accept=".txt" style="display:none;">
                    <button class="btn btn-sm btn-warning" id="fillMatchingBtn">📋 Вставить</button>
                </div>
                <div class="form-row">
                    <textarea id="matchingText" rows="3" placeholder="Формат: 1; Название структуры"></textarea>
                </div>
                <div style="font-size:0.65rem; color:#7B8D6E;">Формат: номер; название (каждый с новой строки)</div>
            </div>

            <div class="panel-section" id="instructionSection">
                <h3>📝 Инструкция для студентов</h3>
                <div class="form-row">
                    <textarea id="instructionText" rows="2" placeholder="Введите инструкцию для студентов..."></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<input type="file" id="jsonInput" accept=".json" style="display:none;">

<script>
    // ================================================================
    //  ОСНОВНАЯ ЛОГИКА КОНСТРУКТОРА
    // ================================================================

    let imageData = null;
    let labels = [];
    let matching = {};
    let nextLabelId = 1;
    let bgImage = null;
    let bgWidth = 800;
    let bgHeight = 600;
    let canvasScale = 1;
    let canvasOffsetX = 0;
    let canvasOffsetY = 0;

    const canvas = document.getElementById('colorCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');
    const labelListEl = document.getElementById('labelList');
    const matchingText = document.getElementById('matchingText');
    const instructionText = document.getElementById('instructionText');
    const imageInput = document.getElementById('imageInput');
    const matchingInput = document.getElementById('matchingInput');
    const jsonInput = document.getElementById('jsonInput');

    function init() {
        resizeCanvas();
        setupEventListeners();
        loadFromLocalStorage();
        updateUI();
        if (!imageData) {
            drawPlaceholder();
        }
    }

    function resizeCanvas() {
        const rect = container.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) {
            setTimeout(resizeCanvas, 100);
            return;
        }
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.scale(dpr, dpr);
        canvasScale = dpr;
        render();
    }

    function render() {
        const w = canvas.width / canvasScale;
        const h = canvas.height / canvasScale;
        ctx.clearRect(0, 0, w, h);

        if (bgImage && bgImage.complete && bgImage.width > 0) {
            const imgRatio = bgImage.width / bgImage.height;
            const canvasRatio = w / h;
            let drawW, drawH, dx, dy;
            if (imgRatio > canvasRatio) {
                drawW = w;
                drawH = w / imgRatio;
                dx = 0;
                dy = (h - drawH) / 2;
            } else {
                drawH = h;
                drawW = h * imgRatio;
                dx = (w - drawW) / 2;
                dy = 0;
            }
            canvasOffsetX = dx;
            canvasOffsetY = dy;
            ctx.drawImage(bgImage, dx, dy, drawW, drawH);
        } else {
            drawPlaceholder();
        }

        renderLabels();
    }

    function drawPlaceholder() {
        const w = canvas.width / canvasScale;
        const h = canvas.height / canvasScale;
        ctx.fillStyle = '#f5f0e8';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#7B8D6E';
        ctx.font = '20px Montserrat, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🐾 Загрузите контур для начала работы', w/2, h/2 - 20);
        ctx.font = '14px Montserrat, sans-serif';
        ctx.fillStyle = '#8A9B7A';
        ctx.fillText('Нажмите "Загрузить" и выберите изображение', w/2, h/2 + 30);
    }

    function renderLabels() {
        container.querySelectorAll('.label-marker').forEach(el => el.remove());

        const w = canvas.width / canvasScale;
        const h = canvas.height / canvasScale;

        for (const label of labels) {
            const x = (label.x / bgWidth) * w + canvasOffsetX;
            const y = (label.y / bgHeight) * h + canvasOffsetY;

            const marker = document.createElement('div');
            marker.className = 'label-marker';
            marker.style.cssText = `position: absolute; transform: translate(-50%, -50%); width: 28px; height: 28px; border-radius: 50%; background: #D4A373; color: white; font-size: 12px; font-weight: 700; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.25); cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: none; left: ${x}px; top: ${y}px;`;
            marker.textContent = label.number;
            marker.dataset.id = label.id;

            const delBtn = document.createElement('div');
            delBtn.style.cssText = 'position: absolute; top: -8px; right: -8px; width: 16px; height: 16px; border-radius: 50%; background: #D4A373; color: white; border: 2px solid white; font-size: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; touch-action: manipulation;';
            delBtn.textContent = '×';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteLabel(label.id);
            });
            delBtn.addEventListener('touchstart', (e) => {
                e.stopPropagation();
                deleteLabel(label.id);
            });
            marker.appendChild(delBtn);

            marker.addEventListener('mousedown', (e) => startDrag(e, label.id));
            marker.addEventListener('touchstart', (e) => startDrag(e, label.id), { passive: false });

            container.appendChild(marker);
        }
    }

    function startDrag(e, labelId) {
        e.preventDefault();
        const label = labels.find(l => l.id === labelId);
        if (!label) return;

        const rect = container.getBoundingClientRect();
        const touch = e.touches ? e.touches[0] : e;
        const offsetX = (touch.clientX - rect.left) / rect.width * bgWidth - label.x;
        const offsetY = (touch.clientY - rect.top) / rect.height * bgHeight - label.y;

        const onMove = (ev) => {
            ev.preventDefault();
            const t = ev.touches ? ev.touches[0] : ev;
            const newX = (t.clientX - rect.left) / rect.width * bgWidth - offsetX;
            const newY = (t.clientY - rect.top) / rect.height * bgHeight - offsetY;
            label.x = Math.max(0, Math.min(bgWidth, newX));
            label.y = Math.max(0, Math.min(bgHeight, newY));
            render();
            updateUI();
            saveToLocalStorage();
        };

        const onEnd = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onEnd);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
    }

    // ================================================================
    //  УПРАВЛЕНИЕ МЕТКАМИ
    // ================================================================

    function addLabel(x, y) {
        if (!bgImage) {
            showToast('Сначала загрузите изображение.');
            return null;
        }
        const number = labels.length + 1;
        const label = {
            id: nextLabelId++,
            x: x,
            y: y,
            number: number
        };
        labels.push(label);
        render();
        updateUI();
        saveToLocalStorage();
        return label;
    }

    function deleteLabel(id) {
        labels = labels.filter(l => l.id !== id);
        labels.forEach((l, idx) => l.number = idx + 1);
        render();
        updateUI();
        saveToLocalStorage();
    }

    function loadImage(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                bgImage = img;
                bgWidth = img.width;
                bgHeight = img.height;
                imageData = e.target.result;
                render();
                saveToLocalStorage();
                showToast('🖼️ Изображение загружено!');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function loadMatchingFromText(text) {
        const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
        const newMatching = {};
        for (const line of lines) {
            const parts = line.split(';');
            if (parts.length >= 2) {
                const num = parseInt(parts[0].trim());
                const name = parts.slice(1).join(';').trim();
                if (!isNaN(num) && name) {
                    newMatching[num] = name;
                }
            }
        }
        matching = newMatching;
        updateMatchingText();
        updateUI();
        saveToLocalStorage();
        showToast('✅ Загружено ' + Object.keys(matching).length + ' соответствий');
    }

    function updateMatchingText() {
        const lines = Object.keys(matching).sort((a, b) => a - b).map(k => k + '; ' + matching[k]);
        matchingText.value = lines.join('\n');
    }

    function updateUI() {
        labelListEl.innerHTML = '';
        if (labels.length === 0) {
            labelListEl.innerHTML = '<span class="empty-msg">Нет меток. Нажмите на изображение, чтобы добавить.</span>';
            return;
        }
        const sorted = labels.slice().sort((a, b) => a.number - b.number);
        for (const label of sorted) {
            const name = matching[label.number] || '—';
            const div = document.createElement('div');
            div.className = 'label-item';
            div.innerHTML = `<span class="num">#${label.number}</span><span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${name}</span><button class="del-btn" data-id="${label.id}">🗑️</button>`;
            div.querySelector('.del-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                deleteLabel(parseInt(e.target.dataset.id));
            });
            labelListEl.appendChild(div);
        }
    }

    // ================================================================
    //  ЭКСПОРТ В HTML
    // ================================================================

    function exportTask() {
        if (labels.length === 0) {
            showToast('Добавьте метки на изображение.');
            return;
        }
        if (Object.keys(matching).length === 0) {
            showToast('Добавьте соответствия для меток.');
            return;
        }
        if (!imageData) {
            showToast('Загрузите изображение.');
            return;
        }

        const exportData = {
            imageData: imageData,
            labels: labels,
            matching: matching,
            instruction: instructionText.value || '',
            bgWidth: bgWidth,
            bgHeight: bgHeight
        };

        const jsonStr = JSON.stringify(exportData);
        const safeJson = jsonStr.replace(/<\/script>/gi, '<\\/script>');

        let html = '<!DOCTYPE html>\n';
        html += '<html lang="ru">\n';
        html += '<head>\n';
        html += '    <meta charset="UTF-8">\n';
        html += '    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.0">\n';
        html += '    <title>Анатомический тренажёр | ВетСим</title>\n';
        html += '    <link rel="preconnect" href="https://fonts.googleapis.com">\n';
        html += '    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n';
        html += '    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">\n';
        html += '    <style>\n';
        html += '        * { box-sizing: border-box; margin: 0; padding: 0; }\n';
        html += '        body { background: #FDF8F0; font-family: \'Montserrat\', system-ui, sans-serif; color: #3E5C4A; padding: 1rem; min-height: 100vh; touch-action: manipulation; }\n';
        html += '        .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.8rem; }\n';
        html += '        .header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; background: white; padding: 0.5rem 1rem; border-radius: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }\n';
        html += '        .logo { font-size: 1.1rem; font-weight: 700; color: #3E5C4A; }\n';
        html += '        .logo span { background: linear-gradient(135deg, #6B8C5C, #A38B60); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }\n';
        html += '        .mode-badge { background: #2C7DA0; color: white; padding: 3px 14px; border-radius: 2rem; font-size: 0.75rem; font-weight: 600; }\n';

        html += '        @media (max-width: 700px) { .workspace { flex-direction: column; } .side-panel { width: 100%; min-width: unset; max-width: 100%; max-height: 300px; } .header { flex-direction: column; align-items: stretch; } }\n';

        html += '                <select id="brushSize">\n';
        html += '                    <option value="4">Тонкая</option>\n';
        html += '                    <option value="8" selected>Средняя</option>\n';
        html += '                    <option value="16">Толстая</option>\n';

        if (exportData.instruction) {
            html += '            <div class="instruction-box"><strong>📝 Задание:</strong> ' + exportData.instruction + '</div>\n';
        }

        html += '            <div id="answerFields"></div>\n';
        html += '            <div class="action-row">\n';
        html += '                <button class="btn btn-success btn-sm" id="checkBtn">✅ Проверить</button>\n';
        html += '                <button class="btn btn-warning btn-sm" id="clearBtn">🧹 Очистить</button>\n';
        html += '            </div>\n';
        html += '            <div class="result-message" id="resultMessage"></div>\n';
        html += '            <div class="progress-bar"><div class="fill" id="progressFill"></div></div>\n';
        html += '            <div style="font-size:0.65rem; color:#7B8D6E; margin-top:4px;">💡 Раскрасьте рисунок для лучшего запоминания</div>\n';
        html += '        </div>\n';
        html += '    </div>\n';
        html += '    <footer>© ВетСим — образовательная платформа</footer>\n';
        html += '</div>\n';

        html += '<script>\n';
        html += '    const data = ' + safeJson + ';\n';
        html += '    const labels = data.labels || [];\n';
        html += '    const matching = data.matching || {};\n';
        html += '    const bgWidth = data.bgWidth || 800;\n';
        html += '    const bgHeight = data.bgHeight || 600;\n';
        html += '    const canvas = document.getElementById("colorCanvas");\n';
        html += '    const ctx = canvas.getContext("2d");\n';
        html += '    const container = document.getElementById("canvasContainer");\n';
        html += '    const answerFields = document.getElementById("answerFields");\n';
        html += '    const progressFill = document.getElementById("progressFill");\n';
        html += '    const resultMessage = document.getElementById("resultMessage");\n';
        html += '    const brushColor = document.getElementById("brushColor");\n';
        html += '    const brushSize = document.getElementById("brushSize");\n';
        html += '    let bgImage = null;\n';
        html += '    let isDrawing = false;\n';
        html += '    let lastX = 0, lastY = 0;\n';

        html += '    function renderLabels() {\n';
        html += '        container.querySelectorAll(".label-marker").forEach(el => el.remove());\n';
        html += '        const rect = container.getBoundingClientRect();\n';
        html += '        const w = rect.width || 600;\n';
        html += '        const h = (rect.width / bgWidth * bgHeight) || 400;\n';
        html += '        for (const label of labels) {\n';
        html += '            const x = (label.x / bgWidth) * w;\n';
        html += '            const y = (label.y / bgHeight) * h;\n';
        html += '            const marker = document.createElement("div");\n';
        html += '            marker.className = "label-marker";\n';
        html += '            marker.style.left = x + "px";\n';
        html += '            marker.style.top = y + "px";\n';
        html += '            marker.textContent = label.number;\n';
        html += '            container.appendChild(marker);\n';
        html += '        }\n';
        html += '    }\n';

        html += '    function resizeCanvas() {\n';
        html += '        const rect = container.getBoundingClientRect();\n';
        html += '        if (rect.width === 0 || rect.height === 0) { setTimeout(resizeCanvas, 100); return; }\n';
        html += '        const dpr = window.devicePixelRatio || 1;\n';
        html += '        canvas.width = rect.width * dpr;\n';
        html += '        canvas.height = (rect.width / bgWidth * bgHeight) * dpr;\n';
        html += '        canvas.style.width = rect.width + "px";\n';
        html += '        canvas.style.height = (rect.width / bgWidth * bgHeight) + "px";\n';
        html += '        ctx.scale(dpr, dpr);\n';
        html += '        render();\n';
        html += '    }\n';

        html += '    function render() {\n';
        html += '        const w = canvas.width / (window.devicePixelRatio || 1);\n';
        html += '        const h = canvas.height / (window.devicePixelRatio || 1);\n';
        html += '        ctx.clearRect(0, 0, w, h);\n';
        html += '        if (bgImage && bgImage.complete && bgImage.width > 0) {\n';
        html += '            const imgRatio = bgImage.width / bgImage.height;\n';
        html += '            const canvasRatio = w / h;\n';
        html += '            let drawW, drawH, dx, dy;\n';
        html += '            if (imgRatio > canvasRatio) { drawW = w; drawH = w / imgRatio; dx = 0; dy = (h - drawH) / 2; }\n';
        html += '            else { drawH = h; drawW = h * imgRatio; dx = (w - drawW) / 2; dy = 0; }\n';
        html += '            ctx.drawImage(bgImage, dx, dy, drawW, drawH);\n';
        html += '        }\n';
        html += '        renderLabels();\n';
        html += '    }\n';

        html += '    function generateAnswerFields() {\n';
        html += '        answerFields.innerHTML = "";\n';
        html += '        const sorted = labels.slice().sort((a, b) => a.number - b.number);\n';
        html += '        if (sorted.length === 0) { answerFields.innerHTML = \'<span class="empty-msg">Нет меток для заполнения.</span>\'; return; }\n';
        html += '        for (const label of sorted) {\n';
        html += '            const div = document.createElement("div");\n';
        html += '            div.className = "answer-field";\n';
        html += '            div.dataset.number = label.number;\n';
        html += '            div.innerHTML = `<span class="num">${label.number}.</span><input type="text" placeholder="Введите название..." data-number="${label.number}">`;\n';
        html += '            const input = div.querySelector("input");\n';
        html += '            input.addEventListener("input", updateProgress);\n';
        html += '            answerFields.appendChild(div);\n';
        html += '        }\n';
        html += '        updateProgress();\n';
        html += '    }\n';

        html += '    function updateProgress() {\n';
        html += '        const inputs = answerFields.querySelectorAll("input");\n';
        html += '        let filled = 0;\n';
        html += '        for (const input of inputs) { if (input.value.trim().length > 0) filled++; }\n';
        html += '        const total = inputs.length || 1;\n';
        html += '        progressFill.style.width = Math.min((filled / total) * 100, 100) + "%";\n';
        html += '    }\n';

        html += '    function checkAnswers() {\n';
        html += '        const inputs = answerFields.querySelectorAll("input");\n';
        html += '        let correct = 0;\n';
        html += '        let total = 0;\n';
        html += '        let allCorrect = true;\n';
        html += '        for (const input of inputs) {\n';
        html += '            const num = parseInt(input.dataset.number);\n';
        html += '            const userAnswer = input.value.trim();\n';
        html += '            const correctAnswer = matching[num] || "";\n';
        html += '            total++;\n';
        html += '            input.classList.remove("correct", "wrong");\n';
        html += '            if (userAnswer.length === 0) {\n';
        html += '                input.classList.add("wrong");\n';
        html += '                allCorrect = false;\n';
        html += '                continue;\n';
        html += '            }\n';
        html += '            if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {\n';
        html += '                input.classList.add("correct");\n';
        html += '                correct++;\n';
        html += '            } else {\n';
        html += '                input.classList.add("wrong");\n';
        html += '                allCorrect = false;\n';
        html += '            }\n';
        html += '        }\n';
        html += '        if (allCorrect && total > 0) {\n';
        html += '            resultMessage.innerHTML = "🎉 Отлично! Все ответы правильные!";\n';
        html += '            resultMessage.style.color = "#6B9E6B";\n';
        html += '        } else {\n';
        html += '            const wrongCount = total - correct;\n';
        html += '            resultMessage.innerHTML = "✅ Правильно: " + correct + " из " + total + ". Ошибок: " + wrongCount + ". Ошибки выделены красным.";\n';
        html += '            resultMessage.style.color = "#D4A373";\n';
        html += '        }\n';
        html += '    }\n';

        html += '    function clearAnswers() {\n';
        html += '        const inputs = answerFields.querySelectorAll("input");\n';
        html += '        for (const input of inputs) {\n';
        html += '            input.value = "";\n';
        html += '            input.classList.remove("correct", "wrong");\n';
        html += '        }\n';
        html += '        resultMessage.textContent = "";\n';
        html += '        updateProgress();\n';
        html += '    }\n';

        html += '    function startDrawing(e) { e.preventDefault(); const rect = canvas.getBoundingClientRect(); const touch = e.touches ? e.touches[0] : e; const dpr = window.devicePixelRatio || 1; const x = (touch.clientX - rect.left) * (canvas.width / dpr / rect.width); const y = (touch.clientY - rect.top) * (canvas.height / dpr / rect.height); isDrawing = true; lastX = x; lastY = y; drawDot(x, y); }\n';
        html += '    function drawMove(e) { if (!isDrawing) return; e.preventDefault(); const rect = canvas.getBoundingClientRect(); const touch = e.touches ? e.touches[0] : e; const dpr = window.devicePixelRatio || 1; const x = (touch.clientX - rect.left) * (canvas.width / dpr / rect.width); const y = (touch.clientY - rect.top) * (canvas.height / dpr / rect.height); drawLine(lastX, lastY, x, y); lastX = x; lastY = y; }\n';
        html += '    function stopDrawing(e) { isDrawing = false; }\n';
        html += '    function drawDot(x, y) { const size = parseInt(brushSize.value) || 8; ctx.fillStyle = brushColor.value; ctx.beginPath(); ctx.arc(x, y, size / 2, 0, Math.PI * 2); ctx.fill(); }\n';
        html += '    function drawLine(x1, y1, x2, y2) { const size = parseInt(brushSize.value) || 8; ctx.strokeStyle = brushColor.value; ctx.lineWidth = size; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }\n';
        html += '    function clearColors() { render(); showToast("🧹 Цвета очищены"); }\n';

        html += '    function showToast(msg) {\n';
        html += '        let toast = document.getElementById("toast");\n';
        html += '        if (!toast) {\n';
        html += '            toast = document.createElement("div");\n';
        html += '            toast.id = "toast";\n';
        html += '            toast.style.cssText = "position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1F4E6E; color:#fff; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; box-shadow:0 4px 16px rgba(0,0,0,0.15); opacity:0; transition:opacity 0.3s ease; z-index:1000; pointer-events:none; max-width:90%; text-align:center;";\n';
        html += '            document.body.appendChild(toast);\n';
        html += '            setTimeout(() => showToast(msg), 100);\n';
        html += '            return;\n';
        html += '        }\n';
        html += '        toast.textContent = msg;\n';
        html += '        toast.style.opacity = "1";\n';
        html += '        clearTimeout(toast._timer);\n';
        html += '        toast._timer = setTimeout(() => { toast.style.opacity = "0"; }, 3000);\n';
        html += '    }\n';

        html += '    bgImage = new Image();\n';
        html += '    bgImage.src = data.imageData;\n';
        html += '    bgImage.onload = () => { resizeCanvas(); };\n';
        html += '    bgImage.onerror = () => { resizeCanvas(); };\n';
        html += '    document.getElementById("checkBtn").addEventListener("click", checkAnswers);\n';
        html += '    document.getElementById("clearBtn").addEventListener("click", clearAnswers);\n';
        html += '    document.getElementById("clearColorsBtn").addEventListener("click", clearColors);\n';
        html += '    canvas.addEventListener("mousedown", startDrawing);\n';
        html += '    canvas.addEventListener("mousemove", drawMove);\n';
        html += '    canvas.addEventListener("mouseup", stopDrawing);\n';
        html += '    canvas.addEventListener("mouseleave", stopDrawing);\n';
        html += '    canvas.addEventListener("touchstart", startDrawing, { passive: false });\n';
        html += '    canvas.addEventListener("touchmove", drawMove, { passive: false });\n';
        html += '    canvas.addEventListener("touchend", stopDrawing);\n';
        html += '    canvas.addEventListener("touchcancel", stopDrawing);\n';
        html += '    generateAnswerFields();\n';
        html += '    window.addEventListener("resize", resizeCanvas);\n';
        html += '    setTimeout(resizeCanvas, 100);\n';
        html += '<\/script>\n';
        html += '</body>\n';
        html += '</html>';

        downloadFile(html, 'anatomia_trainer.html');

    function downloadFile(content, filename) {
        const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        URL.revokeObjectURL(link.href);
        showToast('📤 Файл экспортирован!');
    }

    // ================================================================
    //  СОХРАНЕНИЕ И ЗАГРУЗКА JSON
    // ================================================================

    function saveToJSON() {
        if (labels.length === 0) {
            showToast('Добавьте метки на изображение.');
            return;
        }
        if (Object.keys(matching).length === 0) {
            showToast('Добавьте соответствия для меток.');
            return;
        }
        if (!imageData) {
            showToast('Загрузите изображение.');
            return;
        }

        const data = {
            imageData: imageData,
            labels: labels,
            matching: matching,
            instruction: instructionText.value || '',
            bgWidth: bgWidth,
            bgHeight: bgHeight,
            nextLabelId: nextLabelId
        };

        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'anatomia_project.json';
        link.click();
        URL.revokeObjectURL(link.href);
        showToast('💾 Проект сохранён как JSON');
    }

    function loadFromJSON(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                imageData = data.imageData || null;
                labels = data.labels || [];
                matching = data.matching || {};
                instructionText.value = data.instruction || '';
                bgWidth = data.bgWidth || 800;
                bgHeight = data.bgHeight || 600;
                nextLabelId = data.nextLabelId || 1;

                if (imageData) {
                    bgImage = new Image();
                    bgImage.src = imageData;
                    bgImage.onload = () => {
                        bgWidth = bgImage.width || 800;
                        bgHeight = bgImage.height || 600;
                        render();
                        updateUI();
                        updateMatchingText();
                        saveToLocalStorage();
                        showToast('📂 Проект загружен!');
                    };
                } else {
                    render();
                    updateUI();
                    updateMatchingText();
                    saveToLocalStorage();
                    showToast('📂 Проект загружен!');
                }
            } catch (err) {
                showToast('❌ Ошибка загрузки: ' + err.message);
            }
        };
        reader.readAsText(file);
    }

    // ================================================================
    //  СОХРАНЕНИЕ В LOCALSTORAGE
    // ================================================================

    function saveToLocalStorage() {
        const data = {
            imageData: imageData,
            labels: labels,
            matching: matching,
            instruction: instructionText.value,
            nextLabelId: nextLabelId,
            bgWidth: bgWidth,
            bgHeight: bgHeight
        };
        try {
            localStorage.setItem('coloring_data', JSON.stringify(data));
        } catch (e) {}
    }

    function loadFromLocalStorage() {
        try {
            const raw = localStorage.getItem('coloring_data');
            if (!raw) return;
            const data = JSON.parse(raw);
            imageData = data.imageData || null;
            labels = data.labels || [];
            matching = data.matching || {};
            instructionText.value = data.instruction || '';
            nextLabelId = data.nextLabelId || 1;
            bgWidth = data.bgWidth || 800;
            bgHeight = data.bgHeight || 600;

            if (imageData) {
                bgImage = new Image();
                bgImage.src = imageData;
                bgImage.onload = () => {
                    bgWidth = bgImage.width || 800;
                    bgHeight = bgImage.height || 600;
                    render();
                };
            }
            updateMatchingText();
            updateUI();
            render();
        } catch (e) {}
    }

    // ================================================================
    //  ЗАГРУЗКА ПРИМЕРА
    // ================================================================

    function loadExample() {
        const canvasTemp = document.createElement('canvas');
        canvasTemp.width = 800;
        canvasTemp.height = 600;
        const ctxTemp = canvasTemp.getContext('2d');

        ctxTemp.fillStyle = '#FDF8F0';
        ctxTemp.fillRect(0, 0, 800, 600);

        ctxTemp.strokeStyle = '#3E5C4A';
        ctxTemp.lineWidth = 3;

        ctxTemp.beginPath();
        ctxTemp.arc(400, 250, 100, 0, Math.PI * 2);
        ctxTemp.stroke();

        ctxTemp.beginPath();
        ctxTemp.ellipse(400, 380, 140, 100, 0, 0, Math.PI * 2);
        ctxTemp.stroke();

        ctxTemp.beginPath();
        ctxTemp.ellipse(330, 180, 30, 50, -0.3, 0, Math.PI * 2);
        ctxTemp.stroke();

        ctxTemp.beginPath();
        ctxTemp.arc(370, 230, 12, 0, Math.PI * 2);
        ctxTemp.stroke();

        ctxTemp.beginPath();
        ctxTemp.arc(430, 270, 10, 0, Math.PI * 2);
        ctxTemp.stroke();

        const legs = [[280, 450, 280, 520], [340, 460, 340, 530], [460, 460, 460, 530], [520, 450, 520, 520]];
        for (const leg of legs) {
            ctxTemp.beginPath();
            ctxTemp.moveTo(leg[0], leg[1]);
            ctxTemp.lineTo(leg[2], leg[3]);
            ctxTemp.stroke();
        }

        ctxTemp.beginPath();
        ctxTemp.moveTo(540, 380);
        ctxTemp.quadraticCurveTo(580, 350, 560, 310);
        ctxTemp.stroke();

        const labelPositions = [
            { x: 400, y: 150, num: 1 },
            { x: 330, y: 130, num: 2 },
            { x: 370, y: 220, num: 3 },
            { x: 440, y: 270, num: 4 },
            { x: 540, y: 340, num: 5 },
            { x: 400, y: 490, num: 6 },
            { x: 300, y: 490, num: 7 },
            { x: 500, y: 490, num: 8 }
        ];

        for (const pos of labelPositions) {
            ctxTemp.fillStyle = '#D4A373';
            ctxTemp.font = 'bold 20px Montserrat, sans-serif';
            ctxTemp.textAlign = 'center';
            ctxTemp.textBaseline = 'middle';
            ctxTemp.fillText(pos.num, pos.x, pos.y);
        }

        const dataURL = canvasTemp.toDataURL('image/png');

        const img = new Image();
        img.onload = () => {
            bgImage = img;
            bgWidth = 800;
            bgHeight = 600;
            imageData = dataURL;
            labels = [];
            nextLabelId = 1;
            for (const pos of labelPositions) {
                labels.push({
                    id: nextLabelId++,
                    x: pos.x,
                    y: pos.y,
                    number: labels.length + 1
                });
            }
            matching = {
                1: 'Голова',
                2: 'Ухо',
                3: 'Глаз',
                4: 'Нос',
                5: 'Хвост',
                6: 'Туловище',
                7: 'Передняя конечность',
                8: 'Задняя конечность'
            };
            updateMatchingText();
            updateUI();
            render();
            saveToLocalStorage();
            showToast('📂 Пример загружен!');
        };
        img.src = dataURL;
    }

    // ================================================================
    //  НАСТРОЙКА СОБЫТИЙ
    // ================================================================

    function showToast(message, duration = 2500) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.style.cssText = 'position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1F4E6E; color: #fff; padding: 10px 24px; border-radius: 40px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 4px 16px rgba(0,0,0,0.15); opacity: 0; transition: opacity 0.3s ease; z-index: 1000; pointer-events: none; max-width: 90%; text-align: center;';
            document.body.appendChild(toast);
        }
        toast.textContent = message;
        toast.style.opacity = '1';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, duration);
    }

    function setupEventListeners() {
        imageInput.addEventListener('change', function() {
            if (this.files[0]) loadImage(this.files[0]);
            this.value = '';
        });

        document.getElementById('loadJsonBtn').addEventListener('click', () => jsonInput.click());

        jsonInput.addEventListener('change', function() {
            if (this.files[0]) loadFromJSON(this.files[0]);
            this.value = '';
        });

        document.getElementById('clearImageBtn').addEventListener('click', function() {
            if (!bgImage) return;
            if (!confirm('Удалить изображение?')) return;
            imageData = null;
            bgImage = null;
            labels = [];
            matching = {};
            nextLabelId = 1;
            render();
            updateUI();
            updateMatchingText();
            saveToLocalStorage();
            showToast('🗑️ Изображение удалено');
        });

        matchingInput.addEventListener('change', function() {
            if (this.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    loadMatchingFromText(e.target.result);
                };
                reader.readAsText(this.files[0]);
            }
            this.value = '';
        });

        document.getElementById('loadMatchingBtn').addEventListener('click', () => matchingInput.click());

        document.getElementById('fillMatchingBtn').addEventListener('click', () => {
            loadMatchingFromText(matchingText.value);
        });

        container.addEventListener('click', function(e) {
            if (e.target.closest('.label-marker')) return;
            const rect = container.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * bgWidth;
            const y = ((e.clientY - rect.top) / rect.height) * bgHeight;
            if (x >= 0 && x <= bgWidth && y >= 0 && y <= bgHeight) {
                addLabel(x, y);
            }
        });

        container.addEventListener('touchstart', function(e) {
            if (e.target.closest('.label-marker')) return;
            const touch = e.touches[0];
            const rect = container.getBoundingClientRect();
            const x = ((touch.clientX - rect.left) / rect.width) * bgWidth;
            const y = ((touch.clientY - rect.top) / rect.height) * bgHeight;
            if (x >= 0 && x <= bgWidth && y >= 0 && y <= bgHeight) {
                addLabel(x, y);
                e.preventDefault();
            }
        }, { passive: false });

        document.getElementById('saveBtn').addEventListener('click', saveToJSON);
        document.getElementById('exportTaskBtn').addEventListener('click', exportTask);

        document.getElementById('loadExampleBtn').addEventListener('click', function() {
            if (labels.length > 0 || imageData) {
                if (!confirm('Загрузить пример? Текущий проект будет заменён.')) return;
            }
            loadExample();
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            if (!confirm('Удалить все данные?')) return;
            labels = [];
            matching = {};
            imageData = null;
            bgImage = null;
            nextLabelId = 1;
            localStorage.removeItem('coloring_data');
            render();
            updateUI();
            updateMatchingText();
            showToast('🔄 Данные сброшены.');
        });

        window.addEventListener('beforeunload', saveToLocalStorage);
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeCanvas, 300);
        });
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
