        .header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; background: white; padding: 0.6rem 1.2rem; border-radius: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); flex-shrink: 0; }

        .side-panel h3 { font-size: 0.9rem; color: #3E5C4A; margin-bottom: 2px; }
        .panel-section { border-bottom: 1px solid #EDE8DC; padding-bottom: 10px; margin-bottom: 10px; }
        .panel-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .label-marker { position: absolute; transform: translate(-50%, -50%); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: 700; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.25); z-index: 10; pointer-events: auto; cursor: pointer; user-select: none; }
        .label-marker .label-type { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 8px; font-weight: 600; color: #fff; background: rgba(0,0,0,0.6); padding: 1px 6px; border-radius: 8px; white-space: nowrap; pointer-events: none; }

        .game-controls .player-info { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 0.85rem; padding: 4px 10px; border-radius: 1rem; background: #F4EFE4; transition: 0.3s; }

        .question-option.wrong { border-color: #D4A373; background: #FDE8E0; }

        .question-feedback { padding: 10px; border-radius: 1rem; margin-top: 8px; font-weight: 600; }
        .question-feedback.correct { background: #E2F0DA; color: #2C7DA0; }
        .question-feedback.wrong { background: #FDE8E0; color: #D4A373; }

    const labels = data.labels || [];
    const playersData = data.playersData || [{ name: 'Команда 1', icon: '🐕' }, { name: 'Команда 2', icon: '🐴' }];
    const bgWidth = data.bgWidth || 800;
    const bgHeight = data.bgHeight || 600;
    let bgImage = null;
    let players = [];
    let currentPlayer = 0;
    let gameStarted = false;
    let questionLocked = false;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');
    const modalOverlay = document.getElementById('questionModal');
    const qModalCloseBtn = document.getElementById('qModalCloseBtn');
    const qText = document.getElementById('qText');
    const qOptions = document.getElementById('qOptions');
    const qFeedback = document.getElementById('qFeedback');
    const qContinueBtn = document.getElementById('qContinueBtn');

    function initPlayers() {
        const startLabel = labels.find(function(l) { return l.type === 'start'; });
        const startPos = startLabel ? startLabel.number : 1;
        players = [];
        for (var i = 0; i < playersData.length; i++) {
            var pd = playersData[i];
            players.push({
                name: pd.name || 'Команда ' + (i+1),
                icon: pd.icon || '🐕',
                position: startPos,
                correct: 0,
                wrong: 0,
                finished: false
            });
        }
        currentPlayer = 0;
        gameStarted = true;
        updatePlayerInfo();
        updateProgress();
        render();
    }

    function resizeCanvas() {
        var rect = container.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) { setTimeout(resizeCanvas, 100); return; }
        var dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.scale(dpr, dpr);
        render();
    }

    function render() {
        var rect = container.getBoundingClientRect();
        var w = rect.width || 600;
        var h = rect.height || 400;
        ctx.clearRect(0, 0, w, h);

        if (bgImage && bgImage.complete && bgImage.width > 0) {
            var imgRatio = bgImage.width / bgImage.height;
            var canvasRatio = w / h;
            var drawW, drawH, dx, dy;
            if (imgRatio > canvasRatio) { drawW = w; drawH = w / imgRatio; dx = 0; dy = (h - drawH) / 2; }
            else { drawH = h; drawW = h * imgRatio; dx = (w - drawW) / 2; dy = 0; }
            ctx.drawImage(bgImage, dx, dy, drawW, drawH);
        }

        renderLabels(w, h);
        renderPieces(w, h);
    }

    function renderLabels(cw, ch) {
        container.querySelectorAll('.label-marker').forEach(function(el) { el.remove(); });
        for (var i = 0; i < labels.length; i++) {
            var label = labels[i];
            var x = (label.x / bgWidth) * cw;
            var y = (label.y / bgHeight) * ch;
            var marker = document.createElement('div');
            marker.className = 'label-marker';
            marker.style.left = x + 'px';
            marker.style.top = y + 'px';
            marker.style.background = label.color || '#2C7DA0';
            marker.textContent = label.number || '?';
            var typeLabel = document.createElement('span');
            typeLabel.className = 'label-type';
            var typeMap = { start: '🏁', normal: '⬜', question: '❓', trap: '⚠️', finish: '🏆' };
            typeLabel.textContent = typeMap[label.type] || '⬜';
            marker.appendChild(typeLabel);
            marker.addEventListener('click', function(e) {
                e.stopPropagation();
                if (gameStarted && !questionLocked) {
                    movePieceTo(parseInt(this.textContent));
                }
            });
            container.appendChild(marker);
        }
    }

    function renderPieces(cw, ch) {
        container.querySelectorAll('.piece-marker').forEach(function(el) { el.remove(); });
        for (var i = 0; i < players.length; i++) {
            var p = players[i];
            if (p.position === undefined) continue;
            var label = labels.find(function(l) { return l.number === p.position; });
            if (!label) continue;
            var offsetX = (i === 0 ? -14 : (i === 1 ? 14 : (i === 2 ? -14 : 14)));
            var offsetY = (i === 0 ? -14 : (i === 1 ? -14 : (i === 2 ? 14 : 14)));
            var x = (label.x / bgWidth) * cw + offsetX;
            var y = (label.y / bgHeight) * ch + offsetY;
            var piece = document.createElement('div');
            piece.className = 'piece-marker';
            piece.style.left = x + 'px';
            piece.style.top = y + 'px';
            piece.textContent = p.icon || '🐕';
            var nameEl = document.createElement('div');
            nameEl.className = 'piece-name';
            var isActive = (i === currentPlayer && !p.finished);
            nameEl.textContent = (isActive ? '🎯 ' : '') + p.name + (p.finished ? ' 🏆' : '');
            piece.appendChild(nameEl);
            container.appendChild(piece);
        }
    }

    function movePieceTo(labelNumber) {
        if (!gameStarted || questionLocked) return;
        if (players.length === 0) return;
        var player = players[currentPlayer];
        if (player.finished) { showToast('Этот игрок уже финишировал!'); return; }
        var targetLabel = labels.find(function(l) { return l.number === labelNumber; });
        if (!targetLabel) { showToast('❌ Клетка не найдена.'); return; }
        var isOccupied = players.some(function(p) { return p !== player && p.position === labelNumber; });
        if (isOccupied) { showToast('⚠️ Эта клетка занята другим игроком!'); return; }
        var diff = Math.abs(labelNumber - player.position);
        if (diff > 6) { showToast('🚫 Можно ходить не более чем на 6 клеток!'); return; }
        player.position = labelNumber;
        render();
        if (targetLabel.type === 'question') {
            showQuestion(player, targetLabel);
            return;
        } else if (targetLabel.type === 'trap') {
            var trapBack = Math.max(1, labelNumber - 2);
            player.position = trapBack;
            showToast('⚠️ Ловушка! ' + player.name + ' возвращается на 2 клетки назад.');
            render();
            nextPlayer();
        } else if (targetLabel.type === 'finish') {
            player.finished = true;
            showToast('🎉 ' + player.name + ' достиг финиша!');
            render();
            checkGameEnd();
        } else {
            nextPlayer();
        }
        updateProgress();
    }

    function showQuestion(player, label) {
        questionLocked = true;
        qText.textContent = label.question || 'Вопрос не задан';
        var options = label.options || ['', '', '', ''];
        qOptions.innerHTML = '';
        var optionLabels = ['А', 'Б', 'В', 'Г'];
        for (var i = 0; i < 4; i++) {
            var btn = document.createElement('button');
            btn.className = 'question-option';
            btn.textContent = optionLabels[i] + ': ' + (options[i] || '—');
            btn.dataset.index = i;
            btn.addEventListener('click', function() { handleAnswer(player, label, parseInt(this.dataset.index), this); });
            qOptions.appendChild(btn);
        }
        qFeedback.style.display = 'none';
        qContinueBtn.style.display = 'none';
        document.getElementById('qModalTitle').textContent = '❓ Вопрос для ' + player.name;
        modalOverlay.classList.add('active');
    }

    function handleAnswer(player, label, selectedIndex, btnEl) {
        if (questionLocked === false) return;
        var correct = label.correct || 0;
        var allBtns = qOptions.querySelectorAll('.question-option');
        allBtns.forEach(function(b) { b.classList.add('disabled'); });
        if (selectedIndex === correct) {
            btnEl.classList.add('correct');
            player.correct++;
            qFeedback.textContent = '✅ Правильно! Отлично!';
            qFeedback.className = 'question-feedback correct';
        } else {
            btnEl.classList.add('wrong');
            allBtns[correct].classList.add('correct');
            player.wrong++;
            qFeedback.textContent = '❌ Неправильно. Правильный ответ: ' + ['А', 'Б', 'В', 'Г'][correct];
            qFeedback.className = 'question-feedback wrong';
        }
        qFeedback.style.display = 'block';
        qContinueBtn.style.display = 'inline-block';
        questionLocked = false;
        updateProgress();
    }

    function continueAfterQuestion() {
        modalOverlay.classList.remove('active');
        questionLocked = false;
        if (!players[currentPlayer].finished) { nextPlayer(); }
        else { updatePlayerInfo(); checkGameEnd(); }
        render();
    }

    function nextPlayer() {
        var attempts = 0, next = (currentPlayer + 1) % players.length;
        while (players[next].finished && attempts < players.length) {
            next = (next + 1) % players.length;
            attempts++;
        }
        if (attempts < players.length) currentPlayer = next;
        updatePlayerInfo();
    }

    function checkGameEnd() {
        var allFinished = players.every(function(p) { return p.finished; });
        if (allFinished) {
            setTimeout(function() {
                var msg = '🏆 Игра завершена!\n\n';
                for (var i = 0; i < players.length; i++) {
                    var p = players[i];
                    msg += p.icon + ' ' + p.name + ': ✅ ' + p.correct + ' правильных, ❌ ' + p.wrong + ' неправильных\n';
                }
                alert(msg);
            }, 500);
        }
        updatePlayerInfo();
    }

    function updatePlayerInfo() {
        var info = document.getElementById('playerInfo');
        if (!info) return;
        info.innerHTML = '';
        for (var i = 0; i < players.length; i++) {
            var p = players[i];
            var active = (i === currentPlayer && !p.finished);
            var div = document.createElement('div');
            div.className = 'player-info' + (active ? ' active' : '');
            div.style.opacity = p.finished ? '0.5' : '1';
            div.innerHTML = '<span class="icon">' + p.icon + '</span><span>' + p.name + '</span><span style="font-size:0.7rem; color:#7B8D6E;">' + p.correct + '✅ ' + p.wrong + '❌</span>' + (active ? ' 🎯' : '') + (p.finished ? ' 🏆' : '');
            info.appendChild(div);
        }
    }

    function updateProgress() {
        var total = 0;
        for (var i = 0; i < labels.length; i++) { if (labels[i].type === 'question') total++; }
        var answered = 0;
        for (var j = 0; j < players.length; j++) { answered += players[j].correct; }
        var fill = document.getElementById('progressFill');
        var text = document.getElementById('progressText');
        if (fill) fill.style.width = (total > 0) ? ((answered / total) * 100) + '%' : '0%';
        if (text) text.textContent = answered + ' / ' + total;
    }

    function showToast(msg) {
        var toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.style.cssText = 'position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1F4E6E; color:#fff; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; box-shadow:0 4px 16px rgba(0,0,0,0.15); opacity:0; transition:opacity 0.3s ease; z-index:1000; pointer-events:none; max-width:90%; text-align:center;';
            document.body.appendChild(toast);
            setTimeout(function() { showToast(msg); }, 100);
            return;
        }
        toast.textContent = msg;
        toast.style.opacity = '1';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(function() { toast.style.opacity = '0'; }, 3000);
    }

    bgImage = new Image();
    bgImage.src = data.imageData;
    bgImage.onload = function() { resizeCanvas(); render(); };
    bgImage.onerror = function() { resizeCanvas(); };

    document.getElementById('rollBtn').addEventListener('click', function() {
        if (!gameStarted) { initPlayers(); return; }
        var allFinished = players.every(function(p) { return p.finished; });
        if (allFinished) { showToast('🏆 Игра завершена!'); return; }
        var attempts = 0;
        while (players[currentPlayer].finished && attempts < players.length) {
            currentPlayer = (currentPlayer + 1) % players.length;
            attempts++;
        }
        if (attempts >= players.length) { showToast('🏆 Все игроки финишировали!'); return; }
        var player = players[currentPlayer];
        var dice = Math.floor(Math.random() * 6) + 1;
        var diceEl = document.getElementById('diceDisplay');
        if (diceEl) {
            diceEl.textContent = '🎲';
            diceEl.classList.add('rolling');
            setTimeout(function() {
                diceEl.textContent = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'][dice - 1];
                diceEl.classList.remove('rolling');
            }, 900);
        }
        var newPos = player.position + dice;
        var maxNumber = labels.length;
        if (newPos >= maxNumber) {
            player.position = maxNumber;
            player.finished = true;
            showToast('🎉 ' + player.name + ' финишировал!');
            render();
            checkGameEnd();
            return;
        }
        movePieceTo(newPos);
    });

    document.getElementById('diceDisplay').addEventListener('click', function() {
        document.getElementById('rollBtn').click();
    });

    qModalCloseBtn.addEventListener('click', function() { modalOverlay.classList.remove('active'); });
    qContinueBtn.addEventListener('click', continueAfterQuestion);
    modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });

    initPlayers();
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
</script>
</body>
</html>
