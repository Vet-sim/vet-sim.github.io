<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Конструктор викторин | ВетСим</title>
    <style>
        /* ===== БАЗОВЫЙ СТИЛЬ ВЕТСИМ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: #F4F7F9;
            color: #2C3E2F;
            padding: 1.5rem;
            line-height: 1.5;
        }

        .main-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ===== ВКЛАДКИ ===== */
        .tabs {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: #E8EDE3;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 3rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: #4A6B4E;
            font-family: inherit;
        }
        .tab-btn.active {
            background: #7E9F6E;
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .tab-btn:hover:not(.active) {
            background: #D9E2CE;
        }

        .tab-pane {
            display: none;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            padding: 1.8rem;
            border: 1px solid #E7EDE2;
        }
        .tab-pane.active {
            display: block;
        }

        /* ===== РЕДАКТОР ===== */
        .editor-header {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #E2EAD9;
            align-items: center;
        }

        .editor-header .left-group {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .editor-header .right-group {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .btn {
            background: #EEF2E9;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 2.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            font-size: 0.85rem;
            color: #2C3E2F;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .btn-primary {
            background: #7E9F6E;
            color: white;
        }
        .btn-primary:hover {
            background: #6B8C5D;
        }
        .btn-outline {
            background: white;
            border: 1px solid #C0CFAF;
        }
        .btn-outline:hover {
            background: #F4F7F0;
        }
        .btn-danger {
            background: #F5D6D0;
            color: #A1442E;
        }
        .btn-danger:hover {
            background: #EEC4BC;
        }
        .btn-warning {
            background: #E2CFB0;
            color: #4D3E2A;
        }
        .btn-warning:hover {
            background: #D6C09B;
        }

        /* ===== КАРТОЧКА РЕДАКТОРА ===== */
        .question-editor-card {
            background: #FEFAF2;
            border-radius: 1.5rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.2rem;
            border: 1px solid #EDE3D4;
            transition: 0.2s;
        }
        .question-editor-card:hover {
            border-color: #C0CFAF;
        }

        .question-editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .question-editor-header h3 {
            font-size: 1rem;
            color: #4B6E43;
            font-weight: 600;
        }

        .field-group {
            margin-bottom: 0.7rem;
        }
        .field-group label {
            font-weight: 600;
            display: block;
            margin-bottom: 0.2rem;
            font-size: 0.8rem;
            color: #4A6B4E;
        }
        .field-group input,
        .field-group textarea,
        .field-group select {
            width: 100%;
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            border: 1px solid #D1DEC2;
            font-family: inherit;
            font-size: 0.9rem;
            background: #FEFCF9;
            transition: 0.2s;
        }
        .field-group textarea {
            border-radius: 1rem;
            resize: vertical;
            min-height: 60px;
        }
        .field-group input:focus,
        .field-group textarea:focus {
            outline: none;
            border-color: #7E9F6E;
            box-shadow: 0 0 0 2px rgba(126, 159, 110, 0.1);
        }

        .options-list {
            margin-top: 0.5rem;
            margin-left: 0.5rem;
        }
        .option-item {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
            align-items: center;
        }
        .option-item input {
            flex: 1;
        }
        .add-option {
            font-size: 0.75rem;
            margin-top: 0.3rem;
        }
        .inline-badge {
            background: #E2E9DA;
            padding: 0.1rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
        }

        /* ===== ТЕСТИРОВАНИЕ (стиль ВетСим) ===== */
        .quiz-container {
            background: white;
            border-radius: 1.8rem;
            overflow: hidden;
            border: 1px solid #E7EDE2;
        }
        .quiz-header {
            background: #EFF3E8;
            padding: 1.2rem 1.8rem;
            border-bottom: 1px solid #D9DECF;
        }
        .quiz-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1F4E6E;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .quiz-header h1 span {
            background: linear-gradient(135deg, #6B8C5C, #A38B60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .progress-section {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.3rem;
        }
        .progress-text {
            font-size: 0.8rem;
            background: #E2E9DA;
            padding: 0.15rem 0.8rem;
            border-radius: 2rem;
            font-weight: 500;
            color: #3E5C4A;
        }
        .progress-bar-bg {
            flex: 1;
            height: 6px;
            background: #DADFCF;
            border-radius: 1rem;
            min-width: 80px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #7E9F6E;
            border-radius: 1rem;
            transition: width 0.3s;
        }

        .case-card {
            padding: 1.5rem 1.8rem;
        }
        .case-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            color: #4B6E43;
            border-left: 4px solid #9BBB8A;
            padding-left: 1rem;
        }
        .symptom-text {
            background: #FEFAF2;
            padding: 1rem 1.2rem;
            border-radius: 1.2rem;
            margin-bottom: 1rem;
            border: 1px solid #EDE3D4;
            font-size: 0.95rem;
        }
        .image-placeholder {
            color: #8F9B82;
            padding: 0.5rem 0;
            font-style: italic;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin: 1rem 0;
        }
        .option-btn {
            background: #EEF2E9;
            border: 1px solid #DBDFCF;
            text-align: left;
            padding: 0.6rem 1.2rem;
            border-radius: 2.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            color: #2C3E2F;
            font-family: inherit;
        }
        .option-btn:hover:not(:disabled) {
            background: #E2EAD9;
            border-color: #BCCFAA;
        }
        .option-btn.correct {
            background: #4CAF50 !important;
            color: white;
            border-color: #4CAF50;
        }
        .option-btn.wrong {
            background: #F44336 !important;
            color: white;
            border-color: #F44336;
        }
        .option-btn:disabled {
            cursor: default;
            opacity: 0.8;
        }

        .feedback-area {
            background: #F4F1EA;
            border-left: 5px solid #9BBB8A;
            padding: 1rem 1.2rem;
            border-radius: 1.2rem;
            margin: 1rem 0;
            display: none;
        }
        .feedback-area .verdict {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }
        .feedback-area .system-badge {
            background: #D9E3CE;
            display: inline-block;
            padding: 0.15rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            margin-top: 0.5rem;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .next-btn {
            background: #CFDEC2;
            padding: 0.5rem 1.8rem;
            border-radius: 2.5rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
            transition: 0.2s;
            color: #4A6B4E;
        }
        .next-btn.active {
            background: #7E9F6E;
            color: white;
        }
        .next-btn.active:hover {
            background: #6B8C5D;
        }
        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .restart-btn {
            background: #E2CFB0;
            padding: 0.5rem 1.8rem;
            border-radius: 2.5rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: inherit;
            transition: 0.2s;
            color: #4D3E2A;
            display: none;
        }
        .restart-btn:hover {
            background: #D6C09B;
        }

        /* ===== ПОДВАЛ ===== */
        .footer {
            background: #F9F6EF;
            text-align: center;
            font-size: 0.7rem;
            padding: 0.6rem;
            color: #9AA98B;
            border-top: 1px solid #E2EAD9;
            margin-top: 0.5rem;
        }
        .footer a {
            color: #568A6B;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 640px) {
            .tab-pane { padding: 1rem; }
            .editor-header { flex-direction: column; align-items: stretch; }
            .editor-header .left-group,
            .editor-header .right-group { justify-content: center; }
            .case-card { padding: 1rem; }
            .quiz-header { padding: 0.8rem 1rem; }
            .quiz-header h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
<div class="main-container">

    <!-- ===== ВКЛАДКИ ===== -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="editor">✏️ Редактор</button>
        <button class="tab-btn" data-tab="test">🎓 Тестирование</button>
    </div>

    <!-- ===== РЕДАКТОР ===== -->
    <div id="editorPane" class="tab-pane active">
        <div class="editor-header">
            <div class="left-group">
                <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                    <label style="font-weight:600; font-size:0.85rem; color:#4A6B4E;">📌 Название тренажёра:</label>
                    <input type="text" id="quizTitleInput" value="Ветеринарная диагностика: «Что не так?»" style="flex:1; min-width:200px; padding:0.4rem 0.8rem; border-radius:2rem; border:1px solid #D1DEC2; font-family:inherit; font-size:0.9rem; background:#FEFCF9;">
                </div>
            </div>
            <div class="right-group">
                <button id="addQuestionBtn" class="btn btn-primary">➕ Добавить вопрос</button>
                <button id="saveJsonBtn" class="btn btn-outline">💾 Сохранить JSON</button>
                <button id="loadJsonBtn" class="btn btn-outline">📂 Загрузить JSON</button>
                <button id="exportHtmlBtn" class="btn btn-primary">📤 Экспорт в тренажёр</button>
            </div>
        </div>
        <div id="questionsEditorList"></div>
    </div>

    <!-- ===== ТЕСТИРОВАНИЕ ===== -->
    <div id="testPane" class="tab-pane">
        <div class="quiz-container">
            <div class="quiz-header">
                <h1>🐄 <span id="testTitleDisplay">Ветеринарная диагностика: «Что не так?»</span></h1>
                <div class="progress-section">
                    <span class="progress-text" id="progressCounterTest">Случай 1 из 10</span>
                    <div class="progress-bar-bg"><div class="progress-fill" id="progressFillTest"></div></div>
                </div>
            </div>
            <div class="case-card">
                <div class="case-title" id="caseTitleTest">Случай 1</div>
                <div class="symptom-text" id="questionTextTest"></div>
                <div id="imageContainerTest" style="margin-bottom:0.5rem;"></div>
                <div class="options-grid" id="optionsContainerTest"></div>
                <div id="feedbackAreaTest" class="feedback-area"></div>
                <div class="nav-buttons">
                    <button id="nextBtnTest" class="next-btn" disabled>➡ Следующий случай</button>
                    <button id="restartBtnTest" class="restart-btn">🔄 Начать сначала</button>
                </div>
            </div>
            <div class="footer">
                © Преподаватель - Тераевич Алла Сергеевна, 2026. Лицензия <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>
            </div>
        </div>
    </div>
</div>

<script>
    // ================================================================
    //  ДАННЫЕ: 10 КЛИНИЧЕСКИХ СЛУЧАЕВ ПО КРС (по умолчанию)
    // ================================================================
    let questions = [
        { id: 1, text: "У коровы отсутствие жвачки, отрыжка с гнилостным запахом, метеоризм рубца, температура в норме, аппетит отсутствует.", options: ["Тимпания рубца", "Травматический ретикулит", "Кетоз", "Ацидоз"], correct: 0, explanation: "Тимпания рубца – острое вздутие рубца из-за скопления газов.", system: "Пищеварительная система", image: "" },
        { id: 2, text: "Кашель, носовые истечения гнойного характера, температура 41°C, при аускультации — влажные хрипы в краниальных долях лёгких.", options: ["Бронхопневмония", "Туберкулёз", "Диктиокаулёз", "Эмфизема лёгких"], correct: 0, explanation: "Бронхопневмония – воспаление бронхов и лёгких с гнойным экссудатом.", system: "Дыхательная система", image: "" },
        { id: 3, text: "Корова на 7-м месяце стельности, внезапное беспокойство, истечение крови из влагалища, шейка матки открыта.", options: ["Аборт", "Вагинит", "Эндометрит", "Задержание последа"], correct: 0, explanation: "Аборт – прерывание беременности.", system: "Репродуктивная система", image: "" },
        { id: 4, text: "Хромота на тазовую конечность, припухлость в области заплюсневого сустава, болезненность, температура местно повышена.", options: ["Артрит", "Тендинит", "Перелом", "Рана"], correct: 0, explanation: "Артрит – воспаление сустава.", system: "Опорно-двигательная система", image: "" },
        { id: 5, text: "Уменьшение количества мочи, моча тёмно-красного цвета, отёки на нижней челюсти и в подгрудке, белок в моче.", options: ["Пиелонефрит", "Гломерулонефрит", "Цистит", "Мочекаменная болезнь"], correct: 1, explanation: "Гломерулонефрит – поражение клубочков почек.", system: "Мочевыделительная система", image: "" },
        { id: 6, text: "Снижение аппетита, потеря веса, запах ацетона изо рта, снижение удоя, нервные явления.", options: ["Кетоз", "Остеомаляция", "Гипомагниемия", "Авитаминоз А"], correct: 0, explanation: "Кетоз – накопление кетоновых тел.", system: "Обмен веществ", image: "" },
        { id: 7, text: "Отёк в области подгрудка и межчелюстного пространства, набухание яремных вен, пульс слабый, одышка.", options: ["Перикардит", "Эндокардит", "Миокардит", "Анемия"], correct: 0, explanation: "Перикардит – воспаление сердечной сумки.", system: "Сердечно-сосудистая система", image: "" },
        { id: 8, text: "На коже вымени красные узелки, превращаются в пустулы и корки, снижение удоя, болезненность.", options: ["Оспа коров", "Дерматофилёз", "Чесотка", "Гиподерматоз"], correct: 0, explanation: "Оспа коров – вирусная болезнь.", system: "Кожный покров", image: "" },
        { id: 9, text: "Неустойчивая походка, тремор мышц, беспокойство, затем угнетение, повышение температуры, скрежет зубами.", options: ["Бешенство", "Листериоз", "Ботулизм", "Энцефалит"], correct: 1, explanation: "Листериоз – поражение ЦНС.", system: "Нервная система", image: "" },
        { id: 10, text: "Помутнение роговицы, слезотечение, светобоязнь, корова трёт глаз о предметы.", options: ["Кератит", "Конъюнктивит", "Катаракта", "Увеит"], correct: 0, explanation: "Кератит – воспаление роговицы.", system: "Зрительная система", image: "" }
    ];

    let currentTestIndex = 0;
    let testAnswered = false;
    let currentTestQuestions = [];

    // DOM элементы
    const editorContainer = document.getElementById('questionsEditorList');
    const quizTitleInput = document.getElementById('quizTitleInput');
    const testTitleDisplay = document.getElementById('testTitleDisplay');

    const caseTitleTest = document.getElementById('caseTitleTest');
    const questionTextTest = document.getElementById('questionTextTest');
    const optionsContainerTest = document.getElementById('optionsContainerTest');
    const feedbackAreaTest = document.getElementById('feedbackAreaTest');
    const nextBtnTest = document.getElementById('nextBtnTest');
    const restartBtnTest = document.getElementById('restartBtnTest');
    const progressCounterTest = document.getElementById('progressCounterTest');
    const progressFillTest = document.getElementById('progressFillTest');
    const imageContainerTest = document.getElementById('imageContainerTest');

    // ================================================================
    //  РЕДАКТОР
    // ================================================================
    function renderEditor() {
        editorContainer.innerHTML = '';
        questions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-editor-card';
            card.innerHTML = `
                <div class="question-editor-header">
                    <h3>Вопрос ${idx+1}</h3>
                    <button class="btn btn-danger delete-q" data-idx="${idx}" style="font-size:0.7rem; padding:0.2rem 0.8rem;">🗑️ Удалить</button>
                </div>
                <div class="field-group"><label>Текст вопроса</label><textarea class="q-text" data-idx="${idx}" rows="2">${escapeHtml(q.text)}</textarea></div>
                <div class="field-group"><label>Изображение (URL, опционально)</label><input class="q-image" data-idx="${idx}" value="${escapeHtml(q.image || '')}" placeholder="https://..."></div>
                <div class="field-group"><label>Варианты ответов</label><div id="options-editor-${idx}"></div><button class="btn add-option" data-idx="${idx}" style="font-size:0.7rem; margin-top:0.3rem;">➕ Добавить вариант</button></div>
                <div class="field-group"><label>Правильный ответ (индекс, начиная с 0)</label><input class="q-correct" data-idx="${idx}" type="number" value="${q.correct}" min="0"></div>
                <div class="field-group"><label>Пояснение</label><textarea class="q-explanation" data-idx="${idx}" rows="2">${escapeHtml(q.explanation)}</textarea></div>
                <div class="field-group"><label>Система органов</label><input class="q-system" data-idx="${idx}" value="${escapeHtml(q.system)}"></div>
            `;
            editorContainer.appendChild(card);

            // варианты
            const optionsDiv = document.getElementById(`options-editor-${idx}`);
            if (optionsDiv) {
                q.options.forEach((opt, optIdx) => {
                    const optRow = document.createElement('div');
                    optRow.className = 'option-item';
                    optRow.innerHTML = `<input type="text" class="q-option" data-idx="${idx}" data-optidx="${optIdx}" value="${escapeHtml(opt)}"><button class="btn remove-option" data-idx="${idx}" data-optidx="${optIdx}" style="font-size:0.7rem; padding:0.1rem 0.5rem; background:#F5D6D0; border:none; border-radius:2rem; cursor:pointer;">✖</button>`;
                    optionsDiv.appendChild(optRow);
                });
            }
        });
        attachEditorEvents();
        updateTestTitle();
    }

    function attachEditorEvents() {
        document.querySelectorAll('.q-text').forEach(el => el.addEventListener('change', e => { let idx = el.dataset.idx; questions[idx].text = el.value; }));
        document.querySelectorAll('.q-image').forEach(el => el.addEventListener('change', e => { let idx = el.dataset.idx; questions[idx].image = el.value; }));
        document.querySelectorAll('.q-correct').forEach(el => el.addEventListener('change', e => { let idx = el.dataset.idx; questions[idx].correct = parseInt(el.value); }));
        document.querySelectorAll('.q-explanation').forEach(el => el.addEventListener('change', e => { let idx = el.dataset.idx; questions[idx].explanation = el.value; }));
        document.querySelectorAll('.q-system').forEach(el => el.addEventListener('change', e => { let idx = el.dataset.idx; questions[idx].system = el.value; }));

        document.querySelectorAll('.q-option').forEach(el => el.addEventListener('change', e => { let idx = el.dataset.idx; let optidx = el.dataset.optidx; questions[idx].options[optidx] = el.value; }));
        document.querySelectorAll('.remove-option').forEach(btn => btn.addEventListener('click', e => { let idx = btn.dataset.idx; let optidx = btn.dataset.optidx; questions[idx].options.splice(optidx, 1); renderEditor(); }));
        document.querySelectorAll('.add-option').forEach(btn => btn.addEventListener('click', e => { let idx = btn.dataset.idx; questions[idx].options.push('новый вариант'); renderEditor(); }));
        document.querySelectorAll('.delete-q').forEach(btn => btn.addEventListener('click', e => { let idx = parseInt(btn.dataset.idx); questions.splice(idx, 1); renderEditor(); refreshTestDisplay(); }));
    }

    function updateTestTitle() {
        const title = quizTitleInput.value.trim() || 'Ветеринарная диагностика';
        testTitleDisplay.textContent = title;
    }

    // ================================================================
    //  ТЕСТИРОВАНИЕ
    // ================================================================
    function refreshTestDisplay() {
        if (questions.length === 0) {
            caseTitleTest.innerText = 'Нет вопросов';
            questionTextTest.innerText = 'Сначала добавьте вопросы в редакторе.';
            optionsContainerTest.innerHTML = '';
            nextBtnTest.disabled = true;
            return;
        }
        currentTestQuestions = questions;
        currentTestIndex = 0;
        testAnswered = false;
        renderTestQuestion(0);
        updateTestProgress();
        nextBtnTest.disabled = true;
        nextBtnTest.classList.remove('active');
        restartBtnTest.style.display = 'none';
        feedbackAreaTest.style.display = 'none';
        updateTestTitle();
    }

    function renderTestQuestion(index) {
        if (!currentTestQuestions[index]) return;
        const q = currentTestQuestions[index];
        caseTitleTest.innerText = `Случай ${index+1} из ${currentTestQuestions.length}`;
        questionTextTest.innerText = q.text;

        // изображение
        imageContainerTest.innerHTML = '';
        if (q.image && q.image.trim()) {
            const img = document.createElement('img');
            img.src = q.image;
            img.style.maxWidth = '100%';
            img.style.borderRadius = '1rem';
            img.style.maxHeight = '180px';
            img.style.border = '1px solid #E2EAD9';
            imageContainerTest.appendChild(img);
        } else {
            imageContainerTest.innerHTML = '<div class="image-placeholder">📷 Изображение не загружено</div>';
        }

        optionsContainerTest.innerHTML = '';
        q.options.forEach((opt, optIdx) => {
            const btn = document.createElement('button');
            btn.textContent = `${String.fromCharCode(65+optIdx)}. ${opt}`;
            btn.classList.add('option-btn');
            btn.dataset.optIndex = optIdx;
            btn.addEventListener('click', () => handleTestAnswer(optIdx, btn));
            optionsContainerTest.appendChild(btn);
        });

        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('correct', 'wrong'));
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
        testAnswered = false;
        nextBtnTest.disabled = true;
        nextBtnTest.classList.remove('active');
        feedbackAreaTest.style.display = 'none';
        updateTestTitle();
    }

    function handleTestAnswer(selectedIdx, clickedBtn) {
        if (testAnswered) return;
        const q = currentTestQuestions[currentTestIndex];
        const isCorrect = (selectedIdx === q.correct);
        testAnswered = true;

        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);
        const correctBtn = allBtns[q.correct];
        if (correctBtn) correctBtn.classList.add('correct');
        if (!isCorrect) clickedBtn.classList.add('wrong');
        else clickedBtn.classList.add('correct');

        const verdict = isCorrect ? '✅ Верно!' : '❌ Неверно!';
        feedbackAreaTest.innerHTML = `
            <div class="verdict">${verdict}</div>
            <div><strong>Правильный диагноз:</strong> ${q.options[q.correct]}</div>
            <div>📖 ${q.explanation}</div>
            <div class="system-badge">🧬 Система: ${q.system}</div>
        `;
        feedbackAreaTest.style.display = 'block';

        nextBtnTest.disabled = false;
        nextBtnTest.classList.add('active');
        if (currentTestIndex === currentTestQuestions.length - 1) {
            nextBtnTest.innerText = '🏁 Завершить';
        } else {
            nextBtnTest.innerText = '➡ Следующий случай';
        }
    }

    function nextTestQuestion() {
        if (!testAnswered) return;
        if (currentTestIndex + 1 < currentTestQuestions.length) {
            currentTestIndex++;
            testAnswered = false;
            renderTestQuestion(currentTestIndex);
            updateTestProgress();
        } else {
            alert('🎉 Поздравляем! Вы прошли всю викторину! 🎉\nМожете начать сначала.');
            restartTestQuiz();
        }
    }

    function restartTestQuiz() {
        currentTestIndex = 0;
        testAnswered = false;
        renderTestQuestion(0);
        updateTestProgress();
        nextBtnTest.disabled = true;
        nextBtnTest.classList.remove('active');
        restartBtnTest.style.display = 'none';
    }

    function updateTestProgress() {
        const total = currentTestQuestions.length;
        const percent = ((currentTestIndex+1)/total)*100;
        progressFillTest.style.width = `${percent}%`;
        progressCounterTest.innerText = `Случай ${currentTestIndex+1} из ${total}`;
    }

    // ================================================================
    //  JSON / ЭКСПОРТ HTML С НАЗВАНИЕМ
    // ================================================================
    function saveToJson() {
        const dataStr = JSON.stringify(questions, null, 2);
        const blob = new Blob([dataStr], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'vetsim_quiz.json';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function loadFromJson(file) {
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const newData = JSON.parse(e.target.result);
                if (Array.isArray(newData)) {
                    questions = newData;
                    renderEditor();
                    refreshTestDisplay();
                } else alert('Неверный формат JSON');
            } catch(err) { alert('Ошибка чтения файла'); }
        };
        reader.readAsText(file);
    }

    function exportStandaloneHtml() {
        const title = quizTitleInput.value.trim() || 'Ветеринарная диагностика';
        const qData = JSON.stringify(questions);

        const standaloneHtml = `<!DOCTYPE html>
        <html lang="ru">
        <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>${escapeHtml(title)} | ВетСим</title>
        <style>${document.querySelector('style').innerHTML}</style>
        </head>
        <body><div class="main-container"><div class="quiz-container"><div class="quiz-header"><h1>🐄 <span>${escapeHtml(title)}</span></h1><div class="progress-section"><span class="progress-text" id="progressCounter">Случай 1 из ...</span><div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div></div></div><div class="case-card"><div class="case-title" id="caseTitle">Случай 1</div><div class="symptom-text" id="questionText"></div><div id="imageContainer"></div><div class="options-grid" id="optionsContainer"></div><div id="feedbackArea" class="feedback-area"></div><div class="nav-buttons"><button id="nextBtn" class="next-btn" disabled>➡ Следующий случай</button><button id="restartBtn" class="restart-btn">🔄 Начать сначала</button></div></div><div class="footer">© Тераевич Алла Сергеевна, 2026. Лицензия <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a></div></div></div>
        <script>
            const quizData = ${qData};
            const total = quizData.length;
            let currentIndex = 0, answered = false;
            const caseTitle = document.getElementById('caseTitle');
            const questionText = document.getElementById('questionText');
            const optionsContainer = document.getElementById('optionsContainer');
            const feedbackArea = document.getElementById('feedbackArea');
            const nextBtn = document.getElementById('nextBtn');
            const restartBtn = document.getElementById('restartBtn');
            const progressCounter = document.getElementById('progressCounter');
            const progressFill = document.getElementById('progressFill');
            const imageContainer = document.getElementById('imageContainer');

            function updateProgress() {
                const percent = ((currentIndex+1)/total)*100;
                progressFill.style.width = percent+'%';
                progressCounter.innerText = 'Случай '+(currentIndex+1)+' из '+total;
            }
            function renderCase() {
                const q = quizData[currentIndex];
                caseTitle.innerText = 'Случай '+(currentIndex+1);
                questionText.innerText = q.text;
                imageContainer.innerHTML = q.image ? '<img src="'+q.image+'" style="max-width:100%; border-radius:1rem; max-height:180px; border:1px solid #E2EAD9;">' : '<div class="image-placeholder">📷 Изображение не загружено</div>';
                optionsContainer.innerHTML = '';
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.textContent = String.fromCharCode(65+idx)+'. '+opt;
                    btn.classList.add('option-btn');
                    btn.onclick = () => handleAnswer(idx, btn);
                    optionsContainer.appendChild(btn);
                });
                document.querySelectorAll('.option-btn').forEach(b=>{b.classList.remove('correct','wrong'); b.disabled=false;});
                answered = false;
                nextBtn.disabled = true;
                nextBtn.classList.remove('active');
                feedbackArea.style.display = 'none';
                updateProgress();
            }
            function handleAnswer(selectedIdx, btn) {
                if(answered) return;
                const q = quizData[currentIndex];
                const isCorrect = (selectedIdx === q.correct);
                answered = true;
                const allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(b=>b.disabled=true);
                allBtns[q.correct].classList.add('correct');
                if(!isCorrect) btn.classList.add('wrong'); else btn.classList.add('correct');
                feedbackArea.innerHTML = '<div class="verdict">'+(isCorrect?'✅ Верно!':'❌ Неверно!')+'</div><div><strong>Правильный диагноз:</strong> '+q.options[q.correct]+'</div><div>📖 '+q.explanation+'</div><div class="system-badge">🧬 Система: '+q.system+'</div>';
                feedbackArea.style.display = 'block';
                nextBtn.disabled = false;
                nextBtn.classList.add('active');
                if(currentIndex+1 === total) nextBtn.innerText = '🏁 Завершить';
                else nextBtn.innerText = '➡ Следующий случай';
            }
            function nextCase() {
                if(!answered) return;
                if(currentIndex+1 < total) { currentIndex++; renderCase(); }
                else { alert('🎉 Викторина завершена! 🎉\\nНажмите "Начать сначала"'); }
            }
            function restartQuiz() { currentIndex=0; renderCase(); nextBtn.disabled=true; nextBtn.classList.remove('active'); restartBtn.style.display='none'; }
            nextBtn.onclick = nextCase;
            restartBtn.onclick = () => { currentIndex=0; renderCase(); restartBtn.style.display='none'; };
            renderCase();
        <\/script>
        </body>
        </html>`;

        const blob = new Blob([standaloneHtml], {type: 'text/html'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'vetsim_quiz_standalone.html';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

    // ================================================================
    //  СОБЫТИЯ
    // ================================================================
    document.getElementById('addQuestionBtn').onclick = () => {
        questions.push({ id: Date.now(), text: 'Новый вопрос', options: ['Вариант A', 'Вариант B'], correct: 0, explanation: 'Пояснение', system: 'Система', image: '' });
        renderEditor();
        refreshTestDisplay();
    };
    document.getElementById('saveJsonBtn').onclick = saveToJson;
    document.getElementById('loadJsonBtn').onclick = () => {
        const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
        inp.onchange = e => loadFromJson(inp.files[0]);
        inp.click();
    };
    document.getElementById('exportHtmlBtn').onclick = exportStandaloneHtml;

    quizTitleInput.addEventListener('input', () => {
        updateTestTitle();
    });

    nextBtnTest.onclick = nextTestQuestion;
    restartBtnTest.onclick = () => { currentTestIndex=0; testAnswered=false; renderTestQuestion(0); updateTestProgress(); nextBtnTest.disabled=true; restartBtnTest.style.display='none'; };

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
            document.getElementById(btn.dataset.tab + 'Pane').classList.add('active');
            if (btn.dataset.tab === 'test') refreshTestDisplay();
        });
    });

    // ================================================================
    //  СТАРТ
    // ================================================================
    renderEditor();
    refreshTestDisplay();
</script>
</body>
</html>
