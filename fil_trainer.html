<!DOCTYPE html>

<head>

    <title>Генератор филвордов (венгерских кроссвордов) | VetSim</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #FDF8F0;

<body>
<div class="main-container">
    <h1>🧩 Генератор филвордов</h1>
    <div class="sub">Венгерский кроссворд — слова могут изгибаться под 90°</div>

    <div class="toolbar">
        <label class="file-label">📂 Загрузить слова (txt)<input type="file" id="wordsFile" accept=".txt" style="display:none"></label>
        <select id="gridShapeSelect">
            <option value="rect">Прямоугольник 12x12</option>
            <option value="romb">Ромб 13x13</option>
            <option value="circle">Круг 13x13</option>
        </select>
        <button id="autoPlaceBtn" class="btn btn-primary">🤖 Авторасстановка</button>
        <button id="exportBtn" class="btn btn-accent">📥 Экспорт</button>
        <button id="resetBtn" class="btn btn-danger">🗑️ Очистить</button>
        <button id="checkAllBtn" class="btn btn-success">✅ Проверить всё</button>
        <button id="resetProgressBtn" class="btn btn-warning">🔄 Сбросить прогресс</button>
    </div>

    <div class="workspace">
        <div class="canvas-area">
            <canvas id="wordCanvas" width="500" height="500" style="width:100%; height:auto; background:#FDF8F0; border-radius:16px"></canvas>
        </div>
        <div class="side-panel">
            <div class="progress-row">
                <span>📊 Прогресс</span>
                <span class="found-count" id="progressCounter">Найдено: 0 из 0</span>
            </div>
            <div style="margin-top:0.8rem;"><strong>📖 Список слов</strong> <span id="statsWords"></span></div>
            <div id="wordListContainer" class="word-list"></div>
            <div style="display:flex; gap:8px; margin-top:0.6rem;">
                <input type="text" id="newWordInput" placeholder="Новое слово" style="flex:1;">
                <button id="addWordBtn" class="btn">➕</button>
            </div>
            <div class="info-msg" style="font-size:0.7rem; margin-top:0.8rem; background:#F4EFE4; padding:8px; border-radius:1rem;">
                💡 Кликните по слову в списке — подсветится его путь на сетке.
                <br>Найденные слова отмечаются зелёным ✅.
            </div>
        </div>
    </div>
    <footer>© VetSim, 2026. CC BY-NC. Генератор филвордов для образовательных целей.</footer>
</div>

<script>
    // ================================================================
    // ФИЛВОРД — ЯДРО
    // ================================================================
    let currentShape = 'rect';
    let gridSize = 12;
    let grid = [];
    let letters = [];
    let words = [];              // { text, placed, path: [{row,col}] }
    let termList = [];
    let cellSize = 40;
    const canvas = document.getElementById('wordCanvas');
    const ctx = canvas.getContext('2d');

    // ================================================================
    // НОВЫЕ СОСТОЯНИЯ ДЛЯ ИНТЕРАКТИВА
    // ================================================================
    // wordStates[word] = { found: bool, highlighted: bool }
    let wordStates = {};
    let selectedWord = null;        // слово, которое сейчас подсвечено (для unfound)

    // ================================================================
    // ФОРМЫ СЕТКИ
    // ================================================================
    function generateRectMask(size) {
        return Array(size).fill().map(() => Array(size).fill(true));
    }
    function generateRombMask(size) {
        const mask = Array(size).fill().map(() => Array(size).fill(false));
        const center = Math.floor(size/2);
        for(let i=0; i<size; i++){
            const offset = Math.abs(i-center);
            const start = offset;
            const end = size-1-offset;
            for(let j=start; j<=end; j++) mask[i][j]=true;
        }
        return mask;
    }
    function generateCircleMask(size) {
        const mask = Array(size).fill().map(() => Array(size).fill(false));
        const center = Math.floor(size/2);
        const radius = Math.floor(size/2) - 1;
        for(let i=0; i<size; i++){
            for(let j=0; j<size; j++){
                const dx = i-center, dy = j-center;
                if(dx*dx + dy*dy <= radius*radius) mask[i][j]=true;
            }
        }
        return mask;
    }

    // ================================================================
    // ЗАГРУЗКА ФОРМЫ
    // ================================================================
    function loadShape(shape) {
        currentShape = shape;
        if(shape === 'rect')   { gridSize=12; grid = generateRectMask(12); }
        else if(shape === 'romb')  { gridSize=13; grid = generateRombMask(13); }
        else if(shape === 'circle'){ gridSize=13; grid = generateCircleMask(13); }
        letters = Array(gridSize).fill().map(() => Array(gridSize).fill(''));
        words = [];
        wordStates = {};
        selectedWord = null;
        drawGrid();
        updateWordListUI();
        updateProgress();
    }

    // ================================================================
    // ОТРИСОВКА СЕТКИ + ПОДСВЕТКА
    // ================================================================
    function drawGrid() {
        canvas.width = gridSize * cellSize;
        canvas.height = gridSize * cellSize;
        ctx.clearRect(0,0,canvas.width,canvas.height);

        // 1. Базовые клетки
        for(let i=0; i<gridSize; i++){
            for(let j=0; j<gridSize; j++){
                const x = j*cellSize, y = i*cellSize;
                if(grid[i][j]){
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(x,y,cellSize,cellSize);
                    ctx.strokeStyle = "#D4CDB5";
                    ctx.strokeRect(x,y,cellSize,cellSize);
                    if(letters[i][j]){
                        ctx.fillStyle = "#3E5C4A";
                        ctx.font = `bold ${Math.floor(cellSize*0.5)}px system-ui`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(letters[i][j], x+cellSize/2, y+cellSize/2);
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'alphabetic';
                    }
                } else {
                    ctx.fillStyle = "#D9D2B0";
                    ctx.fillRect(x,y,cellSize,cellSize);
                }
            }
        }

        // 2. Подсветка путей
        drawHighlights();
    }

    // ================================================================
    // ПОДСВЕТКА ПУТЕЙ (на основе wordStates)
    // ================================================================
    function drawHighlights() {
        if (!words.length) return;

        const highlightColor = 'rgba(203, 224, 192, 0.55)';
        const foundColor = 'rgba(107, 158, 107, 0.30)';
        const selectedColor = 'rgba(44, 125, 160, 0.25)';

        // Собираем все слова, которые нужно подсветить
        const toHighlight = [];

        for (const w of words) {
            if (!w.placed || !w.path) continue;
            const state = wordStates[w.text];
            if (!state) continue;
            if (state.highlighted) {
                toHighlight.push({ word: w, type: state.found ? 'found' : 'selected' });
            }
        }

        // Рисуем подсветку (слоями: сначала найденные, потом выбранные)
        for (const item of toHighlight) {
            const color = item.type === 'found' ? foundColor : selectedColor;
            const path = item.word.path;
            for (const p of path) {
                if (p.row >= 0 && p.row < gridSize && p.col >= 0 && p.col < gridSize) {
                    const x = p.col * cellSize, y = p.row * cellSize;
                    ctx.fillStyle = color;
                    ctx.fillRect(x, y, cellSize, cellSize);
                    // Перерисовываем букву поверх
                    if (letters[p.row][p.col]) {
                        ctx.fillStyle = "#3E5C4A";
                        ctx.font = `bold ${Math.floor(cellSize*0.5)}px system-ui`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(letters[p.row][p.col], x+cellSize/2, y+cellSize/2);
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'alphabetic';
                    }
                }
            }
        }

        // Дополнительная обводка для выбранного слова (чтобы выделить сильнее)
        const selectedWordObj = words.find(w => w.text === selectedWord && w.placed && w.path);
        if (selectedWordObj && wordStates[selectedWord]?.highlighted) {
            const path = selectedWordObj.path;
            for (const p of path) {
                if (p.row >= 0 && p.row < gridSize && p.col >= 0 && p.col < gridSize) {
                    const x = p.col * cellSize, y = p.row * cellSize;
                    ctx.strokeStyle = "#2C7DA0";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x+1, y+1, cellSize-2, cellSize-2);
                }
            }
        }
    }

    // ================================================================
    // СОСТОЯНИЯ СЛОВ
    // ================================================================
    function initWordStates() {
        const newStates = {};
        for (const w of words) {
            if (w.placed) {
                newStates[w.text] = { found: false, highlighted: false };
            }
        }
        // Сохраняем старые состояния, если они есть
        for (const key in wordStates) {
            if (newStates[key]) {
                newStates[key].found = wordStates[key].found || false;
                newStates[key].highlighted = wordStates[key].highlighted || false;
            }
        }
        wordStates = newStates;
        selectedWord = null;
    }

    function getPlacedWords() {
        return words.filter(w => w.placed);
    }

    function getPlacedCount() {
        return getPlacedWords().length;
    }

    function getFoundCount() {
        let count = 0;
        for (const w of getPlacedWords()) {
            if (wordStates[w.text]?.found) count++;
        }
        return count;
    }

    function updateProgress() {
        const placed = getPlacedCount();
        const found = getFoundCount();
        document.getElementById('progressCounter').textContent = `Найдено: ${found} из ${placed}`;
    }

    // ================================================================
    // ПЕРЕКЛЮЧЕНИЕ ПОДСВЕТКИ СЛОВА
    // ================================================================
    function toggleWord(wordText) {
        const wordObj = words.find(w => w.text === wordText && w.placed);
        if (!wordObj) return;

        const state = wordStates[wordText];
        if (!state) return;

        // Если слово уже найдено — просто переключаем подсветку
        if (state.found) {
            state.highlighted = !state.highlighted;
            drawGrid();
            updateWordListUI();
            return;
        }

        // Для ненайденных: только одно может быть подсвечено
        if (state.highlighted) {
            // Снимаем подсветку
            state.highlighted = false;
            selectedWord = null;
        } else {
            // Снимаем подсветку со всех остальных ненайденных
            for (const w of getPlacedWords()) {
                const s = wordStates[w.text];
                if (s && !s.found) {
                    s.highlighted = false;
                }
            }
            state.highlighted = true;
            selectedWord = wordText;
        }

        drawGrid();
        updateWordListUI();
    }

    function markWordFound(wordText) {
        const state = wordStates[wordText];
        if (!state) return;
        if (state.found) return; // уже найдено
        state.found = true;
        state.highlighted = true; // подсвечиваем автоматически
        updateProgress();
        drawGrid();
        updateWordListUI();
    }

    function checkAllWords() {
        let anyMarked = false;
        for (const w of getPlacedWords()) {
            const state = wordStates[w.text];
            if (state && !state.found) {
                state.found = true;
                state.highlighted = true;
                anyMarked = true;
            }
        }
        if (anyMarked) {
            updateProgress();
            drawGrid();
            updateWordListUI();
        }
    }

    function resetProgress() {
        for (const w of getPlacedWords()) {
            const state = wordStates[w.text];
            if (state) {
                state.found = false;
                state.highlighted = false;
            }
        }
        selectedWord = null;
        updateProgress();
        drawGrid();
        updateWordListUI();
    }

    // ================================================================
    // ОБНОВЛЕНИЕ СПИСКА СЛОВ (С СОСТОЯНИЯМИ)
    // ================================================================
    function updateWordListUI() {
        const container = document.getElementById('wordListContainer');
        if (!container) return;
        container.innerHTML = '';

        let placedCount = 0;
        const allWords = [...termList];

        // Сначала инициализируем состояния для новых слов
        for (const w of words) {
            if (w.placed && !wordStates[w.text]) {
                wordStates[w.text] = { found: false, highlighted: false };
            }
        }

        for (const term of allWords) {
            const placed = words.some(w => w.text === term && w.placed);
            if (placed) placedCount++;

            const state = wordStates[term];
            const isFound = state?.found || false;
            const isHighlighted = state?.highlighted || false;

            const div = document.createElement('div');
            div.className = 'word-item';

            if (!placed) {
                div.classList.add('unplaced');
                div.innerHTML = `<span class="word-text">${term}</span> <span class="word-status">❌</span>`;
            } else {
                let statusText = '';
                let statusClass = '';
                if (isFound) {
                    statusClass = 'found';
                    statusText = '✅';
                } else if (isHighlighted) {
                    statusClass = 'highlighted';
                    statusText = '🔍';
                } else {
                    statusText = '⬜';
                }
                div.classList.add(statusClass);
                div.innerHTML = `
                    <span class="word-text">${term}</span>
                    <span class="word-check">${statusText}</span>
                `;
                if (placed) {
                    div.style.cursor = 'pointer';
                    div.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleWord(term);
                    });
                    // Двойной клик — отметить как найденное
                    div.addEventListener('dblclick', (e) => {
                        e.stopPropagation();
                        markWordFound(term);
                    });
                }
            }
            container.appendChild(div);
        }

        document.getElementById('statsWords').innerText = `(${placedCount}/${allWords.length})`;
        updateProgress();
    }

    // ================================================================
    // АВТОРАССТАНОВКА (без изменений)
    // ================================================================
    function canPlaceWord(word, startRow, startCol, dir) {
        const len = word.length;
        if(dir === 'h'){
            if(startCol+len > gridSize) return false;
            for(let k=0;k<len;k++){
                if(!grid[startRow][startCol+k]) return false;
                const ch = letters[startRow][startCol+k];
                if(ch !== '' && ch !== word[k]) return false;
            }
            return true;
        }
        if(dir === 'v'){
            if(startRow+len > gridSize) return false;
            for(let k=0;k<len;k++){
                if(!grid[startRow+k][startCol]) return false;
                const ch = letters[startRow+k][startCol];
                if(ch !== '' && ch !== word[k]) return false;
            }
            return true;
        }
        if(dir === 'lh'){
            for(let turnAt=1; turnAt<len-1; turnAt++){
                const horizLen = turnAt+1;
                const vertLen = len - horizLen;
                if(startCol+horizLen > gridSize) continue;
                if(startRow+vertLen > gridSize) continue;
                let ok=true;
                for(let k=0;k<horizLen;k++){
                    if(!grid[startRow][startCol+k]) { ok=false; break; }
                    const ch=letters[startRow][startCol+k];
                    if(ch!=='' && ch!==word[k]) { ok=false; break; }
                }
                if(!ok) continue;
                for(let k=0;k<vertLen;k++){
                    const r = startRow+k;
                    const c = startCol+turnAt;
                    if(!grid[r][c]) { ok=false; break; }
                    const ch=letters[r][c];
                    if(ch!=='' && ch!==word[turnAt+k]) { ok=false; break; }
                }
                if(ok) return true;
            }
        }
        if(dir === 'lv'){
            for(let turnAt=1; turnAt<len-1; turnAt++){
                const vertLen = turnAt+1;
                const horizLen = len - vertLen;
                if(startRow+vertLen > gridSize) continue;
                if(startCol+horizLen > gridSize) continue;
                let ok=true;
                for(let k=0;k<vertLen;k++){
                    if(!grid[startRow+k][startCol]) { ok=false; break; }
                    const ch=letters[startRow+k][startCol];
                    if(ch!=='' && ch!==word[k]) { ok=false; break; }
                }
                if(!ok) continue;
                for(let k=0;k<horizLen;k++){
                    const r = startRow+turnAt;
                    const c = startCol+k;
                    if(!grid[r][c]) { ok=false; break; }
                    const ch=letters[r][c];
                    if(ch!=='' && ch!==word[turnAt+k]) { ok=false; break; }
                }
                if(ok) return true;
            }
        }
        return false;
    }

    function placeWord(word, startRow, startCol, dir) {
        const len = word.length;
        const path = [];
        if(dir === 'h'){
            for(let k=0;k<len;k++){
                letters[startRow][startCol+k] = word[k];
                path.push({row:startRow, col:startCol+k});
            }
            words.push({text:word, placed:true, path});
            return true;
        }
        if(dir === 'v'){
            for(let k=0;k<len;k++){
                letters[startRow+k][startCol] = word[k];
                path.push({row:startRow+k, col:startCol});
            }
            words.push({text:word, placed:true, path});
            return true;
        }
        if(dir === 'lh'){
            for(let turnAt=1; turnAt<len-1; turnAt++){
                const horizLen = turnAt+1;
                const vertLen = len - horizLen;
                if(startCol+horizLen <= gridSize && startRow+vertLen <= gridSize){
                    let ok=true;
                    for(let k=0;k<horizLen;k++) if(!grid[startRow][startCol+k]) ok=false;
                    for(let k=0;k<vertLen;k++) if(!grid[startRow+k][startCol+turnAt]) ok=false;
                    if(ok){
                        for(let k=0;k<horizLen;k++) letters[startRow][startCol+k] = word[k];
                        for(let k=0;k<vertLen;k++) letters[startRow+k][startCol+turnAt] = word[turnAt+k];
                        for(let k=0;k<horizLen;k++) path.push({row:startRow, col:startCol+k});
                        for(let k=1;k<vertLen;k++) path.push({row:startRow+k, col:startCol+turnAt});
                        words.push({text:word, placed:true, path});
                        return true;
                    }
                }
            }
        }
        if(dir === 'lv'){
            for(let turnAt=1; turnAt<len-1; turnAt++){
                const vertLen = turnAt+1;
                const horizLen = len - vertLen;
                if(startRow+vertLen <= gridSize && startCol+horizLen <= gridSize){
                    let ok=true;
                    for(let k=0;k<vertLen;k++) if(!grid[startRow+k][startCol]) ok=false;
                    for(let k=0;k<horizLen;k++) if(!grid[startRow+turnAt][startCol+k]) ok=false;
                    if(ok){
                        for(let k=0;k<vertLen;k++) letters[startRow+k][startCol] = word[k];
                        for(let k=0;k<horizLen;k++) letters[startRow+turnAt][startCol+k] = word[turnAt+k];
                        for(let k=0;k<vertLen;k++) path.push({row:startRow+k, col:startCol});
                        for(let k=1;k<horizLen;k++) path.push({row:startRow+turnAt, col:startCol+k});
                        words.push({text:word, placed:true, path});
                        return true;
                    }
                }
            }
        }
        return false;
    }

    function autoPlaceWords() {
        letters = Array(gridSize).fill().map(()=>Array(gridSize).fill(''));
        words = [];
        const sorted = [...termList].sort((a,b)=>b.length - a.length);
        let placedCount = 0;
        for(const word of sorted){
            let placed = false;
            for(let i=0;i<gridSize && !placed;i++){
                for(let j=0;j<gridSize && !placed;j++){
                    if(!grid[i][j]) continue;
                    const dirs = ['h','v','lh','lv'];
                    for(const d of dirs){
                        if(canPlaceWord(word, i, j, d)){
                            placeWord(word, i, j, d);
                            placed = true;
                            break;
                        }
                    }
                }
            }
            if(placed) placedCount++;
        }
        // Инициализируем состояния для размещённых слов
        initWordStates();
        drawGrid();
        updateWordListUI();
        updateProgress();
    }

    // ================================================================
    // ОЧИСТКА СЕТКИ
    // ================================================================
    function clearGrid(){
        letters = Array(gridSize).fill().map(()=>Array(gridSize).fill(''));
        words = [];
        wordStates = {};
        selectedWord = null;
        drawGrid();
        updateWordListUI();
        updateProgress();
    }

    // ================================================================
    // ЗАГРУЗКА / ДОБАВЛЕНИЕ СЛОВ
    // ================================================================
    function loadWordsFromFile(file){
        const reader = new FileReader();
        reader.onload = (e) => {
            const content = e.target.result;
            const lines = content.split(/\r?\n/).filter(l=>l.trim().length>0);
            termList = lines.map(l=>l.trim());
            updateWordListUI();
            clearGrid();
        };
        reader.readAsText(file, 'UTF-8');
    }

    function addWordManually(){
        const newWord = document.getElementById('newWordInput').value.trim();
        if(newWord && !termList.includes(newWord)){
            termList.push(newWord);
            updateWordListUI();
            document.getElementById('newWordInput').value = '';
            clearGrid();
        } else {
            alert("Слово уже есть или пустое");
        }
    }

    // ================================================================
    // ЭКСПОРТ В HTML (без изменений — студенческая версия)
    // ================================================================
    function exportFillword() {
        if(termList.length===0){ alert("Добавьте слова"); return; }
        const shapeMask = grid;
        const gridLetters = letters;
        const wordListForExport = termList;
        const htmlContent = `<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Филворд (венгерский кроссворд)</title><style>
*{box-sizing:border-box;} body{background:#FDF8F0; font-family:system-ui; padding:1rem;} .container{max-width:800px; margin:0 auto; background:white; border-radius:2rem; padding:1.5rem;}
canvas{display:block; margin:0 auto; background:#FDF8F0; border-radius:1rem;} .word-list{display:flex; flex-wrap:wrap; gap:12px; margin-top:1.5rem;} .word-card{background:#EBE3D2; padding:6px 14px; border-radius:2rem;}
button{background:#A3B18A; border:none; padding:8px 20px; border-radius:2rem; margin-top:1rem; cursor:pointer;} .answers{display:none; margin-top:1rem; background:#F2EDE0; padding:1rem; border-radius:1rem;}
</style></head>
<body><div class="container"><h2>🧩 Филворд</h2><canvas id="fillCanvas" width="${gridSize*cellSize}" height="${gridSize*cellSize}"></canvas>
<div class="word-list"><strong>Найдите слова:</strong> ${wordListForExport.map(w=>`<div class="word-card">${w}</div>`).join('')}</div>
<button id="showAnswersBtn">📖 Показать ответы</button><div id="answersDiv" class="answers"></div>
<footer style="font-size:0.7rem; margin-top:1rem;">© Образовательный филворд. Не для коммерческого использования.</footer>
</div><script>
const size=${gridSize}, cell=${cellSize};
const mask=${JSON.stringify(shapeMask)};
const lettersData=${JSON.stringify(gridLetters)};
const canvas=document.getElementById('fillCanvas'); const ctx=canvas.getContext('2d');
canvas.width=size*cell; canvas.height=size*cell;
function draw(){ ctx.clearRect(0,0,canvas.width,canvas.height);
 for(let i=0;i<size;i++) for(let j=0;j<size;j++){ let x=j*cell, y=i*cell;
   if(mask[i][j]){ ctx.fillStyle="#FFFFFF"; ctx.fillRect(x,y,cell,cell); ctx.strokeStyle="#D4CDB5"; ctx.strokeRect(x,y,cell,cell);
     if(lettersData[i][j]){ ctx.fillStyle="#3E5C4A"; ctx.font="bold 20px system-ui"; ctx.fillText(lettersData[i][j], x+12, y+28);}
   } else { ctx.fillStyle="#D9D2B0"; ctx.fillRect(x,y,cell,cell);}
 }}
draw();
document.getElementById('showAnswersBtn').addEventListener('click',()=>{
  let answersDiv=document.getElementById('answersDiv');
  if(answersDiv.style.display==='block'){ answersDiv.style.display='none'; }
  else{
    let wordPaths = ${JSON.stringify(words.map(w=>({text:w.text, path:w.path})))}; 
    let html='<strong>Ответы (обведены на схеме):</strong><br>';
    for(let w of wordPaths){
        html+=\`<div>\${w.text}: \${w.path.map(p=>\`(\${p.row+1},\${p.col+1})\`).join(' → ')}</div>\`;
    }
    answersDiv.innerHTML=html;
    answersDiv.style.display='block';
  }
});
<\/script></body></html>`;
        const blob = new Blob([htmlContent], {type:'text/html'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'fillword_ready.html';
        link.click();
        URL.revokeObjectURL(link.href);
        alert("Филворд экспортирован как fillword_ready.html");
    }

    // ================================================================
    // СОБЫТИЯ
    // ================================================================
    document.getElementById('wordsFile').addEventListener('change', (e)=>{
        if(e.target.files[0]) loadWordsFromFile(e.target.files[0]);
        e.target.value = '';
    });
    document.getElementById('gridShapeSelect').addEventListener('change', (e)=>{
        loadShape(e.target.value);
        if(termList.length) autoPlaceWords();
    });
    document.getElementById('autoPlaceBtn').addEventListener('click', ()=>{
        if(termList.length===0){ alert("Загрузите или добавьте слова"); return; }
        autoPlaceWords();
    });
    document.getElementById('exportBtn').addEventListener('click', exportFillword);
    document.getElementById('resetBtn').addEventListener('click', clearGrid);
    document.getElementById('addWordBtn').addEventListener('click', addWordManually);

    // НОВЫЕ КНОПКИ
    document.getElementById('checkAllBtn').addEventListener('click', checkAllWords);
    document.getElementById('resetProgressBtn').addEventListener('click', resetProgress);

    // ================================================================
    // ИНИЦИАЛИЗАЦИЯ (демо)
    // ================================================================
    termList = ["Лопатка","Плечевая","Лучевая","Локтевая","Запястье","Пясть","Фаланга"];
    loadShape('rect');
    updateWordListUI();
    clearGrid();
    // Авторасстановка после загрузки
    setTimeout(autoPlaceWords, 50);
</script>
</body>
</html>
